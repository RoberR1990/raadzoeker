<script>
"use strict";
const META=JSON.parse(document.getElementById('meta').textContent);
const SRC=META.src, SPK=META.spk, PAR=META.par, ROLES=META.roles;
const $=id=>document.getElementById(id);
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MNDL=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DAG=['zo','ma','di','wo','do','vr','za'];
const ZIT=['','ochtendzitting','middagzitting','avondzitting','nachtzitting'];
const KIND=['','Motietekst / stemming','Presentielijst','Sprekerstijdlijn','Uitzending (automatische ondertiteling)'];
const Y=[];              // geladen jaren
const PAGE=30;
let shown=PAGE, RES=null, lastKey='';

/* ---------- normalisatie: 1 teken in = 1 teken uit, zodat posities kloppen ---------- */
const T=new Uint8Array(65536).fill(63);
for(let c=0;c<128;c++)T[c]=String.fromCharCode(c).toLowerCase().charCodeAt(0);
T[9]=32;T[10]=32;T[13]=32;
for(let c=128;c<0x250;c++){const d=String.fromCharCode(c).toLowerCase().normalize('NFD').charCodeAt(0);if(d<128)T[c]=d;}
const SPEC={'‘':"'",'’':"'",'ʼ':"'",'ꞌ':"'",'´':"'",'`':"'",'‚':"'",'“':'"','”':'"','„':'"','«':'"','»':'"','–':'-','—':'-','‑':'-',' ':' ','ı':'i','ø':'o','ß':'s','…':'.','æ':'a','œ':'o'};
for(const k in SPEC)T[k.charCodeAt(0)]=SPEC[k].charCodeAt(0);
function norm(s){let o='';for(let i=0;i<s.length;i++)o+=String.fromCharCode(T[s.charCodeAt(i)]);return o;}
function normQ(s){return norm(s).replace(/\s+/g,' ').trim();}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fdate(d,long){const t=new Date(d+'T12:00:00');return long?(t.getDate()+' '+MNDL[t.getMonth()]+' '+t.getFullYear()):(DAG[t.getDay()]+' '+t.getDate()+' '+MND[t.getMonth()]+' '+t.getFullYear());}
const nf=n=>n.toLocaleString('nl-NL');
function hms(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}

/* ---------- laden ---------- */
/* data staat per jaar in een los bestand (META.dir + JAAR.zst); alle downloads starten meteen, verwerken gaat nieuwste jaar eerst */
const tick=()=>new Promise(r=>setTimeout(r,0));
async function loadAll(){
  const ys=META.years.slice().sort((a,b)=>b.y-a.y), tot=ys.reduce((a,b)=>a+b.z,0);let done=0;
  const get=m=>fetch(META.dir+m.y+'.zst?v='+m.h).then(r=>{if(!r.ok)throw new Error(m.y+': '+r.status);return r.arrayBuffer();});
  const P=ys.map(get);P.forEach(p=>p.catch(()=>{}));
  for(let k=0;k<ys.length;k++){
    const m=ys[k];
    $('loadtxt').textContent='Laden… '+m.y;
    const buf=new Uint8Array(await P[k]);
    if(buf.length!==m.z)throw new Error(m.y+': onvolledig bestand');
    await tick();
    const bytes=fzstd.decompress(buf);
    await tick();
    const D=JSON.parse(new TextDecoder().decode(bytes));
    await tick();
    prep(D,+m.y);Y.push(D);Y.sort((a,b)=>b.y-a.y);
    done+=m.z;$('loadbar').style.width=(100*done/tot)+'%';
    update(true);
  }
  $('loadtxt').textContent=nf(Y.reduce((a,y)=>a+y.nSp,0))+' spreekbeurten · '+Y.reduce((a,y)=>a+y.M.length,0)+' vergaderingen';
  $('load').querySelector('.bar').style.display='none';
}
function prep(D,y){
  D.y=y;const S=D.s,t=S.t,n=t.length;let L=0;for(let i=0;i<n;i++)L+=t[i].length+1;
  const u=new Uint8Array(L),off=new Int32Array(n+1);let k=0;
  const w=new Int32Array(n);for(let i=0;i<n;i++){off[i]=k;const s=t[i];let c=s.length?1:0;for(let j=0;j<s.length;j++){const b=T[s.charCodeAt(j)];if(b===32)c++;u[k++]=b;}w[i]=S.k[i]===2?0:c;u[k++]=1;}D.w=w;if(!D.mo)D.mo=[];D.moN=D.mo.map(m=>norm(m[3]));D.moM={};D.mo.forEach((m,k)=>{const mm=S.m[m[0]];(D.moM[mm]=D.moM[mm]||[]).push(k);});if(!D.tz)D.tz=[];if(!D.sm)D.sm={};
  off[n]=k;D.off=off;D.N=new TextDecoder('ascii').decode(u);
  D.ic=new Int32Array(D.I.length);D.first=new Int32Array(D.I.length).fill(-1);D.mc=new Int32Array(D.M.length);D.nSp=0;
  for(let i=0;i<n;i++){const it=S.i[i];D.ic[it]++;if(D.first[it]<0)D.first[it]=i;if(S.k[i]===0||S.k[i]===4){D.mc[S.m[i]]++;D.nSp++;}else if(S.k[i]===3)D.mc[S.m[i]]++;}
  D.In=D.I.map(x=>norm(x[1]+' '+x[2]));
}

/* ---------- thema's: vaste zoeksets (termen gescheiden door | ; "x" = heel woord) ---------- */
const THEMES=META.themes, TSTR={};
THEMES.forEach(g=>g[1].forEach(th=>{TSTR[th[1]]={th,sub:-1};th[2].forEach((s,k)=>{TSTR[s[1]]={th,sub:k};});}));
const PALIAS={'Partij voor de Dieren':['partij voor de dieren','pvdd'],'ChristenUnie-SGP':['christenunie','cu-sgp'],'Leefbaar Rotterdam':['leefbaar'],'Forum voor Democratie':['forum voor democratie','fvd'],'50PLUS':['50plus','50+']};

/* ---------- toestand ---------- */
const F=['q','q2','fs','fp','fr','fd1','fd2','fa','fk','fc'];
let VIEW='t', MRES='', wantSort='new';
function state(){const s={};for(const f of F)s[f]=$(f).value.trim();s.ww=$('ww').checked;s.sort=wantSort;s.view=VIEW;s.mres=MRES;s.zt=ZT;s.mode=MODE;return s;}
function active(s){return !!(s.q||s.q2||s.fs||s.fp||s.fr||s.fd1||s.fd2||s.fa||s.fc||s.fk!=='01');}
function toHash(s){const p=new URLSearchParams();for(const f of F)if(s[f]&&!(f==='fk'&&s[f]==='01'))p.set(f,s[f]);if(s.ww)p.set('ww','1');if(s.sort!=='new')p.set('sort',s.sort);if(VIEW!=='t')p.set('v',VIEW);if(MRES)p.set('mres',MRES);if(ZT)p.set('zt',ZT);if(MODE==='tl')p.set('mode','tl');const h=p.toString();history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}

function parseTerms(q,ww){return q.split('|').map(x=>x.trim()).filter(Boolean).map(x=>{const m=/^"(.+)"$/.exec(x);const t=normQ(m?m[1]:x);return {t,w:!!m||ww,label:m?m[1]:x};}).filter(x=>x.t);}

/* ---------- zoeken ---------- */
function isW(c){return (c>=97&&c<=122)||(c>=48&&c<=57);}
function search(s){
  let terms=parseTerms(s.q,s.ww),t2=parseTerms(s.q2,s.ww);
  if(!terms.length){terms=t2;t2=[];}
  const fsn=normQ(s.fs);let spSet=null;
  if(fsn){spSet=new Set();SPK.forEach((x,i)=>{if(norm(x[0]).includes(fsn))spSet.add(i);});}
  const pIdx=s.fp?PAR.indexOf(s.fp):-2, fa=normQ(s.fa), kinds=s.fk, role=s.fr, hasQ=terms.length>0;
  const rOK=r=>{switch(role){case'':return true;case'raad':return r===0;case'college':return r===2||r===3;case'wethouder':return r===2;case'burgemeester':return r===3;case'voorzitter':return r===1;case'nietvz':return r!==1;default:return r>=4;}};
  const res=[];let hits=0;const ty=terms.map(()=>({})),wy={},wp={},tot=terms.map(()=>0);
  for(const D of Y){
    const S=D.s,n=S.t.length,N=D.N,off=D.off;
    const mOK=D.M.map(m=>(!s.fd1||m[0]>=s.fd1)&&(!s.fd2||m[0]<=s.fd2)&&(!s.fc||m[2]===s.fc));
    if(!mOK.some(Boolean))continue;
    const iOK=fa?D.In.map(x=>x.includes(fa)):null;
    const ok=i=>{const k=S.k[i];
      if(k===3){if(hasQ||!kinds.includes('0'))return false;}else if(k===4){if(!kinds.includes('0'))return false;}else if(!kinds.includes(String(k)))return false;
      if(!mOK[S.m[i]])return false;if(iOK&&!iOK[S.i[i]])return false;
      if(spSet&&!spSet.has(S.sp[i]))return false;if(pIdx!==-2&&S.pa[i]!==pIdx)return false;
      if(role&&(S.sp[i]<0||!rOK(S.ro[i])))return false;
      if((spSet||pIdx!==-2)&&S.sp[i]<0)return false;return true;};
    const okc=new Int8Array(n);let wsum=0;
    for(let i=0;i<n;i++){if(ok(i)){okc[i]=1;wsum+=D.w[i];const p=S.pa[i];if(p>=0)wp[p]=(wp[p]||0)+D.w[i];}}
    wy[D.y]=wsum;
    if(hasQ){
      const cnt=new Int32Array(n);
      if(t2.length){for(let i=0;i<n;i++){if(!okc[i])continue;let f=false;for(const x of t2){const p=N.indexOf(x.t,off[i]);if(p>=0&&p<off[i+1]){f=true;break;}}if(!f)okc[i]=0;}}
      terms.forEach((tm,ti)=>{let pos=0,seg=0,c=0;const q=tm.t,ql=q.length;
        while((pos=N.indexOf(q,pos))!==-1){
          if(tm.w&&((pos>0&&isW(N.charCodeAt(pos-1)))||isW(N.charCodeAt(pos+ql)))){pos++;continue;}
          while(off[seg+1]<=pos)seg++;
          if(okc[seg]){cnt[seg]++;c++;}
          pos+=ql;}
        ty[ti][D.y]=c;tot[ti]+=c;hits+=c;});
      for(let i=0;i<n;i++)if(cnt[i])res.push({D,i,c:cnt[i]});
    }else{for(let i=0;i<n;i++)if(okc[i])res.push({D,i,c:0});}
  }
  return {res,hits,terms,t2,ty,tot,wy,wp,q:hasQ};
}
function sortRes(R,how){
  const d=o=>o.D.M[o.D.s.m[o.i]][0];
  if(how==='old')R.res.sort((a,b)=>d(a)<d(b)?-1:d(a)>d(b)?1:a.i-b.i);
  else if(how==='hits'&&R.q)R.res.sort((a,b)=>b.c-a.c||(d(a)<d(b)?1:d(a)>d(b)?-1:a.i-b.i));
  else R.res.sort((a,b)=>d(a)<d(b)?1:d(a)>d(b)?-1:a.i-b.i);
}

function ranges(text,terms){
  const nt=norm(text),r=[];
  for(const tm of terms){if(!tm||!tm.t)continue;const t=tm.t;let p=0;while((p=nt.indexOf(t,p))!==-1){if(tm.w&&((p>0&&isW(nt.charCodeAt(p-1)))||isW(nt.charCodeAt(p+t.length)))){p++;continue;}r.push([p,p+t.length]);p+=t.length;}}
  r.sort((a,b)=>a[0]-b[0]);const o=[];for(const x of r){if(o.length&&x[0]<=o[o.length-1][1])o[o.length-1][1]=Math.max(o[o.length-1][1],x[1]);else o.push(x);}
  return o;
}
const allTerms=()=>RES&&RES.q?RES.terms.concat(RES.t2):[];
function markup(text,rs,from,to){
  let h='',p=from;

  return h+esc(text.slice(p,to));
}
function paras(text,rs){let h='',p=0;for(const part of text.split('\n')){h+='<p>'+markup(text,rs,p,p+part.length)+'</p>';p+=part.length+1;}return h;}
function snipRanges(text,rs){
  if(!rs.length){const cut=text.length>340?text.lastIndexOf(' ',340):text.length;return [[0,cut>0?cut:Math.min(340,text.length)]];}
  const W=170,wins=[];
  for(const [a,b] of rs){if(wins.length&&a-wins[wins.length-1][1]<W){wins[wins.length-1][1]=Math.min(text.length,b+W);continue;}if(wins.length>=3)break;wins.push([Math.max(0,a-W),Math.min(text.length,b+W)]);}
  return wins.map(w=>{let a=w[0],b=w[1];if(a>0){const s=text.indexOf(' ',a);if(s>0&&s<a+30)a=s+1;}if(b<text.length){const s=text.lastIndexOf(' ',b);if(s>b-30)b=s;}return [a,b];});
}
function snippets(text,rs){
  return snipRanges(text,rs).map(([a,b])=>'<p>'+(a>0?'<span class="more">… </span>':'')+markup(text,rs,a,b).replace(/\n/g,' ')+(b<text.length?'<span class="more"> …</span>':'')+'</p>').join('');
}

function trendHTML(R){

    I.names.map((nm,k)=>{const row=I.tw[k],mean=row.reduce((a,b)=>a+b,0)/row.length||1e-9;const gi=GS.indexOf(k);return (gi>=0?'<tr class="grp"><th colspan="99">'+esc(THEMES[gi][0])+'</th></tr>':'')+'<tr><th><a data-theme="'+esc(FL[k][1])+'">'+esc(nm)+'</a></th>'+row.map((v,j)=>{const r=v/mean,pct=r>1?Math.min(85,(r-1)*40):0;return I.twn[k][j]<5?'<td class="lo" title="te weinig treffers">·</td>':'<td data-ins="w:'+k+':'+j+'" title="'+esc(nm+' · '+I.coll[j]+': '+I.twn[k][j]+' treffers, '+r1(v)+' per 100.000 woorden')+'" style="background:color-mix(in srgb,var(--accent) '+Math.round(pct)+'%,transparent);'+(pct>48?'color:var(--accent-ink)':'')+'"><span'+(r<0.75?' class="lo"':'')+'>'+r1(r)+'×</span></td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div><p class="hint" style="margin:8px 0 0">Laat vooral de portefeuilles zien: een wethouder praat het meest over het eigen dossier. Alleen wat zij zeiden als collegelid, niet als voorzitter.</p></div>';
}
/* ---------- inzichten ---------- */
let INSP='';
function spark(v){const mx=Math.max(1e-9,...v),W=84,H=22;return '<svg class="spk" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><polyline points="'+v.map((x,i)=>(2+i*(W-4)/Math.max(1,v.length-1)).toFixed(1)+','+(H-2-(H-4)*x/mx).toFixed(1)).join(' ')+'"/></svg>';}
function renderInsights(){
  const I=META.ins,FL=THEMES.flatMap(g=>g[1]),n1=THEMES[0][1].length,c1=v=>String(Math.round(v)),r1=v=>v.toFixed(1).replace('.',',');
  const cell=(pct,txt,title,data)=>'<td'+(data?' data-ins="'+data+'"':'')+' title="'+esc(title)+'" style="background:color-mix(in srgb,var(--accent) '+Math.round(pct)+'%,transparent);'+(pct>48?'color:var(--accent-ink)':'')+'">'+txt+'</td>';
  const GS=[];let acc_=0;THEMES.forEach(g=>{GS.push(acc_);acc_+=g[1].length;});const head=k=>{const gi=GS.indexOf(k);return gi>=0?'<tr class="grp"><th colspan="99">'+esc(THEMES[gi][0])+'</th></tr>':'';};
  let h=tabsHTML()+'<p class="hint">Patronen in wat er gezegd is, op basis van de thema’s (vaste lijstjes zoektermen). De getallen zijn treffers per 100.000 gesproken woorden, zodat drukke en rustige jaren en grote en kleine fracties vergelijkbaar zijn. Klik op een cel om de teksten erachter te zien.</p>';
  const yi=y=>I.years.indexOf(y),avg=(row,ys)=>{const v=ys.map(y=>row[yi(y)]).filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length;};
  const EY=I.years.slice(0,I.years.length>=7?4:Math.max(1,Math.floor(I.years.length/2))),LY=I.years.slice(-Math.min(2,Math.max(1,I.years.length-EY.length))),per=a=>a.length>1?a[0]+'–'+a[a.length-1]:a[0];
  const mv=I.names.map((nm,k)=>({k,nm,early:avg(I.ty[k],EY),late:avg(I.ty[k],LY),n:I.tyn[k].reduce((a,b)=>a+b,0)})).filter(o=>o.n>=100&&o.early>0).map(o=>(o.ch=(o.late-o.early)/o.early,o));
  const up=mv.slice().sort((a,b)=>b.ch-a.ch).slice(0,6),dn=mv.slice().sort((a,b)=>a.ch-b.ch).slice(0,6);
  const mrow=o=>'<button type="button" data-theme="'+esc(FL[o.k][1])+'"><span class="t">'+esc(o.nm)+'</span>'+spark(I.ty[o.k])+'<span class="v '+(o.ch>=0?'up':'dn')+'">'+(o.ch>=0?'+':'−')+Math.abs(Math.round(o.ch*100))+'%</span></button>';
  if(I.years.length>1)h+='<div class="charts"><div class="chart"><h3>Stijgers · '+per(LY)+' vergeleken met '+per(EY)+'</h3><div class="mv">'+up.map(mrow).join('')+'</div></div><div class="chart"><h3>Dalers · '+per(LY)+' vergeleken met '+per(EY)+'</h3><div class="mv">'+dn.map(mrow).join('')+'</div></div></div>';
  h+=riseHTML();
  h+='<div class="chart wide"><h3>Wanneer leeft wat · thema per jaar (kleur = aandeel van het piekjaar van dat thema)</h3><div class="hscroll"><table class="heat"><thead><tr><th></th>'+I.years.map(y=>'<th>'+y+'</th>').join('')+'</tr></thead><tbody>'+
    I.names.map((nm,k)=>{const mx=Math.max(1e-9,...I.ty[k]);return head(k)+'<tr><th><a data-theme="'+esc(FL[k][1])+'">'+esc(nm)+'</a></th>'+I.ty[k].map((v,j)=>cell(85*v/mx,c1(v),nm+' · '+I.years[j]+': '+I.tyn[k][j]+' treffers, '+r1(v)+' per 100.000 woorden','y:'+k+':'+I.years[j])).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';
  h+='<div class="chart wide"><h3>Wie heeft het waarover · thema per fractie (raadsleden, alle jaren samen; 1,0× = gemiddelde van de fracties)</h3><div class="hscroll"><table class="heat"><thead><tr><th></th>'+I.parties.map(p=>'<th class="rot"><span>'+esc(p)+'</span></th>').join('')+'</tr></thead><tbody>'+
    I.names.map((nm,k)=>{const row=I.tp[k],mean=row.reduce((a,b)=>a+b,0)/row.length||1e-9;return head(k)+'<tr><th><a data-theme="'+esc(FL[k][1])+'">'+esc(nm)+'</a></th>'+row.map((v,j)=>{const r=v/mean;return I.tpn[k][j]<5?'<td class="lo" title="te weinig treffers">·</td>':cell(r>1?Math.min(85,(r-1)*65):0,'<span'+(r<0.75?' class="lo"':'')+'>'+r1(r)+'×</span>',nm+' · '+I.parties[j]+': '+I.tpn[k][j]+' treffers, '+r1(v)+' per 100.000 woorden','p:'+k+':'+j);}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';
  h+=collHTML();
  const pj=I.parties.indexOf(INSP);
  h+='<div class="chart wide"><h3>Profiel van een fractie</h3><select id="insp" aria-label="Fractie" style="width:auto"><option value="">Kies een fractie…</option>'+I.parties.map(p=>'<option'+(p===INSP?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select>';
  if(pj>=0){const rs=I.names.map((nm,k)=>{const row=I.tp[k],mean=row.reduce((a,b)=>a+b,0)/row.length||1e-9;return {k,nm,r:row[pj]/mean,n:I.tpn[k][pj]};}).filter(o=>o.n>=10).sort((a,b)=>b.r-a.r);
    const li=o=>'<button type="button" data-ins="p:'+o.k+':'+pj+'"><span class="t">'+esc(o.nm)+'</span><span class="b" style="width:'+Math.min(100,Math.round(o.r*40))+'%"></span><span class="v">'+r1(o.r)+'×</span></button>';
    h+='<div class="charts" style="margin:10px 0 0"><div><p class="hint">Hier heeft '+esc(INSP)+' het vaker over dan andere fracties</p><div class="hbars">'+rs.slice(0,6).map(li).join('')+'</div></div><div><p class="hint">En hier minder vaak</p><div class="hbars">'+rs.slice(-6).reverse().map(li).join('')+'</div></div></div>';}
  h+='</div><p class="hint">Lees dit als signaal, niet als meting: een thema is een lijstje woorden, dus een fractie die andere woorden gebruikt voor hetzelfde onderwerp telt minder mee. De fractiecijfers gaan over raadsleden, niet over wethouders.</p>';
  $('out').innerHTML=h;
}
$('out').addEventListener('click',e=>{
  const c=e.target.closest('[data-ins]');
  if(c){const [kind,k,x]=c.dataset.ins.split(':'),FL=THEMES.flatMap(g=>g[1]);for(const f of F)$(f).value=f==='fk'?'01':'';$('q').value=FL[+k][1];
    if(kind==='y'){$('fd1').value=x+'-01-01';$('fd2').value=x+'-12-31';}else if(kind==='w'){$('fs').value=META.ins.coll[+x];}else{$('fp').value=META.ins.parties[+x];$('fr').value='raad';}
    VIEW='t';update(false);window.scrollTo(0,0);return;}
  const s=e.target.closest('[data-scroll]');if(s){const el=document.getElementById(s.dataset.scroll);if(el)el.scrollIntoView({behavior:'smooth'});return;}
  if(e.target.closest('[data-focus]')){$('q').focus();window.scrollTo(0,0);}
});
$('out').addEventListener('change',e=>{if(e.target.id==='insp'){INSP=e.target.value;renderInsights();}});
function fillMeeting(el){
  if(el.dataset.done)return;el.dataset.done=1;
  const [y,mi]=el.dataset.m.split(':').map(Number),D=Y.find(d=>d.y===y);
  let h='<ol>';D.I.forEach((it,k)=>{if(it[0]!==mi)return;h+='<li><span class="nr">'+esc(it[1])+'</span><a data-item="'+y+':'+k+'">'+esc(it[2]||'(voor het eerste agendapunt)')+'</a>'+(D.sm[k]?'<span class="tag party">samenvatting</span>':'')+'<span class="c">'+(D.ic[k]||'–')+'</span></li>';});
  h+='</ol>';el.insertAdjacentHTML('beforeend',h);
}

/* ---------- lezer ---------- */
let RD=null;
function openReader(D,it,focus){
  RD={D,it};const S=D.s,x=D.I[it],m=D.M[x[0]];
  $('rmeta').textContent=fdate(m[0],false)+(m[2]&&m[2]!=='Gemeenteraad'?' · '+m[2]:'')+(m[3]===1?'':m[3]===2?' · nog geen notulen: tekst is automatische ondertiteling van de uitzending':' · nog geen notulen, alleen sprekerstijdlijn');
  $('rtitle').textContent=itemLabel(D,it);
  const terms=allTerms();let h='',first=D.first[it];const sm=D.sm&&D.sm[it];
  if(sm)h+='<div class="sm"><div class="smh">Samenvatting <span class="tag warn">door AI gemaakt · kan fouten bevatten · lees het debat voor je iets overneemt</span></div><p>'+esc(sm[0])+'</p>'+(sm[1].length?'<ul>'+sm[1].map(x=>'<li><b>'+esc(x[0])+':</b> '+esc(x[1])+'</li>').join('')+'</ul>':'')+(sm[2]?'<p><b>Uitkomst:</b> '+esc(sm[2])+'</p>':'')+'</div>';
  if(first<0)h+='<div class="empty">Bij dit agendapunt zijn geen sprekers of teksten vastgelegd.</div>';
  else{
    $('rlinks').innerHTML=links(D,first).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+' ↗</a>').join('');
    for(let i=first;i<S.t.length&&S.i[i]===it;i++){
      const w=who(D,i),k=S.k[i],text=S.t[i];
      h+='<div class="sp'+(k===1||k===2?' doc':'')+(S.ro[i]===1&&k===0?' chair':'')+(i===focus?' focus':'')+'" data-i="'+i+'"><div class="h"><b>'+esc(w.name)+'</b>'+(w.party?'<span class="tag party">'+esc(w.party)+'</span>':'')+(w.role&&w.role!=='raadslid'?'<span class="tag">'+w.role+'</span>':'')+
        (k===3?'<span class="tag warn">'+hms(S.pg[i])+'</span>':'<span class="sub">'+(k!==4&&S.pg[i]?'p. '+S.pg[i]:'')+'</span>'+vbtn(D,i,'rvideo')+'<button class="btn small cp" data-act="rcopy" type="button">Kopieer citaat</button>')+'</div>'+
        (k===3?'':paras(text,ranges(text,terms)))+'</div>';
    }
  }
  if(first<0)$('rlinks').innerHTML=m[1]?'<a href="'+SRC+'/Agenda/Index/'+m[1]+'" target="_blank" rel="noopener">Vergadering (iBabs) ↗</a>':'';
  $('rbody').innerHTML=h;$('reader').classList.add('on');document.body.style.overflow='hidden';
  const f=$('rbody').querySelector('.focus');$('rbody').scrollTop=0;if(f)f.scrollIntoView({block:'start'});
  const same=k=>k>=0&&k<D.I.length&&D.I[k][0]===x[0];
  $('rprev').disabled=!same(it-1);$('rnext').disabled=!same(it+1);
}
function closeReader(){$('reader').classList.remove('on');document.body.style.overflow='';RD=null;}

/* ---------- regie ---------- */
let deb;
function update(fromLoad){
  const s=state();
  const key=JSON.stringify(s)+Y.length;
  if(key===lastKey)return;
  if(!fromLoad){shown=PAGE;toHash(s);}
  lastKey=key;
  if(VIEW==='m'){RES=null;renderMotions(s);return;}
  if(VIEW==='i'){RES=null;renderInsights();return;}
  if(VIEW==='z'){RES=null;renderToez(s);return;}
  if(!active(s)){RES=null;renderBrowse();return;}
  RES=search(s);sortRes(RES,s.sort);renderResults(s);
}
function schedule(){clearTimeout(deb);deb=setTimeout(()=>update(false),180);}
for(const f of F){$(f).addEventListener('input',schedule);$(f).addEventListener('change',schedule);}
$('ww').addEventListener('change',schedule);
$('theme').addEventListener('change',e=>{if(e.target.value){$('q').value=e.target.value;e.target.value='';VIEW='t';update(false);}});
$('reset').addEventListener('click',()=>{for(const f of F)$(f).value=f==='fk'?'01':'';$('ww').checked=false;wantSort='new';MRES='';ZT='';MODE='l';update(false);$('q').focus();});
$('out').addEventListener('change',e=>{if(e.target.id==='sort'){wantSort=e.target.value;update(false);}if(e.target.id==='mres'){MRES=e.target.value;update(false);}if(e.target.id==='ztype'){ZT=e.target.value;update(false);}});
$('out').addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('mt')&&e.target.open)fillMeeting(e.target);},true);
$('out').addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-year],[data-party],[data-spk],[data-item],[data-theme],[data-view],[data-mode],#more,#csv');if(!t)return;
  if(t.dataset.mode){MODE=t.dataset.mode;update(false);return;}
  if(t.id==='more'){shown+=PAGE*2;VIEW==='m'?renderMotions(state()):VIEW==='z'?renderToez(state()):renderResults(state());return;}
  if(t.id==='csv'){exportCSV();return;}
  if(t.dataset.view){VIEW=t.dataset.view;update(false);return;}
  if(t.dataset.theme){$('q').value=t.dataset.theme;VIEW='t';update(false);window.scrollTo(0,0);return;}
  if(t.dataset.year){const y=t.dataset.year,on=$('fd1').value===y+'-01-01'&&$('fd2').value===y+'-12-31';$('fd1').value=on?'':y+'-01-01';$('fd2').value=on?'':y+'-12-31';update(false);return;}
  if(t.dataset.party){$('fp').value=$('fp').value===t.dataset.party?'':t.dataset.party;update(false);return;}
  if(t.dataset.spk){$('fs').value=$('fs').value===t.dataset.spk?'':t.dataset.spk;update(false);return;}
  if(t.dataset.item){const [y,it]=t.dataset.item.split(':').map(Number);openReader(Y.find(d=>d.y===y),it,-1);return;}
  if(t.dataset.act&&t.dataset.act[0]==='z'){const o=TZ[+t.closest('.card').dataset.z],i=o.z[0];if(t.dataset.act==='zread')openReader(o.D,o.D.s.i[i],i);else if(t.dataset.act==='zvideo')openVideo(o.D,i);else copy(citation(o.D,i,selIn(t.closest('.card').querySelector('.snip'))||o.D.s.t[i].slice(o.z[1],o.z[2])));return;}
  if(t.dataset.act==='mread'){const o=MO[+t.closest('.mo').dataset.mo];openReader(o.D,o.D.s.i[o.m[0]],o.m[0]);return;}
  const card=t.closest('.card');if(!card)return;const o=RES.res[+card.dataset.r];
  if(t.dataset.act==='read')openReader(o.D,o.D.s.i[o.i],o.i);
  else if(t.dataset.act==='copy')copy(citation(o.D,o.i,selIn(card.querySelector('.snip'))));
  else if(t.dataset.act==='video')openVideo(o.D,o.i);
  else if(t.dataset.act==='full'){const sn=card.querySelector('.snip'),text=o.D.s.t[o.i];
    if(t.dataset.open){sn.innerHTML=snippets(text,ranges(text,allTerms()));t.textContent='Hele tekst';delete t.dataset.open;}
    else{sn.innerHTML=paras(text,ranges(text,allTerms()));t.textContent='Alleen fragment';t.dataset.open=1;}}
});
$('rbody').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||!RD)return;const sp=t.closest('.sp');if(t.dataset.act==='rvideo')openVideo(RD.D,+sp.dataset.i);else if(t.dataset.act==='rcopy')copy(citation(RD.D,+sp.dataset.i,selIn(sp)));});
/* ---------- video: ingebouwde speler die naar het moment springt ---------- */
let VP=null;
function openVideo(D,i){
  const S=D.s,m=D.M[S.m[i]],ref=m[4],sec=Math.max(0,S.v[i]-3),box=$('vbox');closeVideo();
  $('vtitle').textContent=fdate(m[0])+' · '+who(D,i).name;$('vjump').textContent='Spring naar '+hms(sec);
  $('vlink').href=m[1]?SRC+'/Agenda/Index/'+m[1]:'#';$('vnote').textContent='Klik in de speler op Start; de uitzending begint dan op '+hms(sec)+'. Staat hij ergens anders, klik dan op ‘Spring naar’. De tijd is bij benadering.';
  $('video').classList.add('on');
  const fail=()=>{box.innerHTML='<div class="empty">De speler kon niet worden geladen (geen internet, of de speler wordt hier geblokkeerd). Open de vergadering in iBabs en spoel naar '+hms(sec)+'.</div>';};
  if(ref.startsWith('c:')){
    const go=()=>{try{const p=cwc.sdk.player.client.createPlayer({id:ref.slice(2),display:126});p.element.style.cssText='width:100%;height:100%;border:0';p.element.setAttribute('allow','fullscreen; autoplay');box.appendChild(p.element);
      const jump=()=>{try{p.seek({timestamp:sec*1000});}catch(e){}};VP={jump,stop:()=>{try{p.destroy();}catch(e){}}};try{p.on('ready',jump);}catch(e){}setTimeout(jump,2500);setTimeout(jump,6000);}catch(e){fail();}};
    if(window.cwc&&cwc.sdk)go();else{const sc=document.createElement('script');sc.src='https://sdk.companywebcast.com/sdk/player/client.js';sc.onload=go;sc.onerror=fail;document.head.appendChild(sc);}
  }else{
    const f=document.createElement('iframe');f.allow='fullscreen; autoplay';f.style.cssText='width:100%;height:100%;border:0';f.src='https://connectlive.ibabs.eu/Player/Player/'+ref.slice(2);box.appendChild(f);
    const jump=()=>{try{f.contentWindow.postMessage({action:'jumpToPosition',seconds:sec},'https://connectlive.ibabs.eu/');}catch(e){}};VP={jump,stop:()=>{}};f.onload=()=>{setTimeout(jump,2500);setTimeout(jump,6000);};
  }
}
function closeVideo(){if(VP){VP.stop();VP=null;}$('vbox').innerHTML='';$('video').classList.remove('on');}
$('vjump').addEventListener('click',()=>VP&&VP.jump());
$('vclose').addEventListener('click',closeVideo);
$('video').addEventListener('click',e=>{if(e.target.id==='video')closeVideo();});
$('home').addEventListener('click',e=>{e.preventDefault();for(const f of F)$(f).value=f==='fk'?'01':'';$('ww').checked=false;wantSort='new';MRES='';ZT='';MODE='l';VIEW='t';update(false);window.scrollTo(0,0);});
$('rclose').addEventListener('click',closeReader);
$('about').addEventListener('click',e=>{e.preventDefault();$('home').click();setTimeout(()=>{const a=document.getElementById('over');if(a)a.scrollIntoView();},50);});
$('reader').addEventListener('click',e=>{if(e.target.id==='reader')closeReader();});
$('rprev').addEventListener('click',()=>RD&&openReader(RD.D,RD.it-1,-1));
$('rnext').addEventListener('click',()=>RD&&openReader(RD.D,RD.it+1,-1));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('video').classList.contains('on'))closeVideo();else if(RD)closeReader();}if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus();}});

/* init */
(function(){
  $('built').textContent=fdate(META.built,true);
  const ys=META.years.map(y=>+y.y);$('span').textContent=Math.min(...ys)===Math.max(...ys)?String(ys[0]):Math.min(...ys)+'–'+Math.max(...ys);
  $('spk').innerHTML=SPK.map((x,i)=>i).sort((a,b)=>SPK[a][1]<SPK[b][1]?-1:1).map(i=>'<option value="'+esc(SPK[i][0])+'">').join('');
  $('fp').insertAdjacentHTML('beforeend',PAR.slice().sort((a,b)=>a.localeCompare(b,'nl')).map(p=>'<option>'+esc(p)+'</option>').join(''));
  $('theme').insertAdjacentHTML('beforeend',THEMES.map(g=>'<optgroup label="'+esc(g[0])+'">'+g[1].map(t=>'<option value="'+esc(t[1])+'">'+esc(t[0])+'</option>').join('')+'</optgroup>').join(''));
  if(META.cats){$('fcw').style.display='';$('fc').insertAdjacentHTML('beforeend',META.cats.map(c=>'<option>'+esc(c)+'</option>').join(''));}
  fromHash();renderBrowse();loadAll().catch(e=>{$('loadtxt').textContent='Laden mislukt: '+e.message;console.error(e);});
})();
</script>
