roting gaat het over meetbare indicatoren en targets."}, {"periode": "2019", "wat": "Rond het Rekenkamerrapport over het Schiekadeblok wordt gedebatteerd over welke stukken de Rekenkamer kreeg en hoe zij daarmee omgaat; ook het rapport over de warmtevoorziening komt aan bod."}, {"periode": "2020", "wat": "De monitors over Trevvel en het vervoer staan centraal, en na de integriteitskwestie bij Stadsbeheer zijn een audit op 'hard controls' en een externe audit van de integriteitsketen onderwerp van gesprek."}, {"periode": "2021–2023", "wat": "De raad bespreekt Rekenkamerrapporten (onder meer over ondermijnende criminaliteit en het ethisch gebruik van algoritmes), monitoring van parkeerbeleid en verkeersexperimenten, en evaluaties van onder meer het cultuurplanproces en coöperatief wonen."}, {"periode": "2024–2025", "wat": "Een eerste opvolgingsrapport van de Rekenkamer over de daklozenopvang wordt besproken, evenals 213a-onderzoeken, de Monitor Grote Projecten en de vraag of een evaluatie van het subsidiekader met de raad gedeeld kan worden."}], "standpunten": [{"wie": "J.W. Verheij (VVD)", "punt": "Verheij benadrukt in 2019 dat de Rekenkamer zelf bepaalt hoe zij met stukken omgaat en wat zij publiceert, en wil daarover met de Rekenkamer in gesprek."}, {"wie": "S. de Langen (CDA, wethouder)", "punt": "De Langen herkent de knelpunten uit Rekenkamerrapporten, maar verschilt soms van mening over de oorzaken en oplossingen, en koppelt via de monitor voortgang bij Trevvel terug aan de raad."}, {"wie": "Richard Moti (PvdA, wethouder)", "punt": "Moti wijst medewerkers erop dat zij zich kunnen melden bij de vertrouwenspersoon, de ondernemingsraad of de ombudsman, en noemt de ombudsman een onafhankelijk instituut."}, {"wie": "Ronald Buijt (wethouder)", "punt": "Buijt neemt in 2024–2025 Rekenkamerrapporten over opvang en jeugdzorg serieus en zegt toe de aanbevelingen over te nemen, maar vindt de ombudsman geen logische deelnemer aan de stuurgroep Buitenslapers."}, {"wie": "D66 (Agnes Maassen)", "punt": "D66 en VVD dienen in 2025 een motie in zodat de inhoud van evaluaties in principe met de raad gedeeld kan worden."}, {"wie": "Robert Simons (wethouder)", "punt": "Simons zegt in 2022 en 2026 dat er al evaluatiemomenten zijn ingepland en dat de punten van de ombudsman bij de inspraakverordening zijn afgewogen maar niet allemaal zijn overgenomen."}], "recent": "In 2025 gaat het onder meer over de Monitor Grote Projecten, een geheim gehouden evaluatie van het subsidiekader en de Rekenkamer over de kengetallen in de begroting. In 2026 zegt een wethouder bij het Rekenkamerrapport 'Nog steeds vatbaar' aanbeveling 1 en 2 over te nemen, en worden de adviezen van de ombudsman bij de nieuwe inspraakverordening besproken."}, "23": {"id": 23, "kern": "In de fragmenten gaat het bij dit thema vooral om pilots en experimenten van de gemeente, in veel gevallen op het gebied van verkeer en mobiliteit, afval en schoon, werk en inkomen, opvang en wonen. Terugkerende kwesties zijn of de raad vooraf wordt geïnformeerd, hoe lang een experiment duurt en hoe de effecten worden gemeten, en of een geslaagde pilot wordt voortgezet of opgeschaald. Ook komt meermaals de vraag terug wat een pilot kost en wanneer een experiment is mislukt. Daarnaast wordt innovatie genoemd bij subsidies voor start-ups, bij woonvormen en bij het bedrijfsleven.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Experimenteren is een thema van het toenmalige college (onder meer CityLab en vrije zones), met pilots voor oudere werkzoekenden naar voorbeeld van Almere, een aanpak van armoede en schulden en deelname aan een investeringsfonds voor start-ups."}, {"periode": "2020", "wat": "De Rotterdamse Mobiliteitsaanpak brengt verkeersexperimenten, zoals bij de Maastunnelcorridor, en een interpellatie over de informatie aan de raad; ook CityLab010 wordt besproken."}, {"periode": "2021", "wat": "De raad debatteert verder over de verkeersexperimenten, onder meer over verlengen vanwege corona, en over de afronding van het experiment met wijkbasisbanen en een pilot voor een scholingsfonds."}, {"periode": "2022", "wat": "Een eindevaluatie van de Maastunnelcorridor wordt besproken, en er lopen pilots voor opvang van mensen zonder recht op opvang en voor ongedocumenteerde Rotterdammers."}, {"periode": "2023–2025", "wat": "Er komen veel pilots op het gebied van afval en schoon (zoals ruilwinkels, doneerringen en statiegeld), verlichting en vleermuizen, een intensieve wijkaanpak bij woningverhuur en handhaving met nieuwe technologie."}], "standpunten": [{"wie": "Judith Bokhove (GroenLinks, wethouder)", "punt": "Bokhove ziet experimenten als manier om te leren zonder iets definitief in te richten, informeert de raad voor de start van elk experiment en wil een geslaagde stap niet terugdraaien."}, {"wie": "Leefbaar Rotterdam", "punt": "Leefbaar Rotterdam diende samen met 50PLUS een motie in over een uitvoeringsagenda, zodat de raad vooraf kennis neemt van de experimenten."}, {"wie": "CDA (René Segers-Hoogendoorn)", "punt": "Het CDA vraagt om helderheid over looptijd en weging van experimenten en dient moties in over leren experimenteren en het verlengen van experimenten."}, {"wie": "Vincent Karremans en Pascal Lansink-Bastemeijer (VVD, wethouders)", "punt": "Zij willen ideeën eerst in een pilot proberen, opschalen als het werkt en stoppen als het niet werkt, en wijzen daarbij op kosten en op het belang van bewonersinitiatief."}, {"wie": "Richard Moti (PvdA, wethouder)", "punt": "Moti zet pilots en experimenten in bij werk en inkomen en wil een experiment netjes afronden, zodat deelnemers er niet de dupe van worden."}, {"wie": "Chantal Zeegers (D66, wethouder)", "punt": "Zeegers staat open voor pilots en innovatieve woonvormen, maar wijst erop dat een intensieve wijkaanpak veel geld kost en breder uitrollen lastig is."}], "recent": "In 2025–2026 gaat het vooral over pilots met afvalbakken en statiegeld, handhaving van zwerfafval en foutparkeren, verkeersmaatregelen in straten en publiek vervoer, en een pilot om asielzoekers vanuit de opvang naar werk te begeleiden. In het debat over het coalitieakkoord 2026 wordt ook gesproken over investeren in het innovatieve bedrijfsleven."}, "24": {"id": 24, "kern": "In de Rotterdamse gemeenteraad 2018-2026 staat de relatie met het Rijk, de provincie en de Metropoolregio Rotterdam Den Haag (MRDH) centraal. De gesprekken gaan vooral over openbaar vervoer, financiering van gemeentelijke taken, asielcrisis en energietransitie. Telkens leidt het mismatch tussen Rijksbesluiten en lokale noden tot discussie over wie wat betaalt en bepaalt.", "ontwikkeling": [{"periode": "2018-2019", "wat": "MRDH en het Warmtebedrijf domineren de debatten; over OV-visie, metropoolregio en de rol van province en Rijk in regionale aangelegenheden.", "citaat": "De OV-visie ligt voor, een visiedocument dat voor de komende 22 jaar de ov-lijn moet bepalen voor Rotterdam en de Metropoolregio Rotterdam Den Haag."}, {"periode": "2020-2021", "wat": "COVID-19 vertroebelt het ov-tafereel; verwachting dat ov in 2025 vast gaat lopen; WLQ+ Warmtebedrijf-scenario vereist afstemming Rijk, provincie en MRDH.", "citaat": "U weet, in 2025, en ik heb daar ook al meerdere keren voor naar het Rijk gekeken, loopt ons OV vast."}, {"periode": "2022-2023", "wat": "Nieuw kabinet belooft vernieuwing maar fractie-onrust over MRDH tramnet en wie macht heeft; asielcrisis groeit; Luchthaven Rotterdam in debat.", "citaat": "ironisch genoeg bestaande uit dezelfde partijen die het vorige kabinet ondersteunden."}, {"periode": "2024-2026", "wat": "RET-bezuinigingen, asielketen onder druk, MRDH Mobiliteitsvisie 2027 en energietransitie; fractie-kritiek op Rijksbeleid dat Rotterdam-problemen creëert en niet opbeurt.", "citaat": "we gaan naar de rechter als het rijk dat niet ophoogt."}], "standpunten": [{"wie": "GroenLinks", "punt": "Investeert lokaal in energietransitie en duurzaamheid als het Rijk zwijgt; pleit voor ambitieus klimaatbeleid onafhankelijk van haagse inzinkingen.", "citaat": "omdat we niet kunnen wachten op rijksgeld van dit rechtse kleuterkabinet."}, {"wie": "PvdA", "punt": "Ziet Rotterdam als uitvoeringsloket van het Rijk in plaats van autonoom; roept op tot gezamenlijke druk van gemeenten op Rijksbeleid.", "citaat": "Wederom een voorbeeld van geen eigen ambitie maar gewoon een uitvoeringsloket zijn van het rijk."}, {"wie": "VVD", "punt": "Waardeert economische samenwerking via MRDH en verwacht Rijksmiddelen; positief over regionale samenhang.", "citaat": "De MRDH is op het gebied van verkeer en vervoer en economisch vestigingsklimaat van groot belang en dat moeten we ook zeker koesteren."}], "recent": "In 2025-2026 staan asielcrisis, havenverkeer en energietransitie centraal. De gemeente Rotterdam zoekt cofinanciering met Rijk en provincie; wethouders voeren intensief lobby met Den Haag. Fractie-kritiek groeit op Rijksbesluiten zonder financiering, vooral de afbouw van LVV-middelen (opvang vluchtelingen) en afschaffing seniorenkorting OV."}, "26": {"id": 26, "kern": "Het Centrum van Rotterdam staat in de raad bekend om de grote herinrichting van de Coolsingel en het Lijnbaankwartier, een meerjarenproject met veel aandacht voor openbare ruimte en bereikbaarheid. Terugkerende onderwerpen zijn de transformatie van de binnenstad, het behoud van historische architectuur, en problemen met overlast en veiligheid in wijken als het Oude Westen en het Scheepvaartkwartier.", "ontwikkeling": [{"periode": "2018–2019", "wat": "De raad debatteert intensief over het bestemmingsplan voor het Lijnbaankwartier.", "citaat": "het (aangepaste) voorstel tot vaststelling van het bestemmingsplan"}, {"periode": "2019–2020", "wat": "De herinrichting van de Coolsingel is het centrale project; opening wordt verwacht binnen ruim een jaar.", "citaat": "Over dik een jaar zetten we met de opening van een nieuwe Coolsingel de kroon op het werk"}, {"periode": "2020–2021", "wat": "Coolsingel-herinrichting vordert; bestemmingsplannen voor Cool Lloyd-gebied worden vastgesteld.", "citaat": "Sturen op het toevoegen van groen in de wijken Cool, Lloyd, Mullerpier en Schiemond"}, {"periode": "2022–2023", "wat": "Focus verschuift naar veiligheid en homelessness in het Oude Westen en binnenstad.", "citaat": "Dank u wel voorzitter. Wij zijn blij met de aanpak Bankslapers van wethouder Buijt"}, {"periode": "2024–2026", "wat": "Voortgaande homelessness-aanpak; verkeerscirculatie en erfgoedaspecten van Post-65 architectuur.", "citaat": "dit college investeert ook in het creëren van twintig hectare extra groen in Rotterdam"}], "standpunten": [{"wie": "VVD", "punt": "VVD ondersteunt de herinrichting van het Centrum als kroon op het werk; prioriteit op economische potentie.", "citaat": "Van Alexander tot Feijenoord, van Coolsingel tot Blaak, wij maken de stad groener, leefbaarder"}, {"wie": "GroenLinks", "punt": "GroenLinks steunt stedelijke projecten maar benadrukt groene ruimte en fietsparkeerplekken.", "citaat": "grote opdracht om zo veel mogelijk fietsparkeerplekken te realiseren, niet alleen bij ov"}, {"wie": "PvdA", "punt": "PvdA vraagt zich af of dure prestige-projecten aan de Coolsingel ten koste gaan van betaalbaarheid.", "citaat": "we moeten vooral doorgaan met het bouwen van betaalbare woningen"}, {"wie": "D66", "punt": "D66 benadrukt erfgoed en participatie van bewoners bij stedelijke ontwikkelingen.", "citaat": "als de Coolsingel opgeleverd is, is dat eigenlijk de parel aan de mooiste binnenstad van Nederland"}, {"wie": "SP", "punt": "SP is kritisch op dure prestige-projecten als de Coolsingel en pleit voor aandacht voor winkeliers.", "citaat": "voor 60 miljoen verfraaien van de Coolsingel had de SP al haar bedenkingen"}], "recent": "In 2025–2026 blijft homelessness-aanpak centraal; focus op verkeerscirculatie, tramlijnen, erfgoedarchitectuur en overlastbestrijding in het Oude Westen."}, "27": {"id": 27, "kern": "In de fragmenten komt Delfshaven in de raad op uiteenlopende manieren terug: als wijk waar armoede, veiligheid en leefbaarheid worden besproken, als gebied voor wonen en bouwen, en als wijk waar het openbaar vervoer en de voorzieningen onder de aandacht komen. Bospolder-Tussendijken wordt vaak genoemd bij de armoedeaanpak, de aardgasvrije pilot, de wijkplanner en het bestemmingsplan. Op de Mathenesserweg gaat het meermaals over het opkopen van woningen door beleggers, verkamering en de vraag of opkoopbescherming daar moet gelden. Daarnaast spelen Oud-Mathenesse en Merwe-Vierhavens, de tramlijnen en het OV, en parkeren in Middelland een rol.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Delfshaven komt voor bij de bereikbaarheid van de VraagWijzer, de aanpak van ondermijning rond de Mathenesserweg en Schiedamseweg, de start van de intensieve gezinsaanpak in Bospolder-Tussendijken en eind 2019 bij klachten over beleggers aan de Mathenesserweg."}, {"periode": "2020", "wat": "De gebiedscommissie Delfshaven spreekt in tegen de bouwplannen bij Parkhaven, er is discussie over het Zelfregiehuis in Bospolder-Tussendijken en de wijkplanner en de aardgasvrije pilot starten daar."}, {"periode": "2021–2022", "wat": "Het gaat over samenwerking met scholen en het armoedeplatform in Delfshaven, het bestemmingsplan voor Bospolder-Tussendijken, de komst van opkoopbescherming en in 2022 over de Mathenesserweg, het Coolhaveneiland, tramlijn 4 en de zorgen van bewoners van Oud-Mathenesse."}, {"periode": "2023–2024", "wat": "Het Plan Toekomstvast Tramnet en het debat over het behoud van de tram staan centraal, naast Merwe-Vierhavens, het maatwerk voor betaald parkeren en de sluiting van een inloopvoorziening in Spangen."}, {"periode": "2025–2026", "wat": "Onderwerpen zijn het bouwplan Abrikoos/Rietmakersgang in historisch Delfshaven, het OV in het Nieuwe Westen, de Westzeedijk en de rol van de welzijnscoalitie Delfshaven bij de wijkontwikkeling."}], "standpunten": [{"wie": "ChristenUnie-SGP", "punt": "Pleit in de fragmenten voor opkoopbescherming op de Mathenesse  waarom tram 4 voor Hillegersberg behouden van belang is, want daar zijn geen OV-alternatieven. Daar is geen metrohalte"}, {"wie": "GroenLinks (Judith Bokhove)", "punt": "Cultuurcentra en sociale voorzieningen zijn ernstig bezuinigd, wat de gemeenschaftsstructuur en ondersteuning ondermijnt.", "citaat": "In Schiebroek is het culturele centrum weg. Er zijn heel veel culturele centra wegbezuinigd door dit college"}, {"wie": "SP (Theo Coşkun)", "punt": "Preventief welzijnswerk in Schiebroek en Bloemhof is succesvol en moet naar andere wijken uitgebreid worden.", "citaat": "waarvoor succesvolle pilots lopen in Bloemhof en Schiebroek. Wethouder Buijt heeft plannen om die pilots uit te breiden naar andere wijken"}, {"wie": "PRO (Marvin Biljoen)", "punt": "Luchthavenlast heeft ernstige gezondheidseffecten voor bewoners, inclusief verstoorde nachtrust en luchtwegproblemen.", "citaat": "in verstoorde nachten, in kerosine dampen in hun achtertuin en in de zorgen om de longen van hun kinderen"}], "recent": "In 2025-2026 staan sociale welzijnsprogramma's centraal met uitbreiding van wijkhubs en kinderparken naar andere wijken. Tegelijkertijd groeien zorgen over betaald parkeren en blijft de impact van luchthavenlast voor bewoners een aandachtspunt."}, "34": {"id": 34, "kern": "Overschie is een wijk waar debatten centraal stonden rond de toekomst van het aangrenzende vliegveld Zestienhoven, woningbouwontwikkeling op voormalige sportterreinen, en wijkvoorzieningen. Kernthema's zijn overlastklachten van inwoners over vliegtuiggeluid, de geplande sluiting van het zwembad, en voorstellen om de luchthaven om te zetten in een groene stadswijk met woningen. De wijk is een aandachtspunt geweest voor bredere discussies over stedelijke ontwikkeling, inspraak en het balanceren van economische belangen met leefbaarheid.", "ontwikkeling": [{"periode": "2018-2020", "wat": "Debatten richtten zich op woningbouwplannen voor het Zestienhoven-gebied, met een bestemmingsplan dat zo'n 850 huizen voor Rotterdam zou toevoegen.", "citaat": "het bestemmingsplan Zestienhoven. Dat is natuurlijk een mooi plan"}, {"periode": "2020-2021", "wat": "De aandacht verschoof naar bescherming van cultuurhistorisch erfgoed en het bewaren van de wijkkarakteristieken te midden van ontwikkelingen.", "citaat": "cultuurhistorische verkenningen daartoe soms wel aanleiding geven. Bijvoorbeeld in Overschie"}, {"periode": "2022-2023", "wat": "Meerdere fracties stelden radicale transformatie voor: het vliegveld omzetten van 'grijs' naar 'groen' met dichte bewoning en parkruimte.", "citaat": "Wat wij voorstellen is een groene stadswijk in plaats van een grijs vliegveld"}, {"periode": "2024-2025", "wat": "Woningbouw op voormalige voetbalvelden vorderde, terwijl het zwembad omstreden werd door sluiting-plannen.", "citaat": "bittere nasmaak over aan hoe dit verlopen is"}, {"periode": "2025-2026", "wat": "Aanhoudende debatten over zwembadsluiting en de invoering van betaald parkeren in de wijk.", "citaat": "Het is niet nodig om het zwembad in Overschie te sluiten"}], "standpunten": [{"wie": "GroenLinks", "punt": "Zet het vliegveldgebied om naar een groene wijk met woningen om Rotterdams woningtekort aan te pakken.", "citaat": "Wat wij voorstellen is een groene stadswijk in plaats van een grijs vliegveld"}, {"wie": "SP", "punt": "Het vliegveld is economisch niet rendabel en moet worden gesloten; het terrein kan voor duizenden woningen en een stadspark gebruikt worden.", "citaat": "het eeuwig verlies draaiende vliegveldje Zestienhoven, RTHA geheten, definitief te sluiten om op die plek duizenden woningen en een mooi stadspark"}, {"wie": "D66", "punt": "Ondersteunt wijk-ontwikkeling en modernisering van verouderde voorzieningen, zoals sportfaciliteiten.", "citaat": "D66 is blij met de plannen waarin ook echt vervangingen van verouderde complexen plaatsvinden, zoals bijvoorbeeld het zwembad in Overschie"}, {"wie": "VVD", "punt": "De positie van Overschie buiten de vliegroutes betekent minder geluidsoverlast; dit ondersteunt voorzetting van vliegveldoperaties.", "citaat": "Overschie is direct gelegen eigenlijk naast de luchthaven, dus niet onder de vliegroutes, waarmee er in Overschie minder overlast"}, {"wie": "ChristenUnie-SGP", "punt": "Erfgoed en wijkkarakter moeten worden beschermd; infrastructuur zoals de A13 kan beter worden afgewaard.", "citaat": "de afwaardering van de A13 bij Overschie wat al heel lang ook een wens van de ChristenUnie is"}, {"wie": "Leefbaar Rotterdam", "punt": "Zorgen van inwoners over lawaai en leefbaarheid moeten worden meegenomen, met meer inspraak in planningprocessen.", "citaat": "de bewoners rond het Park Zestienhoven en de vrees voor geluidsoverlast van een nieuw horecapaviljoen"}], "recent": "In 2025-2026 ontstond groot verzet tegen sluiting van het zwembad en werd betaald parkeren ingevoerd. De toekomst van het vliegveld blijft omstreden tussen voorstanders van sluiting en omzetting naar woningen en verdedigers van voorzetting."}, "35": {"id": 35, "kern": "Prins Alexander is een groot gebied met zeven wijken waaronder Zevenkamp, Ommoord, Nesselande en Oosterflank. In de raadzaal worden herhaaldelijk veiligheidskwesties, overlast en criminaliteit besproken. Centraal speelt woonbouwontwikkeling, zowel de plaatsing van kwetsbare groepen als zorgen over gentrificatie en verlies van buurtkarakter.", "ontwikkeling": [{"periode": "2018", "wat": "In het oostelijk deel van Rotterdam ontstond een ernstige overvalgolf in de wijken Oosterflank en Zevenkamp.", "citaat": "Het was zeven keer raak in Oosterflank en in Zevenkamp in een week tijd."}, {"periode": "2018–2019", "wat": "Een groot conflict ontstond over geplande plaatsing van 35 mensen met psychische problemen in opvanghuis De Evenaar in Oosterflank.", "citaat": "een brief op de mat met de mededeling dat er 35 mensen met psychische problemen geplaatst gaan worden in de Evenaar"}, {"periode": "2019–2020", "wat": "In de zomer van 2019 speelde overlast op het strand van Nesselande met veel jongeren en afval.", "citaat": "Tussen 1 juni en 1 september faciliteren we dat afval kan worden weggegooid waar het hoort."}, {"periode": "2023–2024", "wat": "Een nieuwe crisis ontstond door geplande huisvesting van vluchtelingen en kwetsbare groepen in Nesselande, met veel weerstand.", "citaat": "een groot deel van ons commissiedebat ging over de blunder die de gemeente Rotterdam heeft begaan in Nesselande"}, {"periode": "2025–2026", "wat": "Veiligheids- en leefbaarheidssorgen blijven actueel, met zorgen dat Nesselande zijn karakter van rust verliest door recreatieve overlast.", "citaat": "een bewoner uit Nesselande ziet met lede ogen aan dat haar wijk langzamerhand haar ziel verliest door de overname van relschoppers"}], "standpunten": [{"wie": "Leefbaar Rotterdam", "punt": "Leefbaar Rotterdam is kritisch op de plaatsing van kwetsbare groepen in de wijk en stelt dat veiligheid en rust van bestaande bewoners moeten worden gewaarborgd.", "citaat": "je zult maar een van de vele bezorgde en betrokken bewoners in de Oosterflank geweest zijn het afgelopen jaar"}, {"wie": "VVD", "punt": "De VVD benadrukt dat bewoners het recht hebben zich veilig te voelen in hun buurt en spreekt zich uit tegen overlast en geweld.", "citaat": "De Oosterflank is een mooie wijk, bewoond door Rotterdammers die er recht op hebben om zich veilig te voelen in hun eigen buurt"}, {"wie": "GroenLinks", "punt": "GroenLinks legt nadruk op milieuverantwoorde ontwikkeling van de wijk en aandacht voor luchtkwaliteit en andere milieufactoren.", "citaat": "dat voor de aanleg van de weg saldo nul moet gelden: niet horen en zien, niet ruiken"}, {"wie": "PvdA", "punt": "De PvdA benadrukt dat groei van de wijk moet gepaard gaan met voldoende groen en ruimte voor recreatie.", "citaat": "Bij goede groei hoort wat de PvdA betreft ook voldoende ruimte voor groen en recreatie."}, {"wie": "D66", "punt": "D66 zet in op bewezen preventieve aanpakken tegen maatschappelijke problemen, met focus op jeugdwerk en sportieve activiteiten.", "citaat": "daar is echt van bewezen dat dat echt goed werkt in het kader van een preventieve aanpak"}], "recent": "In 2025–2026 spelen veiligheid op het Nesselande-strand en onrust rond recreatieve overlast een centrale rol. Tegelijk blijven zorgen over het behoud van het buurtkarakter en woonbaarheid actueel."}, "36": {"id": 36, "kern": "Hoogvliet is een voormalig dorp in het zuiden met aandacht voor woningbouw, bereikbaarheid en sociale voorzieningen. De raad debatteert voortdurend over balans tussen economische ontwikkeling (haven, industrie) en leefkwaliteit van bewoners. Veel spanning rond windturbines nabij woongebieden, bescherming van lokale retailers tegen grote ketens, en drugsoverlast bij opvanglocaties.", "ontwikkeling": [{"periode": "2018", "wat": "De raad maakt zich zorgen over bereikbaarheid door storingen van de Botlekbrug.", "citaat": "heb ik nog een laatste motie, in verband met de vele storingen van de Botlekbrug"}, {"periode": "2019–2020", "wat": "Grootschalige woningontwikkeling begint met projecten Maasranden en Stadshart Hoogvliet.", "citaat": "Hoogvliet dat nu nog een broos karakter heeft, wat er nog niet is, de kwaliteit van wonen"}, {"periode": "2020–2021", "wat": "Honderden woningen worden toegevoegd via grondexploitatiefondsen en pilot-programma's starten.", "citaat": "Daardoor kunnen we dit jaar al tienduizend huizen toevoegen in Hoogvliet"}, {"periode": "2021–2023", "wat": "Bestemmingsplannen voor woongebieden worden vastgesteld; verzet tegen windturbines groeit.", "citaat": "Pernis en Hoogvliet dragen de lasten, dan ook de lusten"}, {"periode": "2024–2026", "wat": "Zorgen over bereikbaarheid van havengebieds-bewoners; veiligheidsincidenten bij scholen.", "citaat": "In de afgelopen 7 dagen is er 3 keer een incident geweest in de avondnacht bij de Zalmplaatschool"}], "standpunten": [{"wie": "VVD", "punt": "Het college moet investeren in opknapping en massale woningbouw om Hoogvliet economisch te versterken.", "citaat": "de bouw van Prins Alexander, het opknappen van Hoogvliet, Crooswijk en Mathenesse"}, {"wie": "Leefbaar Rotterdam", "punt": "Infrastructuurproblemen als de Botlekbrug moeten opgelost en dorfkarakter moet behouden blijven.", "citaat": "in verband met de vele storingen van de Botlekbrug, om een integraal plan op te stellen"}, {"wie": "CDA", "punt": "Lokale retailers moeten beschermd worden tegen grote winkelketens en dorfkarakter behouden.", "citaat": "dat willen we gezond houden. Daar willen we de lokale Rotterdamse winkelier helpen"}, {"wie": "PvdA", "punt": "Havendorpen dragen lasten van industrie en verdienen aandacht voor infrastructuur en bereikbaarheid.", "citaat": "Zij hebben te maken met de lasten van de industrie en helaas weinig lusten"}, {"wie": "ChristenUnie-SGP", "punt": "Kleine winkeliers in Hoogvliet zijn overbelast door werkdruk en kunnen nauwelijks vakantie nemen.", "citaat": "de kleine winkeliers bezwijken onder de werkdruk, sommigen zelfs aangeven, zoals in Hoogvliet"}], "recent": "In 2025–2026 staat veiligheid aan de orde na explosies bij de Zalmplaatschool. Voortdurend debat over windturbines; bewoners uit Pernis en Hoogvliet dragen bezorgdheid voor. Bereikbaarheid van havengebied-bewoners blijft knelpunt."}, "37": {"id": 37, "kern": "Pernis is een voormalige dorp-kern van Rotterdam met een sterke industriële aanwezigheid (Shell-raffinaderij). In de gemeenteraad draaien debatten vooral om drie thema's: het behoud van voorzieningen (zwembaden, wijkfunctionarissen, ziekenhuisvervoer), energieplannen (windturbines en gaswinning) en woningbouw. De kern voelt zich regelmatig achtergesteld ondanks zware milieulasten.", "ontwikkeling": [{"periode": "2018", "wat": "Industriële veiligheid en wijkvoorzieningen staan centraal, met Shell die in Pernis uitleg komt geven en strijd om verzorgingshuizen open te houden.", "citaat": "In dit geval was het Shell die in Pernis langskwam om uit te leggen wat er fout is gegaan"}, {"periode": "2019–2020", "wat": "Energieplanning en bereikbaarheid groeien in belang: gaswinning-onderzoeken, zonneparken, maar ook zorgen over autobezit in kleine kernen.", "citaat": "Vorige week hadden we het met elkaar nog over de gaswinning in Pernis"}, {"periode": "2021", "wat": "Windturbine-plannen ontluiken; Windpark Benelux roept bezwaren op. Debate over schaal van gebiedscommissies en gevoelsmatige achterstand van kleine kernen.", "citaat": "wat nu juist het succes is in Hoek van Holland, in Pernis, is dat iedereen, iedereen kent"}, {"periode": "2022–2023", "wat": "Participatie-problemen rond windturbines (brandbrief gebiedscommissie). Leefbaar Rotterdam betuigt sterke steun aan kleine kernen.", "citaat": "We hebben een brandbrief ontvangen van de gebiedscommissie Pernis"}, {"periode": "2025–2026", "wat": "Vervoer en woningbouw domineren: risico's van OV-schralingreductie, verkamering van panden, maar ook investeringen (Pernisserpark) en buslijnen-behoud.", "citaat": "Zij hebben te maken met de lasten van de industrie en helaas weinig lusten"}], "standpunten": [{"wie": "Leefbaar Rotterdam", "punt": "Kleine kernen verdienen gespecialiseerde aandacht en investeringen, niet behandeling als gewone stadswijken.", "citaat": "Trots op de aandacht en gelden voor de kleine kernen"}, {"wie": "CDA", "punt": "Kleine kernen voelen zich structureel achtergesteld; belangrijk te handhaven OV-finesse en lokale betrokkenheid in energieplannen.", "citaat": "Deze kernen voelen zich heel vaak achtergesteld door de gemeente"}, {"wie": "VVD", "punt": "Kleine kernen hebben bijzondere bereikbaarheid-zorg nodig vanwege hoog autobezit en beperkte alternatieven.", "citaat": "Wij maken ons echt grote zorgen, voorzitter, over de bereikbaarheid van onze buitengebieden en kleine kernen"}, {"wie": "PvdA", "punt": "Havendorpen zoals Pernis dragen milieulasten maar krijgen onvoldoende lusten; infrastructuur rammelt en woningbouw stagneert.", "citaat": "Zij hebben te maken met de lasten van de industrie en helaas weinig lusten"}, {"wie": "50PLUS", "punt": "Bij ingrijpende plannen (parkeren, vervoer) moeten kleine kernen ontzien blijven; participatie van ouderen essentieel.", "citaat": "Balans brengen betekent dan ook dat inwoners van bijvoorbeeld Rozenburg, Pernis, Vlaardingen serieus worden meegenomen"}], "recent": "In 2025–2026 staat Pernis centraal in vervoers- en woningbouwdiscussies. Een brede motie (SP, CDA, GroenLinks, PvdA, ChristenUnie, 50PLUS; dec 2025) verzekerde behoud van buslijnen, terwijl ook parkeerdruk, verkamering van panden en de investeringskoers blijven spelen."}, "38": {"id": 38, "kern": "In de raad gaat het over Rozenburg vooral over bereikbaarheid, met debatten over openbaar vervoer, een failliet pontje en de ligging aan de 'verkeerde kant van de brug'. Terugkerend onderwerp is de spanning tussen ontwikkeling van het gebied (distributiecentrum, windmolens, ammoniakopslag) en het behoud van het groene karakter van de Landtong. De kleine kernenstatus van Rozenburg en de zorgen van inwoners spelen doorlopend een rol.", "ontwikkeling": [{"periode": "2018-2019", "wat": "De raad debatteert over het openbaar vervoernetwerk naar Rozenburg en verzet zich tegen plannen voor een distributiecentrum op de Landtong.", "citaat": "zich in te zetten om te voorkomen dat er een distributiecentrum komt op de Landtong in Rozenburg"}, {"periode": "2020-2021", "wat": "Windmolenplannen entstaan, waarbij het behoud van het groene karakter van de Landtong een centraal punt van discussie wordt.", "citaat": "dat mooie groene karakter van de Landtong overeind te houden"}, {"periode": "2022-2023", "wat": "Er is fel debat over megawindturbines en ook discussie over het faillissement van de voet-en-fietspont die bereikbaarheid beïnvloedt.", "citaat": "Dus daar hebben de mensen in Rozenburg wat aan"}, {"periode": "2024-2026", "wat": "Aandacht voor woningopkoop, arbeidsmigranten en het opstellen van een nieuw bestemmingsplan voor de Landtong.", "citaat": "Afschrift dorpsraadadvies Rozenburg over de herziening bestemmingsplan Europoort"}], "standpunten": [{"wie": "Leefbaar Rotterdam", "punt": "Focust op bereikbaarheid en voorzieningen voor de kleine kern, bezorgd over overlast en wil maatwerk voor Rozenburgers.", "citaat": "Dus daar hebben de mensen in Rozenburg wat aan"}, {"wie": "SP", "punt": "Ziet in Rozenburg bewijs van verkeerd beleid rond bomen en marktfalen, onder meer bij de veerboot.", "citaat": "Charlois, Rozenburg en Kralingen zijn recente bewijzen dat we het niet zo nauw nemen met onze bomen"}, {"wie": "D66", "punt": "Benadrukt belang van participatie en duidelijkheid voor bewoners bij projecten op de Landtong.", "citaat": "D66 had in de commissie nog wel wat vragen over windmolens in Rozenburg"}, {"wie": "GroenLinks", "punt": "Wil het groene karakter van de Landtong behouden en pleit voor zorgvuldige participatie.", "citaat": "dat mooie groene karakter van de Landtong overeind te houden"}], "recent": "In 2025-2026 staat Rozenburg onder druk van woningopkoop en arbeidsmigratie. Het nieuw bestemmingsplan voor de Landtong is in voorbereiding en bereikbaarheid blijft een zorg, met discussies over haveninfrastructuur en mobiliteit voor ouderen en mensen zonder auto."}, "39": {"id": 39, "kern": "Hoek van Holland is een voormalig dorp en recreatief knooppunt dat in de gemeenteraad veel te sprake komt over transportverbindingen, toerisme en woningbouw. De raad worstelt met de balans tussen toeristisch-recreatieve ontwikkeling, behoud van natuurgebied en zorgen van de lokale gemeenschap.", "ontwikkeling": [{"periode": "2018", "wat": "De Hoekse Lijn staat centraal in debatten over bereikbaarheid van het gebied en kustontwikkelingplannen.", "citaat": "Het belang van de Hoekse Lijn kan niet voldoende benadrukt worden als levensader voor Hoek van Holland"}, {"periode": "2019-2021", "wat": "Langdurige discussie over de toekomst van het Recreatieoord en plannen voor natuurbegraven (Bonnenpolder).", "citaat": "Na meer dan vijfentwintig jaar wikken en wegen, vooral heel veel niet besluiten komen we nu hopelijk tot een besluit"}, {"periode": "2022", "wat": "Het college presenteert een nieuw voorstel voor het Recreatieoord dat breed wordt gesteund.", "citaat": "het beste in de historie van het Recreatieoord Hoek van Holland"}, {"periode": "2024", "wat": "De metrolijn bereikt eindelijk het strand van Hoek van Holland, wat als positieve ontwikkeling voor toerisme wordt gezien.", "citaat": "mooi dat de metro naar het strand van Hoek van Holland is gaan rijden"}, {"periode": "2025-2026", "wat": "Nieuwe woningbouwprojecten (Lemairepark) en vervroegde fysieke vernieuwingen van de strandboulevard.", "citaat": "de strandboulevard van Hoek van Holland wordt mooier"}], "standpunten": [{"wie": "VVD", "punt": "Steunt grootschalige recreatieve en woonbouwontwikkeling van Hoek van Holland, ziet dit als positief voor het gebied.", "citaat": "De Rotterdamse VVD is ongelofelijk blij met het resultaat voor het Recreatieoord Hoek van Holland"}, {"wie": "Leefbaar Rotterdam", "punt": "Pleit voor erkenning van Hoek van Holland als een van de kleine kernen die bijzondere aandacht en investeringen verdienen.", "citaat": "Simpelweg trots op Rotterdam, Hoek van Holland, Pernis, Heijplaat, Rozenburg en Hoogvliet"}, {"wie": "D66", "punt": "Steunt verbetering van bereikbaarheid van Hoek van Holland via openbaar vervoer.", "citaat": "Een mooie lightrailverbinding naar Hoek van Holland"}, {"wie": "CDA", "punt": "Heeft zorgen over beschikbaarheid van middelen voor uitvoering van toeristische visie in Hoek van Holland.", "citaat": "Specifiek voor Hoek van Holland bijvoorbeeld, hebben wij zorgen over de middelen"}, {"wie": "GroenLinks", "punt": "Kritisch over woningbouw en windmolens in of dicht bij natuurgebieden rondom Hoek van Holland.", "citaat": "Wij zullen tegen dit bestemmingsplan stemmen om twee redenen"}], "recent": "In 2025-2026 staan huisvesting en infrastructuurkwaliteit centraal: het Lemairepark biedt nieuwe sociaalwoningen, terwijl bezorgdheid blijft over doelgroepenvervoer, parkeerbeleid en behoud van het dorpskarakter. De strandboulevard wordt vernieuwd."}, "40": {"id": 40, "kern": "Het Nationaal Programma Rotterdam Zuid (NPRZ) is een langetermijnprogram voor gebiedsontwikkeling van deze stadsdelen, gericht op fysieke transformatie, onderwijs, economische opleving en veiligheid. In de raad staan debatten centraal over de balans tussen nieuwbouw en het behouden van sociale woningen, en over hoe bewoners worden betrokken. Het programma wordt door meeste partijen als belangrijk gezien, maar met vragen over financiering, gentrificatie en effectiviteit.", "ontwikkeling": [{"periode": "2018–2019", "wat": "De gemeente begon met investeringen in sportfaciliteiten, woningbouw en ondersteuning van onderwijs.", "citaat": "willen wij met ons allen een grote inspanning leveren en dat is natuurlijk niet alleen de fysieke kant, maar met name ook het onderwijs"}, {"periode": "2019–2020", "wat": "Het programma realiseert huisvestingsprojecten en breid armoedebestrijding uit naar gezinnen in NPRZ-wijken.", "citaat": "de vijfhonderd gezinnen komen uit de plekken waar onze problematiek het grootst is: Bospolder-Tussendijken en de NPRZ-gebieden"}, {"periode": "2020–2021", "wat": "Ondanks coronapandemie blijft het programma doorgang vinden met woningbouw- en buurtverbeteringsprojecten.", "citaat": "het NPRZ draaide goed door met een veelheid van dingen, maar waaronder ook de uitvoering van 750 woningen"}, {"periode": "2022–2023", "wat": "Nadruk op cultuurontwikkeling en het behoud van sociale huisvesting temidden van debatten over stadionbouwplannen.", "citaat": "bijgestelde NPRZ-programma en de ontwikkeling van Feyenoord en de Oostflank, zullen Zuid nog verder omhoogstuwen"}, {"periode": "2024–2026", "wat": "Het programma gaat over in een fase van consolidatie met nadruk op woonaffordabiliteit, banen en culturele identiteit van wijken.", "citaat": "Het NPRZ loopt inmiddels al meer dan 10 jaar en heeft aantoonbaar veel betekend voor Rotterdam-Zuid"}], "standpunten": [{"wie": "Leefbaar Rotterdam", "punt": "Steunt fysieke transformatie maar wil voorkomen dat sociale stijgers uit Rotterdam-Zuid vertrekken naar omliggende gemeenten.", "citaat": "voorkomen dat de Rotterdamse sociale stijgers, bijvoorbeeld jongens en meiden in Rotterdam-Zuid die een opleiding hebben afgemaakt"}, {"wie": "D66", "punt": "Ziet de projecten op Zuid als integraal onderdeel van het woonbeleid en ondersteunt cultuurinitiatieven als Boijmans op Zuid.", "citaat": "de projecten op Zuid zijn een belangrijk onderdeel van die woonvisie geweest"}, {"wie": "PvdA", "punt": "Benadrukt dat ontwikkeling op Zuid moet worden gedaan tezamen met bewoners en ondernemers, niet alleen voor hen.", "citaat": "dat dit niet alleen op Zuid, maar ook met Zuid is"}, {"wie": "SP", "punt": "Voorzichtig over het programma; betwist dat veel geld naar opkoop van particuliere woningen gaat in plaats van sociale nieuwbouw.", "citaat": "Een groot deel van het geld wordt ook gereserveerd voor het opkopen van de particuliere woonvoorraad"}], "recent": "In 2025–2026 ligt de focus op woonaffordabiliteit, het voorkomen van verdere gentrificatie en de realisatie van meer werkgelegenheid in Zuid. Verschillende fracties benadrukken het belang van betaalbare woningen en het behoud van de culturele identiteit van de wijken."}}, "ibabs": {"h": "9227dcbcab", "n": 31597, "per": {"Toezegging": 6556, "Motie": 6842, "Amendement": 260, "Initiatiefvoorstel": 67, "Raadsvoorstel": 802, "Collegebesluit": 950, "Collegebrief": 10522, "Schriftelijke vragen": 4425, "Wijkraadadvies": 783}, "stand": "02-10-2026"}}</script>

<script>
"use strict";
const META=JSON.parse(document.getElementById('meta').textContent);
const SRC=META.src, SPK=META.spk, PAR=META.par, ROLES=META.roles;
const $=id=>document.getElementById(id);
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MNDL=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DAG=['zo','ma','di','wo','do','vr','za'];
const ZIT=['','ochtendzitting','middagzitting','avondzitting','nachtzitting'];
const KIND=['','Motietekst / stemming','Presentielijst','Sprekerstijdlijn','Uitzending (automatische ondertiteling)'];
const Y=[];              // geladen jaren
const PAGE=30;
let shown=PAGE, RES=null, lastKey='';

/* ---------- normalisatie: 1 teken in = 1 teken uit, zodat posities kloppen ---------- */
const T=new Uint8Array(65536).fill(63);
for(let c=0;c<128;c++)T[c]=String.fromCharCode(c).toLowerCase().charCodeAt(0);
T[9]=32;T[10]=32;T[13]=32;
for(let c=128;c<0x250;c++){const d=String.fromCharCode(c).toLowerCase().normalize('NFD').charCodeAt(0);if(d<128)T[c]=d;}
const SPEC={'‘':"'",'’':"'",'ʼ':"'",'ꞌ':"'",'´':"'",'`':"'",'‚':"'",'“':'"','”':'"','„':'"','«':'"','»':'"','–':'-','—':'-','‑':'-',' ':' ','ı':'i','ø':'o','ß':'s','…':'.','æ':'a','œ':'o'};
for(const k in SPEC)T[k.charCodeAt(0)]=SPEC[k].charCodeAt(0);
function norm(s){let o='';for(let i=0;i<s.length;i++)o+=String.fromCharCode(T[s.charCodeAt(i)]);return o;}
function normQ(s){return norm(s).replace(/\s+/g,' ').trim();}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fdate(d,long){const t=new Date(d+'T12:00:00');return long?(t.getDate()+' '+MNDL[t.getMonth()]+' '+t.getFullYear()):(DAG[t.getDay()]+' '+t.getDate()+' '+MND[t.getMonth()]+' '+t.getFullYear());}
const nf=n=>n.toLocaleString('nl-NL');
function hms(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}

/* ---------- laden ---------- */
/* data staat per jaar in een los bestand (META.dir + JAAR.zst); alle downloads starten meteen, verwerken gaat nieuwste jaar eerst */
const tick=()=>new Promise(r=>setTimeout(r,0));
async function loadAll(){
  const ys=META.years.slice().sort((a,b)=>b.y-a.y), tot=ys.reduce((a,b)=>a+b.z,0);let done=0;
  const get=m=>fetch(META.dir+m.y+'.zst?v='+m.h).then(r=>{if(!r.ok)throw new Error(m.y+': '+r.status);return r.arrayBuffer();});
  const P=ys.map(get);P.forEach(p=>p.catch(()=>{}));
  for(let k=0;k<ys.length;k++){
    const m=ys[k];
    $('loadtxt').textContent='Laden… '+m.y;
    const buf=new Uint8Array(await P[k]);
    if(buf.length!==m.z)throw new Error(m.y+': onvolledig bestand');
    await tick();
    const bytes=fzstd.decompress(buf);
    await tick();
    const D=JSON.parse(new TextDecoder().decode(bytes));
    await tick();
    prep(D,+m.y);Y.push(D);Y.sort((a,b)=>b.y-a.y);
    done+=m.z;$('loadbar').style.width=(100*done/tot)+'%';
    update(true);
  }
  $('loadtxt').textContent=nf(Y.reduce((a,y)=>a+y.nSp,0))+' spreekbeurten · '+Y.reduce((a,y)=>a+y.M.length,0)+' vergaderingen';
  $('load').querySelector('.bar').style.display='none';
}
function prep(D,y){
  D.y=y;const S=D.s,t=S.t,n=t.length;let L=0;for(let i=0;i<n;i++)L+=t[i].length+1;
  const u=new Uint8Array(L),off=new Int32Array(n+1);let k=0;
  const w=new Int32Array(n);for(let i=0;i<n;i++){off[i]=k;const s=t[i];let c=s.length?1:0;for(let j=0;j<s.length;j++){const b=T[s.charCodeAt(j)];if(b===32)c++;u[k++]=b;}w[i]=S.k[i]===2?0:c;u[k++]=1;}D.w=w;if(!D.mo)D.mo=[];D.moN=D.mo.map(m=>norm(m[3]));D.moM={};D.mo.forEach((m,k)=>{const mm=S.m[m[0]];(D.moM[mm]=D.moM[mm]||[]).push(k);});if(!D.tz)D.tz=[];if(!D.sm)D.sm={};
  off[n]=k;D.off=off;D.N=new TextDecoder('ascii').decode(u);
  D.ic=new Int32Array(D.I.length);D.first=new Int32Array(D.I.length).fill(-1);D.mc=new Int32Array(D.M.length);D.nSp=0;
  for(let i=0;i<n;i++){const it=S.i[i];D.ic[it]++;if(D.first[it]<0)D.first[it]=i;if(S.k[i]===0||S.k[i]===4){D.mc[S.m[i]]++;D.nSp++;}else if(S.k[i]===3)D.mc[S.m[i]]++;}
  D.In=D.I.map(x=>norm(x[1]+' '+x[2]));
}

/* ---------- thema's: vaste zoeksets (termen gescheiden door | ; "x" = heel woord) ---------- */
const THEMES=META.themes, TSTR={};
THEMES.forEach(g=>g[1].forEach(th=>{TSTR[th[1]]={th,sub:-1};th[2].forEach((s,k)=>{TSTR[s[1]]={th,sub:k};});}));
const PALIAS={'Partij voor de Dieren':['partij voor de dieren','pvdd'],'ChristenUnie-SGP':['christenunie','cu-sgp'],'Leefbaar Rotterdam':['leefbaar'],'Forum voor Democratie':['forum voor democratie','fvd'],'50PLUS':['50plus','50+']};

/* ---------- toestand ---------- */
const F=['q','q2','fs','fp','fr','fd1','fd2','fa','fk','fc'];
let VIEW='t', MRES='', wantSort='new';
function state(){const s={};for(const f of F)s[f]=$(f).value.trim();s.ww=$('ww').checked;s.sort=wantSort;s.view=VIEW;s.mres=MRES;s.zt=ZT;s.mode=MODE;s.os=OS;s.ost=OST;s.stl=ST?1:0;return s;}
function active(s){return !!(s.q||s.q2||s.fs||s.fp||s.fr||s.fd1||s.fd2||s.fa||s.fc||s.fk!=='01');}
function toHash(s){const p=new URLSearchParams();for(const f of F)if(s[f]&&!(f==='fk'&&s[f]==='01'))p.set(f,s[f]);if(s.ww)p.set('ww','1');if(s.sort!=='new')p.set('sort',s.sort);if(VIEW!=='t')p.set('v',VIEW);if(MRES)p.set('mres',MRES);if(ZT)p.set('zt',ZT);if(MODE==='tl')p.set('mode','tl');if(OS)p.set('os',OS);if(OST)p.set('ost',OST);const h=p.toString();history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}
function fromHash(){const p=new URLSearchParams(location.hash.slice(1));for(const f of F)if(p.has(f))$(f).value=p.get(f);$('ww').checked=p.get('ww')==='1';VIEW=['m','i','z','o'].includes(p.get('v'))?p.get('v'):'t';OS=p.get('os')||'';OST=p.get('ost')||'';ZT=p.get('zt')||'';MODE=p.get('mode')==='tl'?'tl':'l';MRES=p.get('mres')||'';wantSort=p.get('sort')||'new';}
function parseTerms(q,ww){return q.split('|').map(x=>x.trim()).filter(Boolean).map(x=>{const m=/^"(.+)"$/.exec(x);const t=normQ(m?m[1]:x);return {t,w:!!m||ww,label:m?m[1]:x};}).filter(x=>x.t);}

/* ---------- zoeken ---------- */
function isW(c){return (c>=97&&c<=122)||(c>=48&&c<=57);}
function search(s){
  let terms=parseTerms(s.q,s.ww),t2=parseTerms(s.q2,s.ww);
  if(!terms.length){terms=t2;t2=[];}
  const fsn=normQ(s.fs);let spSet=null;
  if(fsn){spSet=new Set();SPK.forEach((x,i)=>{if(norm(x[0]).includes(fsn))spSet.add(i);});}
  const pIdx=s.fp?PAR.indexOf(s.fp):-2, fa=normQ(s.fa), kinds=s.fk, role=s.fr, hasQ=terms.length>0;
  const rOK=r=>{switch(role){case'':return true;case'raad':return r===0;case'college':return r===2||r===3;case'wethouder':return r===2;case'burgemeester':return r===3;case'voorzitter':return r===1;case'nietvz':return r!==1;default:return r>=4;}};
  const res=[];let hits=0;const ty=terms.map(()=>({})),wy={},wp={},tot=terms.map(()=>0);
  for(const D of Y){
    const S=D.s,n=S.t.length,N=D.N,off=D.off;
    const mOK=D.M.map(m=>(!s.fd1||m[0]>=s.fd1)&&(!s.fd2||m[0]<=s.fd2)&&(!s.fc||m[2]===s.fc));
    if(!mOK.some(Boolean))continue;
    const iOK=fa?D.In.map(x=>x.includes(fa)):null;
    const ok=i=>{const k=S.k[i];
      if(k===3){if(hasQ||!kinds.includes('0'))return false;}else if(k===4){if(!kinds.includes('0'))return false;}else if(!kinds.includes(String(k)))return false;
      if(!mOK[S.m[i]])return false;if(iOK&&!iOK[S.i[i]])return false;
      if(spSet&&!spSet.has(S.sp[i]))return false;if(pIdx!==-2&&S.pa[i]!==pIdx)return false;
      if(role&&(S.sp[i]<0||!rOK(S.ro[i])))return false;
      if((spSet||pIdx!==-2)&&S.sp[i]<0)return false;return true;};
    const okc=new Int8Array(n);let wsum=0;
    for(let i=0;i<n;i++){if(ok(i)){okc[i]=1;wsum+=D.w[i];const p=S.pa[i];if(p>=0)wp[p]=(wp[p]||0)+D.w[i];}}
    wy[D.y]=wsum;
    if(hasQ){
      const cnt=new Int32Array(n);
      if(t2.length){for(let i=0;i<n;i++){if(!okc[i])continue;let f=false;for(const x of t2){const p=N.indexOf(x.t,off[i]);if(p>=0&&p<off[i+1]){f=true;break;}}if(!f)okc[i]=0;}}
      terms.forEach((tm,ti)=>{let pos=0,seg=0,c=0;const q=tm.t,ql=q.length;
        while((pos=N.indexOf(q,pos))!==-1){
          if(tm.w&&((pos>0&&isW(N.charCodeAt(pos-1)))||isW(N.charCodeAt(pos+ql)))){pos++;continue;}
          while(off[seg+1]<=pos)seg++;

          pos+=ql;}
        ty[ti][D.y]=c;tot[ti]+=c;hits+=c;});
      for(let i=0;i<n;i++)if(cnt[i])res.push({D,i,c:cnt[i]});
    }else{for(let i=0;i<n;i++)if(okc[i])res.push({D,i,c:0});}

}
function sortRes(R,how){

  else R.res.sort((a,b)=>d(a)<d(b)?1:d(a)>d(b)?-1:a.i-b.i);
}

function ranges(text,terms){
  const nt=norm(text),r=[];
  for(const tm of terms){if(!tm||!tm.t)continue;const t=tm.t;let p=0;while((p=nt.indexOf(t,p))!==-1){if(tm.w&&((p>0&&isW(nt.charCodeAt(p-1)))||isW(nt.charCodeAt(p+t.length)))){p++;continue;}r.push([p,p+t.length]);p+=t.length;}}
  r.sort((a,b)=>a[0]-b[0]);const o=[];for(const x of r){if(o.length&&x[0]<=o[o.length-1][1])o[o.length-1][1]=Math.max(o[o.length-1][1],x[1]);else o.push(x);}
  return o;
}

function markup(text,rs,from,to){
  let h='',p=from;

}
function paras(text,rs){let h='',p=0;for(const part of text.split('\n')){h+='<p>'+markup(text,rs,p,p+part.length)+'</p>';p+=part.length+1;}return h;}
function snipRanges(text,rs){
  if(!rs.length){const cut=text.length>340?text.lastIndexOf(' ',340):text.length;return [[0,cut>0?cut:Math.min(340,text.length)]];}
  const W=170,wins=[];
  for(const [a,b] of rs){if(wins.length&&a-wins[wins.length-1][1]<W){wins[wins.length-1][1]=Math.min(text.length,b+W);continue;}if(wins.length>=3)break;wins.push([Math.max(0,a-W),Math.min(text.length,b+W)]);}
  return wins.map(w=>{let a=w[0],b=w[1];if(a>0){const s=text.indexOf(' ',a);if(s>0&&s<a+30)a=s+1;}if(b<text.length){const s=text.lastIndexOf(' ',b);if(s>b-30)b=s;}return [a,b];});
}

      const jump=()=>{try{p.seek({timestamp:sec*1000});}catch(e){}};VP={jump,stop:()=>{try{p.destroy();}catch(e){}}};try{p.on('ready',jump);}catch(e){}setTimeout(jump,2500);setTimeout(jump,6000);}catch(e){fail();}};
    if(window.cwc&&cwc.sdk)go();else{const sc=document.createElement('script');sc.src='https://sdk.companywebcast.com/sdk/player/client.js';sc.onload=go;sc.onerror=fail;document.head.appendChild(sc);}
  }else{
    const f=document.createElement('iframe');f.allow='fullscreen; autoplay';f.style.cssText='width:100%;height:100%;border:0';f.src='https://connectlive.ibabs.eu/Player/Player/'+ref.slice(2);box.appendChild(f);
    const jump=()=>{try{f.contentWindow.postMessage({action:'jumpToPosition',seconds:sec},'https://connectlive.ibabs.eu/');}catch(e){}};VP={jump,stop:()=>{}};f.onload=()=>{setTimeout(jump,2500);setTimeout(jump,6000);};
  }
}

$('vjump').addEventListener('click',()=>VP&&VP.jump());
$('vclose').addEventListener('click',closeVideo);

$('home').addEventListener('click',e=>{e.preventDefault();for(const f of F)$(f).value=f==='fk'?'01':'';$('ww').checked=false;wantSort='new';MRES='';ZT='';MODE='l';VIEW='t';update(false);window.scrollTo(0,0);});
$('rclose').addEventListener('click',closeReader);
$('about').addEventListener('click',e=>{e.preventDefault();$('home').click();setTimeout(()=>{const a=document.getElementById('over');if(a)a.scrollIntoView();},50);});
$('reader').addEventListener('click',e=>{if(e.target.id==='reader')closeReader();});

$('rnext').addEventListener('click',()=>RD&&openReader(RD.D,RD.it+1,-1));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('video').classList.contains('on'))closeVideo();else if(RD)closeReader();}if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus();}});
