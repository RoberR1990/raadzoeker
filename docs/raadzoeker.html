nleven", 93, 59, [3.75, 2.53, 3.94, 1.75, 3.05, 21.08, 5.5, 12.95, 12.81]], ["parkeergarage", 46, 28, [3.12, 0.72, 0.84, 1.75, 0.61, 3.08, 1.1, 8.63, 1.71]], ["schip", 122, 81, [3.75, 2.89, 3.94, 3.89, 5.8, 6.4, 7.04, 15.83, 19.22]], ["verkeersaso", 56, 37, [0.31, 1.81, 0.84, 3.31, 1.83, 7.82, 2.2, 5.96, 11.53]]]}, "tot": {"words": 10268417, "moties": 6468, "sp": 116820, "verg": 177, "auto": 12, "toez": 454}, "dir": "data/raad/", "tsum": {"0": {"id": 0, "kern": "In de fragmenten gaat parkeren in de raad vooral over het invoeren en uitbreiden van betaald parkeren, en over wat dat voor bewoners kost (vergunningen, bezoekersregeling, tarieven). Meermalen terug komen de parkeerdruk en het waterbedeffect (het probleem verschuift naar de naastgelegen wijk), de vraag of er draagvlak in de wijk is en de wens om maatwerk te bieden voor sportverenigingen, zorgverleners, kerken en winkelbezoekers. Daarnaast gaat het over parkeernormen bij nieuwbouw, over handhaving (foutparkeren, dubbel parkeren, scanauto) en over gehandicaptenparkeerplaatsen en fietsparkeren. Veel genoemde wijken en gebieden zijn Bloemhof, Vreewijk, Pendrecht, de Afrikaanderwijk, de Nieuwe Binnenweg, Feyenoord en Heijplaat.", "ontwikkeling": [{"periode": "2018", "wat": "Na de invoering van betaald parkeren aan één kant van de Lange Hilleweg in Bloemhof klagen bewoners over overlast, en rond de begroting 2019 is er ophef over hogere bewonersvergunningen en bezoekerstarieven."}, {"periode": "2019–2020", "wat": "De raad debatteert over tarieven rond het centrum, over een stop-en-shopzone bij de Afrikaandermarkt en over gratis of goedkoper parkeren voor bezoekers van religieuze instellingen, en in februari 2020 over de nota 'Betaald parkeren in Rotterdam'."}, {"periode": "2021", "wat": "Er is een debat over mogelijk misbruik van gehandicaptenparkeerplaatsen, de besluitvorming over Vreewijk loopt, en de Beleidsregeling Parkeernormen auto en fiets wordt behandeld."}, {"periode": "2022–2023", "wat": "Het coalitieakkoord om overal binnen de ring betaald parkeren in te voeren leidt tot het Kader invoering betaald parkeren (december 2022) en in november 2023 tot een addendum met maatwerk voor onder meer sportverenigingen, zorgverleners en kerken."}, {"periode": "2024–2025", "wat": "De raad bespreekt uitbreiding van betaald parkeren in Kralingen-Crooswijk, de parkeerbehoefte rond Feyenoord City, het aanpakken van dubbel parkeren op de Nieuwe Binnenweg en een nieuwe beleidsregel voor parkeernormen."}], "standpunten": [{"wie": "GroenLinks (o.a. wethouder Bokhove)", "punt": "Ziet parkeren als sturingsmiddel om schaarse ruimte eerlijk te verdelen, en pleit in de fragmenten voor minder parkeerplaatsen op straat en betaald parkeren in de hele stad."}, {"wie": "VVD", "punt": "Wil in 2018 zo min mogelijk betaald parkeren tenzij nodig; wethouder Karremans voert later de coalitieafspraak uit om binnen de ring betaald parkeren in te voeren, onder meer om het waterbedeffect voor te zijn."}, {"wie": "Leefbaar Rotterdam", "punt": "Is meermalen tegen hogere parkeertarieven en vergunningen en wil de bewoner ontzien, bijvoorbeeld met gratis bewonersvergunningen en een betaalbare parkeerprijs, en maakt zich zorgen over weggehaalde parkeerplaatsen."}, {"wie": "PvdA", "punt": "Vindt dat betaald parkeren alleen past als er een parkeerprobleem is, en noemt het anders een geldmachine ten koste van bewoners."}, {"wie": "DENK", "punt": "Pleit in meerdere fragmenten voor maatwerk en lagere lasten voor bewoners, marktbezoekers, zorgverleners en bezoekers van religieuze instellingen."}, {"wie": "SP", "punt": "Vindt in 2026 dat betaald parkeren kan bij een concreet probleem en draagvlak onder bewoners, en is tegen het voorstel om het uit te breiden."}], "recent": "In 2025 gaat het onder meer over de nieuwe beleidsregel voor parkeernormen en over handhaving: de wethouder meldt een pilot met scanauto's tegen foutparkeren en stoepparkeren, waaraan het Afrikaanderplein is toegevoegd. In het debat 'Uitbreiden betaald parkeren' van 1 oktober 2026 (automatische ondertiteling) bespreekt de raad het nieuwe kader met onder meer vragen over de juridische onderbouwing en de rol van parkeerdruk, en ontraadt de wethouder moties over gratis vergunningen en een gratis eerste uur vanwege de gevolgen voor de begroting."}, "1": {"id": 1, "kern": "Het thema omvat in de fragmenten fietsen (routes, fietsparkeren, deelfietsen en deelscooters), verkeersveiligheid, autoverkeer in de stad en het openbaar vervoer (tram, metro, nieuwe oeververbinding, regionale plannen via de MRDH). Terugkerende kwesties zijn de balans tussen auto, fiets, voetganger en openbaar vervoer, de bereikbaarheid voor ondernemers en automobilisten, en de leefbaarheid en luchtkwaliteit. Veel debatten gaan over concrete plekken, zoals de Maastunnel, de Nieuwe Binnenweg, het Kruisplein en Rotterdam-Zuid. Ook handhaving van verkeersregels, onder meer van verkeersasociaal gedrag, komt vaak terug.", "ontwikkeling": [{"periode": "2018", "wat": "De raad bespreekt onder meer paaltjes op een druk fietspad bij het Centraal Station, de begroting 2019 met investeringen in fiets, voetganger en openbaar vervoer, en een nieuwe oeververbinding."}, {"periode": "2019", "wat": "De Fietskoers 2025 wordt vastgesteld, de Rotterdamse Mobiliteitsaanpak krijgt veel steun in de raad en er komt aandacht voor een vergunningstelsel voor deelfietsen na achtergelaten fietsen van een failliete aanbieder."}, {"periode": "2020–2021", "wat": "De raad debatteert over verkeersexperimenten zoals bij de Maastunnel, hoogwaardig openbaar vervoer door de Maastunnel, 30 kilometer per uur, fietsparkeren en verkeersveiligheid."}, {"periode": "2022", "wat": "Het verkeersexperiment bij de Maastunnel wordt geëvalueerd, er is discussie over de keuze tussen een brug met tram of een metrotunnel als oeververbinding, en over verkeersproblemen door werkzaamheden."}, {"periode": "2023–2024", "wat": "Het Plan Toekomstvast Tramnet 2030 (onder meer tram op de Nieuwe Binnenweg), de aanpak van verkeersasociaal gedrag, verkeersveiligheid bij scholen en het verkeerscirculatieplan met P+R-strategie staan op de agenda."}], "standpunten": [{"wie": "GroenLinks", "punt": "Zet in de fragmenten in op fietsers, voetgangers en openbaar vervoer, wil dat de oeververbinding een metrotunnel wordt en kiest bij het tramnet voor het behoud van het openbaar vervoer."}, {"wie": "Leefbaar Rotterdam", "punt": "Pleit voor een integrale mobiliteitsaanpak waarin alle vervoerswijzen kunnen blijven bestaan, let op betaalbaarheid en wil dat er rekening wordt gehouden met de auto."}, {"wie": "VVD", "punt": "Zet verkeersveiligheid voorop en wil vervoerswijzen uit elkaar halen; wethouder Karremans wil de tram van de Nieuwe Binnenweg halen voor veiligheid en herinrichting en noemt een metrotunnel geen realistische optie."}, {"wie": "D66", "punt": "Wil de fietser ruim baan geven ('fietsers first') en is voorstander van betere fietsroutes en fietsparkeren, en later van betere omleidingen voor fietsers bij werkzaamheden."}, {"wie": "DENK", "punt": "Noemt de auto in meerdere fragmenten essentieel voor veel Rotterdammers en wil in 2022 het Maastunnel-experiment zo snel mogelijk beëindigen."}, {"wie": "PvdA", "punt": "Wil op de Nieuwe Binnenweg de tram behouden en de verkeersveiligheid aanpakken met andere maatregelen, zoals eenrichtingsverkeer en minder parkeervakken."}], "recent": "In 2025 komen onder meer fietsmobiliteit (fietsendiefstal, fietsdrempels), deelfietsen op Rotterdam-Zuid, het verkeerscirculatieplan met de Bergweg en de Nieuwe Binnenweg, en de systeemkeuze voor hoogwaardig openbaar vervoer op de nieuwe stadsbrug aan bod. In 2026 gaat het onder meer over de Verkeersaso-aanpak 2.0 met camera's en handhavingscapaciteit, over de vervoersplannen van de MRDH en over het openbaar vervoer voor ouderen."}, "2": {"id": 2, "kern": "Wonen draait in de fragmenten om de Woonvisie en de verdeling van de woningvoorraad over sociaal, midden en duurder, en om de vraag hoeveel sociale huurwoningen er blijven en bijkomen. Terugkerende kwesties zijn sloop en herstructurering (zoals de Tweebosbuurt en het Nationaal Programma Rotterdam-Zuid), de rol en financiële ruimte van woningcorporaties, prestatieafspraken en grondprijzen. Ook gaat het vaak over het woningtekort, wachtlijsten, starters, ouderen, studenten, statushouders, dakloosheid en leegstand. Daarnaast komen goed verhuurderschap, huren en verduurzaming van huurwoningen terug.", "ontwikkeling": [{"periode": "2018", "wat": "De raad debatteert over de Woonvisie, over sloop en nieuwbouw (in het coalitieakkoord is sprake van 12.000 te slopen en 18.000 te bouwen woningen), over voorrang voor statushouders en over de prestatieafspraken met corporaties."}, {"periode": "2019–2020", "wat": "Er is een geschil over een financiële bijdrage van corporaties aan de particuliere voorraad in Rotterdam-Zuid, het Actieplan Middenhuur wordt behandeld en in 2020 volgt een herziening van het addendum op de Woonvisie."}, {"periode": "2021", "wat": "Onderwerpen zijn de ijkpunten voor de beschikbaarheid van sociale huurwoningen, overbieden en opkoopbescherming, de starterslening en de vraag of het bouwtarget van 18.000 woningen wordt gehaald."}, {"periode": "2022–2023", "wat": "De raad bespreekt de prestatieafspraken 2022–2023, de rechten van huurders bij het opkopen van woningen en in december 2023 het verhogen van de sociale grondprijzen."}, {"periode": "2024–2025", "wat": "De Woonvisie 'Een koers tot 2040' wordt vastgesteld, met debat over leegstand, dakloosheid en de sociale voorraad, en in 2025 volgen onder meer een debat Wonen, een initiatiefvoorstel over leegstand en discussies over verduurzaming van huurwoningen."}], "standpunten": [{"wie": "VVD", "punt": "Ziet het woningtekort als kern van het probleem, wil bouwen in alle segmenten met hulp van marktpartijen en vindt dat corporaties een eerlijkere grondprijs kunnen betalen."}, {"wie": "GroenLinks", "punt": "Wil meer betaalbare en sociale huurwoningen en vindt de ambities te laag; pleit in de fragmenten ook voor een leegstandsverordening en de bestaande voorraad beter te benutten."}, {"wie": "SP", "punt": "Wijst in meerdere fragmenten op het tekort aan sociale huurwoningen, is kritisch over sloop en wil groei van het aantal blijvend sociale huurwoningen."}, {"wie": "50PLUS", "punt": "Is tegen sloop van betaalbare woningen en tegen een financiële bijdrage van corporaties aan de particuliere voorraad, en vraagt om bouw voor het juiste segment."}, {"wie": "PvdA", "punt": "Wil de sociale voorraad behouden, onder meer door afspraken met particuliere verhuurders, en dient later een initiatiefvoorstel in over langdurige leegstand."}, {"wie": "Leefbaar Rotterdam", "punt": "Stelt in 2018 in de Woonvisie dat Rotterdammers met een beter inkomen in de stad moeten blijven, wil later onder meer meer eigenwoningbezit en is kritisch op het halen van de bouwtargets."}], "recent": "In 2025 en 2026 gaat het onder meer over het debat Wonen, de leegstand (een raadsvoorstel over een leegstandsverordening wordt in oktober of november 2026 verwacht, met invoering in januari 2027) en de woonzorgvisie. In oktober 2026 staan de Woonvisie en de prestatieafspraken met corporaties 2026–2027 op de agenda, met onder meer discussie over blijvend sociale huurwoningen en extra huurinkomsten van corporaties."}, "3": {"id": 3, "kern": "In de raad gaat het bij dit thema vooral over bestemmingsplannen en later omgevingsplannen voor concrete gebieden en projecten, en over grote gebiedsontwikkelingen zoals Feyenoord City, de Oostflank, Merwe-Vierhavens en het Schiekadeblok. Terugkerende kwesties zijn hoogbouw en bouwhoogtes, het aantal en soort woningen (waaronder betaalbare en sociale woningen), behoud van groen, horeca en geluid, en de manier waarop omwonenden en de raad worden betrokken. Meermaals gaat het ook over de procedure zelf: zienswijzen, de Raad van State, bezwaar en beroep en de overgang naar de Omgevingswet.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Bestemmingsplannen zoals Maasvlakte 2, het Quarantaineterrein, De Nieuwe Wielewaal en Zestienhoven komen aan bod, en in 2019 worden de Hoogbouwvisie en het masterplan voor Feyenoord City behandeld."}, {"periode": "2020–2021", "wat": "In december 2020 ligt het bestemmingsplan Feyenoord City ter vaststelling voor; in 2021 ligt het bij de Raad van State en gaat het debat over wat er gebeurt als Feyenoord geen nieuw stadion bouwt."}, {"periode": "2022", "wat": "De raad debatteert over een nieuwe start voor het plangebied Feyenoord City en over de scenario's als het bestemmingsplan wordt vernietigd, naast plannen als Kern en Plassen en het Schiekadeblok."}, {"periode": "2023–2024", "wat": "Herziening van de Omgevingsvisie en de Oostflank, het actualiseren van bestemmingsplannen vóór 1 januari 2024, en plannen als Tweebosbuurt-Oost, Mallegat, Carnisse Eiland en Weena70 waarbij hoogbouw en groen terugkomen."}, {"periode": "2025–2026", "wat": "Omgevingsplannen, projectambitiedocumenten en gebiedsambitiedocumenten (onder meer Provimi, Merwe-Vierhavens, De Esch en Rietveld), vertraging door bezwaar en beroep, en in 2026 de Uitvoeringsstrategie Omgevingsvisie."}], "standpunten": [{"wie": "VVD (J.W. Verheij)", "punt": "Noemt de Hoogbouwvisie een goed kader voor meer hoogbouw op meer plekken en vindt dat een bestemmingsplan zoals Feyenoord City kan worden vastgesteld ook als de private financiering nog niet geheel rond is."}, {"wie": "GroenLinks (Astrid Kockelkoren)", "punt": "Is positief over de Hoogbouwvisie en verdichten bij hoogwaardig openbaar vervoer, vraagt om bescherming van groenstructuur en stelt in 2022 dat woningen zo snel mogelijk gebouwd moeten worden."}, {"wie": "ChristenUnie", "punt": "Stelt in 2024 kritische vragen over hoogbouw, onder meer met een motie bij Weena70 en vragen over het Zomerhofkwartier."}, {"wie": "S.A. Kurvers (VVD, wethouder)", "punt": "Ziet bij Feyenoord City de gebiedsontwikkeling met woningen als hoofddoel en vond het bestemmingsplan in 2021 en 2022 nog haalbaar en de moeite waard om te behouden."}, {"wie": "Chantal Zeegers (wethouder, D66)", "punt": "Koppelt bestemmingsplannen aan de woningnood en het tempo, onder meer via de coördinatieregeling, en wijst in 2025 op vertraging door bezwaar en beroep."}, {"wie": "Robert Simons (Leefbaar Rotterdam, wethouder)", "punt": "Zei in 2018 dat verdichten in de stad soms concessies vraagt, ook in een park, en steunde in 2022 een motie om ondernemers in het Schiekadeblok te helpen."}], "recent": "In 2025 en 2026 gaat het om omgevingsplannen en gebiedsambitiedocumenten voor onder meer Provimi, Merwe-Vierhavens, De Esch, Rietveld en de Stadiondriehoek, om vertraging door bezwaar en beroep en om het herstelbesluit voor het Schiekadeblok. In 2026 behandelt de raad ook de Uitvoeringsstrategie Omgevingsvisie, met een spoor voor grote gebiedsontwikkelingen en een spoor voor wijkontwikkeling."}, "4": {"id": 4, "kern": "In de raad gaat het bij dit thema vooral over het aanbieden en ophalen van afval (containers, naast de container geplaatst afval, grofvuil, zwerfafval), het schoonhouden van straten en de staat van de buitenruimte, en afvalscheiding en grondstoffen. Terugkerende kwesties zijn de kosten en de afvalstoffenheffing, handhaving en cameratoezicht, de rol van bewoners zoals containeradoptanten, en het riool- en klimaatwerk in de straat. Ook de inrichting en het onderhoud van groen en openbare ruimte in wijken, onder meer in Rotterdam-Zuid, komt meermaals terug. In 2018 levert de zoekterm container ook fragmenten op over containeroverslag in de haven.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Aandacht voor grofvuil en afval bij containers, zwerfvuil en meetcijfers voor schone straten, en in 2019 de Grondstoffennota 2019–2022, de nota Rotterdam Schone Stad, het rioleringsplan en een voorstel voor een confettiverbod."}, {"periode": "2020–2021", "wat": "Door corona wordt meer afval aangeboden; het college noemt sensoren in ondergrondse containers en nieuwe containers, en de raad bespreekt cameratoezicht bij containers, het Gemeentelijk Rioleringsplan en de Hemelwaterverordening."}, {"periode": "2022–2023", "wat": "Gesproken wordt over een kostendekkender afvalstoffenheffing, gfe-bakken bij hoogbouw, de Grondstoffennota 2023–2026 en de Nota Samen SchoonR 2023–2026."}, {"periode": "2024", "wat": "Het Actieplan 2024 bij Samen SchoonR (onder meer afvaleilanden en onderzoek op markten) en het Rekenkamerrapport 'Zorg voor groen' over groene buitenruimte, met extra vergroening en klimaatadaptieve maatregelen."}, {"periode": "2025–2026", "wat": "Voortgangsrapportages over grondstoffen en SchoonR, met aandacht voor gfe+t-afval, statiegeldbakken en een staking bij AVR, en in 2026 het debat 'Vies begin van 2026' en het debat 'Schone en circulaire stad'."}], "standpunten": [{"wie": "GroenLinks (Kockelkoren, Morkoç)", "punt": "Vindt afval voorkomen beter dan opruimen, wijst op niet gehaalde doelen voor afvalscheiding, wil dat bedrijven en supermarkten hun verpakkingsafval zelf inzamelen en stelt in 2026 voor bestaande containers aan te passen."}, {"wie": "B. Wijbenga-Van Nieuwenhuizen (VVD, wethouder)", "punt": "Zei in 2018 tot 2021 dat inzameling en reiniging niet minder worden, wil handhaving en bekeuringen voor wie afval dumpt, en zet in op sensoren in containers en containeradoptanten."}, {"wie": "Vincent Karremans (VVD, wethouder)", "punt": "Wil afvalscheiding stimuleren, onder meer met gfe-bakken bij hoogbouw, de afvalstoffenheffing kostendekkender maken en SchoonR samen met de stad uitvoeren."}, {"wie": "Pascal Lansink-Bastemeijer (wethouder)", "punt": "Kiest voor nascheiding boven bronscheiding, wil containers slimmer maken binnen het budget en benadert wijken zonder containeradoptanten persoonlijk."}, {"wie": "Leefbaar Rotterdam", "punt": "Vraagt aandacht voor de staat van de buitenruimte, zoals achterstallig onderhoud in de Vogelbuurt in 2021, en wil in 2026 dat een hogere afvalstoffenheffing ook in de buitenruimte wordt geïnvesteerd."}, {"wie": "ChristenUnie-SGP", "punt": "Let op de gevolgen voor inwoners en bedrijven, bijvoorbeeld bij de afvalstoffenheffing in 2018, bij veranderde scheidingsroutines in 2019 en met een afvalcoach voor bedrijven in 2023."}], "recent": "In 2025 en 2026 gaat het vooral over betere en slimmere containers, statiegeldbakken, volle containers en afval op straat, het in beeld brengen van probleemcontainers en containeradoptanten, en wat het schoonhouden van de stad mag kosten. De wethouder Sabine Biesheuvel zegt in september 2026 dat het afvalsysteem complex is en dat er geen quick fixes bestaan."}, "5": {"id": 5, "kern": "In de raad gaat het bij dit thema vooral over de energietransitie en de CO2-doelen van de stad, met het Rotterdams Klimaatakkoord en later het Klimaat Actieplan Rotterdam als kaders. Terugkerende kwesties zijn de betaalbaarheid voor gewone Rotterdammers en energiearmoede, van het aardgas af gaan met warmtenetten en het Warmtebedrijf, en de plaatsing van windturbines en zonnepanelen met de vraag hoe bewoners worden betrokken. Daarnaast komen de haven (walstroom, stikstof, netcongestie), luchtkwaliteit en klimaatadaptatie meermaals terug.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Het nieuwe college maakt van de energietransitie een speerpunt, met als doelen 49% CO2-reductie in 2030 en klimaatneutraal in 2050, en in 2019 komen het Raadsakkoord Energietransitie en het Herstelplan Warmtebedrijf aan bod."}, {"periode": "2020–2021", "wat": "Het Rotterdams Klimaatakkoord met 49 klimaatdeals, het Energietransitiefonds, de Transitievisie Warmte en de Regionale Energiestrategie worden besproken, naast energiearmoede, de plannen voor windenergie bij het Beneluxplein in Pernis en een besluit over het Warmtebedrijf waarover teleurstelling wordt uitgesproken."}, {"periode": "2022", "wat": "De eindevaluatie van de Maastunnelcorridor over luchtkwaliteit, debatten over windturbines bij Rozenburg en Pernis, energiecompensatie voor studenten en investeringen in walstroom komen aan bod."}, {"periode": "2023–2024", "wat": "Het Klimaat Actieplan Rotterdam, het Burgerberaad Klimaat en het klimaatadaptatieprogramma WeerWoord worden besproken, en aardgasvrij-projecten lopen vertraging op door een investeringsstop bij Eneco en Vattenfall."}, {"periode": "2025–2026", "wat": "Updates van het Klimaat Actieplan, stikstof en netcongestie rond de haven, de reactie op kernenergie en windenergie in de provincie staan op de agenda."}], "standpunten": [{"wie": "GroenLinks (Mina Morkoç)", "punt": "Vraagt in de oppositie om meer urgentie en meetbare doelen, en later om wetenschappelijk advies en een klimaatraad voor het klimaatplan 2030."}, {"wie": "Leefbaar Rotterdam", "punt": "Steunt klimaatambities maar wil dat de energietransitie betaalbaar blijft voor gewone Rotterdammers en ondernemers, en legt in 2025 en 2026 de nadruk op havenbanen, netcongestie, stikstof en een 'Deltaplan Energie Rotterdam'."}, {"wie": "Partij voor de Dieren", "punt": "Vraagt om concrete, afrekenbare doelen, wil dat restwarmte, CO2-opslag en biomassa niet meetellen voor de doelen en wil geen geïmporteerd afval voor CO2-reductie."}, {"wie": "DENK", "punt": "Steunt de energietransitie op voorwaarde dat die niet ten koste gaat van mensen met een laag inkomen, en vraagt aandacht voor energiearmoede en kwetsbare wijken."}, {"wie": "Forum voor Democratie", "punt": "Pleit in 2025 voor kernenergie als hoeksteen van het energiebeleid."}, {"wie": "Chantal Zeegers (wethouder, D66)", "punt": "Legt de nadruk op actie in de praktijk in plaats van extra administratie, ziet warmtenetten als beste oplossing voor het binnenstedelijk gebied en vindt een target voor energieverbruik ingewikkeld."}], "recent": "In 2025 en begin 2026 gaat het in de updates van het Klimaat Actieplan over de vraag of de doelen voor 2030 haalbaar zijn: volgens de wethouder is dat binnenstedelijk met extra inzet binnen bereik, terwijl bij de haven meer vraagstukken spelen, zoals netcongestie en stikstof. Daarnaast komen windenergie (een zienswijze op een provinciaal onderzoek in juni 2026), kernenergie en het vestigingsklimaat van de haven aan bod."}, "6": {"id": 6, "kern": "In de fragmenten gaat het over veiligheid in de breedste zin: politie-inzet en politiecapaciteit, handhaving door boa's en handhavers, cameratoezicht, overlast, explosies en drugscriminaliteit en preventief fouilleren. Meermaals komt de vraag terug wie bepaalt waar de politie wordt ingezet: de burgemeester wijst in de fragmenten op de driehoek en op de beperkte capaciteit, en zegt geen tactische informatie met de raad te delen. Ook vertrouwen in de politie, discriminatie bij de politie en het demonstratierecht keren terug. Daarnaast spelen overlast in wijken en winkelgebieden en de vraag wat handhaving op straat kan oplossen.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Het veiligheidsprogramma Veilig@Rotterdam 2018-2023 wordt besproken, met discussie over politieadviezen bij plannen, cameratoezicht, bodycams voor handhavers en de aanpak van overlast en evenementen."}, {"periode": "2020–2021", "wat": "Politiecapaciteit en de verdeling over de stad staan centraal, naast de handhaving van het vuurwerkverbod, het onderzoek naar de racistische appgroep bij de politie en het politieoptreden bij de demonstratie Woonopstand."}, {"periode": "2022", "wat": "De Veiligheidskoers 2023-2027 wordt vastgesteld en er is debat over persoonsgericht preventief fouilleren van jongeren, over woon- en straatoverlast door studenten in Kralingen en over demonstraties."}, {"periode": "2023", "wat": "Na een reeks explosies debatteert de raad over ondermijning, nazorg in de getroffen wijken en politiecapaciteit, en over de procedure bij mobiele camera-auto's en cameratoezicht als laatste middel."}, {"periode": "2024–2026", "wat": "Preventief fouilleren (handelingskader, derde waarnemer), onrust bij de MediaMarkt-actie, overlast op de Lijnbaan, De Esch en Nesselande en de inzet van boa's komen terug, met een nieuwe burgemeester vanaf eind 2024."}], "standpunten": [{"wie": "Burgemeester (Aboutaleb, later Schouten)", "punt": "De inzet van de politie is aan de politie en de driehoek, cameratoezicht is een laatste middel, en preventief fouilleren wordt gesteund binnen het handelingskader met extra waarborgen."}, {"wie": "VVD", "punt": "Steunt de politie in de fragmenten en vraagt in 2024 om een streng handhavingsbeleid op plekken zoals het centrum, onder meer met Mosquito's en preventief fouilleren."}, {"wie": "Leefbaar Rotterdam", "punt": "Spreekt in 2024 steun uit voor politieagenten en vraagt in 2022 om duidelijkheid over hoe de gemeente gaat handhaven op studentenoverlast."}, {"wie": "D66", "punt": "Wil een veilige en vrije stad, met aandacht voor het demonstratierecht en voor voldoende politie in kwetsbare wijken."}, {"wie": "Partij voor de Dieren", "punt": "Vindt in 2026 dat een boa geen vervanger van een politieagent is en vraagt om te investeren in politie in plaats van taken bij boa's te leggen."}, {"wie": "SP", "punt": "Wijst in 2021 op zorgen in de wijk over een wij-zij-cultuur tussen politie en bewoners na discriminerende uitingen bij de politie."}], "recent": "In 2025 en 2026 gaat het onder meer over overlast en drugsgerelateerde overlast in wijken zoals De Esch, Agniesebuurt en Oude Noorden, het Museumpark en Nesselande, en over een prioriteringsagenda voor handhaving. De burgemeester zegt in 2026 niet tevreden te zijn over de stand van veiligheid en dat handhaving alleen het probleem niet structureel oplost; ook OV-verboden, verkeersoverlast en cameratoezicht bij afval komen aan bod."}, "7": {"id": 7, "kern": "In de fragmenten gaat het vooral over armoede- en schuldenbeleid (armoedebestrijding, kinderarmoede, schuldhulp, AOW- en jeugdtegoed, regelingen voor mensen met een laag inkomen) en over de bijstand en de Participatiewet. Terugkerende kwesties zijn de uitstroom uit de bijstand naar werk, de verplichtingen in de bijstand, fraude en rechtmatigheid, en de vraag of het armoedebudget volledig wordt uitgegeven. Het college wijst meermaals op de rol van het rijk bij het inkomensbeleid en zegt zelf vooral de gevolgen van armoede te verzachten. Ook de pauzeknop bij schulden en de positie van studenten en gedupeerden van het toeslagenschandaal komen terug.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Er is een wethouder Armoedebestrijding, de raad bespreekt het beleidskader Armoedeaanpak 2019-2022 en het uitvoeringsplan schuldenaanpak, en de AOW- en jeugdtegoeden worden verhoogd."}, {"periode": "2020–2021", "wat": "Tijdens corona gaat het over onderbesteding en later overbesteding van het armoedebudget, schulden van ondernemers met Tozo, een voorstel voor een schuldenopkoopfonds, energiearmoede en het gebruik van algoritmes in de bijstand."}, {"periode": "2022–2023", "wat": "Er komt extra geld voor een Armoedefonds en het beleid voor armoede en schulden wordt herijkt, met debat over de pauzeknop, bijzondere bijstand voor studenten en later het beleidskader 'Rotterdam voor iedereen'."}, {"periode": "2023–2024", "wat": "Een nieuw beleidskader voor de Participatiewet legt nadruk op werk en op een gerichte fraudeaanpak, terwijl de raad praat over de kostendelersnorm, de garantieknop en vervoersarmoede."}, {"periode": "2025–2026", "wat": "Het doel om het aantal mensen in de bijstand terug te brengen wordt niet gehaald, er is debat over onderbesteding van het armoedebudget en het coalitieakkoord 2026-2030 maakt de armoedebudgetten structureel."}], "standpunten": [{"wie": "Leefbaar Rotterdam", "punt": "Ziet uit de bijstand komen en aan het werk gaan als belangrijkste doel binnen het armoedebeleid (2019)."}, {"wie": "VVD", "punt": "Noemt werk de duurzame weg uit armoede en wil dat fraude in de bijstand niet loont, met oog voor de menselijke maat."}, {"wie": "PvdA", "punt": "Pleit voor een schuldenopkoopfonds en een schuldenstop en vraagt in 2025 om het beschikbare armoedegeld ook uit te geven."}, {"wie": "DENK", "punt": "Vraagt in meerdere jaren om meer middelen voor armoedebeleid en om geen bezuiniging, en wil dat armoedegeld ook voor armoede wordt gebruikt."}, {"wie": "GroenLinks", "punt": "Wil eenvoudiger procedures voor regelingen en vindt in 2024 dat het bijstandsniveau omhoog zou moeten."}, {"wie": "50PLUS", "punt": "Zegt dat armoede meer is dan schulden en wil een Rotterdamse aanpak met nadruk op werk en op ouderen met een laag inkomen."}], "recent": "In 2025 en 2026 benoemt wethouder Versnel dat het doel van minder mensen in de bijstand niet is gehaald, al is het aantal teruggebracht. In 2026 wordt in het coalitieakkoord afgesproken dat armoedebudgetten structureel worden, en de wethouder zegt een uitwerking te maken voor de komende begroting, ook als compensatie via het AOW-tegoed bij het afschaffen van gratis OV voor ouderen."}, "8": {"id": 8, "kern": "In de fragmenten gaat het vooral over het ouderenbeleid (Ouder en Wijzer, later Goud voor Oud), mantelzorg, welzijnswerk in de wijken en de organisatie en kosten van zorg en jeugdzorg. Terugkerende kwesties zijn eenzaamheid, woningen en woonzorg voor ouderen, de aanbesteding en bezuinigingen van het welzijnswerk en de vraag of beleid en ambities in de praktijk zijn waargemaakt. Ook de GGD (vooral tijdens corona) en huisartsenpraktijken komen terug. Door de zoekterm welzijn gaat een deel van de fragmenten over dierenwelzijn.", "ontwikkeling": [{"periode": "2018–2019", "wat": "De raad debatteert over wonen en zorg voor ouderen in De Evenaar, over zorg en jeugdzorg in de begroting, het Masterplan Ouderen en de aanbesteding van het mantelzorgsteunpunt."}, {"periode": "2020–2021", "wat": "Tijdens corona gaat het over kwetsbare ouderen, de GGD en de opvang van ouderen bij boosterprikken, naast het Langer Thuis Akkoord, huisartsenruimtes en een kritisch Rekenkamerrapport over het ouderenbeleid."}, {"periode": "2022", "wat": "De eindrapportage van Ouder en Wijzer wordt besproken, waarbij het doel om eenzaamheid te verminderen niet is gehaald, en er is aandacht voor het welzijnswerk in Feijenoord en voor mantelzorgers."}, {"periode": "2023–2024", "wat": "Het Programma Zorg met vier tafels (onder meer ouderen en jeugd), de kosten van Wmo en jeugdzorg, de actieagenda Goud voor Oud en bezuinigingen op welzijn in de Voorjaarsnota staan centraal."}, {"periode": "2025–2026", "wat": "De brede welzijnsopdracht met lokaal budget, het financieel onderzoek naar het welzijnswerk in Feijenoord, digitale inclusie van ouderen en woningen voor ouderen komen aan bod, en in 2026 het gratis OV voor ouderen."}], "standpunten": [{"wie": "50PLUS", "punt": "Vindt in meerdere jaren dat het ouderenbeleid tekortschiet, noemt het Rekenkamerrapport als bewijs en wijst op bezuinigingen en eenzaamheid."}, {"wie": "Leefbaar Rotterdam", "punt": "Is in 2018 en 2022 kritisch op het beleid van het toenmalige college voor ouderen, bij De Evenaar en bij Ouder en Wijzer."}, {"wie": "DENK", "punt": "Vraagt aandacht voor ouderen en mantelzorgers, onder meer gratis OV voor mantelzorgers (2019) en digitale inclusie van ouderen (2025), en verzet zich in 2026 tegen het afschaffen van gratis OV voor ouderen."}, {"wie": "D66", "punt": "Vraagt aandacht voor ouderen en mantelzorgers en voor het bereiken van verschillende groepen ouderen, en verdedigt in 2026 als coalitiepartij de nieuwe opzet van gratis OV via het AOW-tegoed."}, {"wie": "Wethouder De Langen (CDA)", "punt": "Verdedigt in de periode 2018-2021 het ouderenbeleid en het Langer Thuis Akkoord en wijst op eenzaamheidsaanpak en maatwerk."}, {"wie": "Wethouder Achbar (DENK)", "punt": "Legt in 2022-2025 de nadruk op samenwerking in de wijk (lokaal budget) en noemt de bezuinigingen op welzijn pijnlijke keuzes die het hele college maakt."}], "recent": "In 2025 gaat het onder meer over de brede welzijnsopdracht, het financieel onderzoek naar het welzijnswerk in Feijenoord en digitale inclusie van ouderen. In 2026 domineert het debat over het afschaffen van gratis OV voor alle ouderen, waarbij het college compensatie via het AOW-tegoed noemt, en komen woonzorg voor ouderen en de sociale basis aan bod."}, "9": {"id": 9, "kern": "Onderwijs komt in de raad vooral terug via het Rotterdamse onderwijsbeleid, het lerarentekort, schoolgebouwen en gelijke kansen voor kinderen. Ook passend en inclusief onderwijs, thuiszitters, schoolveiligheid, schoolontbijt en kinderopvang of voorschoolse educatie worden meermaals besproken. In de fragmenten wijst de verantwoordelijk wethouder er herhaaldelijk op dat de gemeente niet over de lesinhoud gaat en dat schoolbesturen, het Rijk en de Inspectie hier aan zet zijn. Raadsleden dienen vaak moties in over onderwerpen die het college al bezig is op te pakken of buiten de gemeentelijke rol vindt vallen.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Er ging aandacht naar segregatie en het stichten van nieuwe scholen, naar stageplaatsen, burgerschapsonderwijs en het leerlingenvervoer, en in 2019 werd het onderwijsbeleid 'Gelijke kansen voor elk talent' met onder meer de vrijwillige ouderbijdrage en de kwestie rond Acato besproken."}, {"periode": "2020–2021", "wat": "Het lerarentekort en de leraarsstaking, de Zomercampus na corona, het Nationaal Programma Onderwijs en moties over ontbijt voor alle kinderen stonden centraal."}, {"periode": "2022", "wat": "De monitor van het Rotterdamse lerarentekort, de verdeling van NPO-middelen, schoolontbijt, de betaalbaarheid van voorschoolse kinderopvang en onderwijs voor Oekraïense jongeren kwamen aan bod."}, {"periode": "2023–2024", "wat": "De raad sprak over het Nieuw Rotterdams Onderwijsbeleid 2024–2027, het Integraal Huisvestingsplan Onderwijs, inclusief onderwijs, voorschoolse educatie en het programma 010 FitR met schoolzwemmen."}, {"periode": "2025–2026", "wat": "Thuiszitters, personeelstekort en veiligheid op scholen, de Onderwijsmonitor 2025 en de andere inzet op het lerarentekort in het coalitieakkoord 2026–2030 werden besproken."}], "standpunten": [{"wie": "Said Kasmi (D66, wethouder Onderwijs)", "punt": "Meermaals zegt hij dat de gemeente niet over het curriculum of de inhoud van schoolboeken gaat, ontraadt hij moties die scholen iets opleggen en vindt hij dat scholen niet alle maatschappelijke taken erbij kunnen krijgen."}, {"wie": "DENK", "punt": "Maakt zich in meerdere jaren sterk voor kansengelijkheid, burgerschapsonderwijs, aanpak van het lerarentekort en moties zoals ontbijt voor alle kinderen en hittebestendige schoolgebouwen."}, {"wie": "VVD", "punt": "Pleit voor gezonde, goed geventileerde en multifunctionele schoolgebouwen, voor behoud van leraren en voor meer aandacht voor financiële educatie."}, {"wie": "SP", "punt": "Maakt zich zorgen over segregatie en de ouderbijdrage in het onderwijs, en over het lerarentekort in kwetsbare wijken."}, {"wie": "PvdA", "punt": "Benadrukt in de fragmenten gelijke kansen, onder meer door de vroege schoolkeuze en door toegankelijke en inclusieve schoolgebouwen aan te kaarten."}, {"wie": "Leefbaar Rotterdam", "punt": "Vraagt aandacht voor een veilige leeromgeving en voor registratie van leerlingen die van school worden verwijderd, en diende eerder een motie in over het wegnemen van schotten tussen onderwijs en zorg."}], "recent": "In 2025 en 2026 gaat het onder meer over thuiszitters, over veiligheid op scholen na incidenten en over de Onderwijsmonitor 2025. In het coalitieakkoord 2026–2030 wordt de aanpak van het lerarentekort anders ingericht: onder meer parkeervergunningen en de Rotterdampas voor leraren komen te vervallen, en er is meer aandacht voor samenwerking tussen school en zorg en voor gratis peuterklassen."}, "10": {"id": 10, "kern": "Bij dit thema gaat het in de raad vooral over de haven, het mkb en de horeca. Bij de haven komen de energietransitie, de Havenvisie, het Havenbedrijf, werkgelegenheid, personeelstekort en bereikbaarheid steeds terug. Bij ondernemers en winkelstraten gaat het onder meer om huurstijgingen, steun tijdens corona en later de energiecrisis, en bedrijventerreinen. Bij de horeca spelen horecagebiedsplannen, nachthoreca, openingstijden, terrassen, handhaving en veiligheid in het uitgaansleven; ook de luchthaven wordt in verband met werkgelegenheid en hinder besproken.", "ontwikkeling": [{"periode": "2018–2019", "wat": "De kolenoverslag, het EMO-contract en de energietransitie in de haven, de Havenvisie die in 2019 werd vastgesteld, huurstijgingen voor lokale ondernemers in de binnenstad en de horecagebiedsplannen met 24-uursvergunningen stonden op de agenda."}, {"periode": "2020–2021", "wat": "Steun aan ondernemers en horeca tijdens corona (coronaloket, noodfonds, herstelplan en ondersteuningsplan voor de horeca, tijdelijke terrasuitbreiding) stond voorop, naast corruptie en criminaliteit in de haven en het werven van jongeren voor havenwerk."}, {"periode": "2022", "wat": "Er was aandacht voor het publiek kader van het Havenbedrijf, steun aan het mkb bij hoge energiekosten, het nieuwe luchthavenbesluit en horeca en ondernemers in gebiedsontwikkelingen zoals het Schiekadeblok."}, {"periode": "2023–2024", "wat": "De raad behandelde het horecabeleid en de horecanota, het mkb-actieprogramma, de voortgang van de herijkte Havenvisie, een voorgestelde zero-emissiezone en het Actieplan Bedrijfsruimte."}, {"periode": "2025–2026", "wat": "De ondernemingsstrategie van het Havenbedrijf, zorgen over banen in de haven, de Havenvisie 2050, het Nachtplan, de bereikbaarheid van de haven en het luchthavenbesluit werden besproken."}], "standpunten": [{"wie": "VVD", "punt": "Steunt in meerdere jaren het mkb en de horeca (waaronder nachtwinkels), wil dat regels ondernemers niet belemmeren en benadrukt het belang van de concurrentiepositie van de haven."}, {"wie": "DENK", "punt": "Pleit voor een eerlijke concurrentiepositie voor ondernemers in alle winkelstraten, langere openingstijden voor avond- en nachtwinkels en meer horeca-ontwikkeling in Rotterdam-Zuid."}, {"wie": "GroenLinks", "punt": "Wil dat het Havenbedrijf zijn koers verlegt richting de klimaatdoelen en bracht moties in over onder meer een zero-emissiezone en een groenere havenvisie."}, {"wie": "Leefbaar Rotterdam", "punt": "Vraagt aandacht voor horeca en mkb en maakt zich ook in het college (wethouder Haven Simons) sterk voor vertrouwen in ondernemers, opleiden voor havenwerk en het verduurzamen van de haven."}, {"wie": "PvdA", "punt": "Richt zich in de fragmenten op werkgelegenheid in de haven, het oplossen van de mismatch tussen opleiding en banen en het zichtbaar maken van de haven voor jongeren."}, {"wie": "D66", "punt": "Pleit voor een levendig nachtleven en horeca, en wil in 2025 een actieve rol van de gemeente bij het aantrekken van nieuwe bedrijven naar de haven."}], "recent": "In 2025 en 2026 gaat het over zorgen om banen en investeringen in de haven, de Havenvisie 2050 (met discussie over kernenergie en klimaat) en de bereikbaarheid van de haven, waarvoor een pilot met het bedrijfsleven loopt. Daarnaast spelen de veiligheid in het uitgaansleven, horeca en nachtcultuur, het luchthavenbesluit en de inzet op startups en scale-ups uit het coalitieakkoord."}, "11": {"id": 11, "kern": "Bij dit thema gaat het vooral om evenementen, musea en het cultuurbeleid, met ook aandacht voor sport en bibliotheken. Bij evenementen komen de verdeling van de evenementenkalender, veiligheid, locaties, overlast en geluid in parken steeds terug. Bij cultuur gaat het om de renovatie van Boijmans Van Beuningen, het sluiten van Museum Rotterdam en het stadsmuseum, het cultuurplan, subsidies, diversiteit en het nieuwe adviesmodel. Bij sport komen sportverenigingen, urban sports en het Jeugdfonds Sport en Cultuur ter sprake.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Het evenementenbeleid (met onder meer de A-, B- en C-evenementen en veiligheid), de renovatie van Museum Boijmans Van Beuningen, de Cultuurvisie en de kandidaatstelling voor het Eurovisie Songfestival stonden op de agenda."}, {"periode": "2020–2021", "wat": "Het Cultuurplan 2021–2024 met de sluiting van Museum Rotterdam, de financiële tegenvaller bij Boijmans, de vernieuwing van de Centrale Bibliotheek, steun aan de sector tijdens corona en de urban sporters op het Museumpark werden besproken."}, {"periode": "2022", "wat": "De raad behandelde de Parapluherziening Evenementen met discussies over geluid en locaties zoals het Vroesenpark, het ontwerp van het Boijmans-museum en een nieuw adviesmodel voor de cultuursector."}, {"periode": "2023–2024", "wat": "Het initiatiefvoorstel Evenementenstad Rotterdam, evenementen die niet doorgingen of niet op de kalender kwamen (zoals de Dance Parade en het Zomercarnaval), het Cultuurplan 2025–2028 en de Impulsregeling kwamen aan bod."}, {"periode": "2025–2026", "wat": "Het Mariniersmuseum, de voortgang van de Boijmans-renovatie, de Cultuurhaven als nieuw adviesorgaan, het B/C-evenementenoverzicht 2026 en de budgetten voor festivals werden besproken."}], "standpunten": [{"wie": "Said Kasmi (D66, wethouder Cultuur)", "punt": "Verdedigt de sluiting van Museum Rotterdam als noodzakelijke stap voor een herstart, laat de inhoud aan de museumsector en wijst erop dat de evenementenkalender na een brede afweging tot stand komt."}, {"wie": "Ahmed Aboutaleb (burgemeester)", "punt": "Zegt meermaals dat de organisator verantwoordelijk is voor de veiligheid van een evenement, dat politiecapaciteit bepaalt hoeveel evenementen mogelijk zijn en dat de politiek niet moet kiezen welk evenement voorrang krijgt."}, {"wie": "D66", "punt": "Wil meer en duurzamere evenementenlocaties, benadrukt dat evenementen bijdragen aan de stad en eiste dat de extra kosten van het Boijmans-ambitiescenario extern gedekt werden."}, {"wie": "Partij voor de Dieren", "punt": "Maakt bezwaar tegen het sluiten van Museum Rotterdam en wil grote evenementen niet in groen en natuurgebieden."}, {"wie": "DENK", "punt": "Pleit in meerdere jaren voor inclusieve en diverse evenementen en cultuur, en voor kansen voor kleinere organisatoren."}, {"wie": "VVD", "punt": "Diende moties in over overlast op de routes naar evenementen en vroeg in 2025 om een debat over de toekomst van het Mariniersmuseum."}], "recent": "In 2025 en 2026 gaat het over de Cultuurhaven en de overgang naar een nieuw adviesmodel voor het volgende cultuurplan, over het Mariniersmuseum en over de Boijmans-renovatie. Bij evenementen spelen het B/C-evenementenoverzicht 2026, de bezuiniging op Rotterdam Festivals en de vraag of Pride als culturele viering wordt aangemerkt."}, "12": {"id": 12, "kern": "Bij dit thema gaat het in de raad vooral over de begroting, de Voorjaarsnota en de jaarstukken: wat staat erin, wanneer krijgt de raad de stukken en hoe kan de raad ze bijsturen. Terugkerende kwesties zijn de hoogte van het weerstandsvermogen (de buffer voor tegenvallers), bezuinigingen op onder meer cultuur, wijkbudgetten en zorg, en gemeentelijke belastingen zoals de OZB, de logiesbelasting en de rioolheffing. Ook de inzet van geld uit de erfpachtconversie en de Eneco-gelden en de vraag of coalitieafspraken wel de rol van de raad (budgetrecht) respecteren komen meermaals terug. In de fragmenten verwijt de oppositie het college vaak dat de cijfers onduidelijk of onvolledig zijn, terwijl het college wijst op een sluitende begroting en de afspraken in het coalitieakkoord.", "ontwikkeling": [{"periode": "2018", "wat": "Na het aantreden van een nieuw college gaat het om het tijdstip waarop de raad de begroting 2019 ontvangt, de verhoging van de logiesbelasting van 4,5 naar 6% en de alternatieve begroting van een oppositiepartij."}, {"periode": "2019–2020", "wat": "De raad debatteert over stelposten en taakstellingen in de Voorjaarsnota, over een weerstandsvermogen van 1,0 en in 2020 over de financiële gevolgen van corona (Voorjaarsbrief, steun aan ondernemers en de begroting 2021)."}, {"periode": "2021–2022", "wat": "Het college accepteert een tijdelijke dip in het weerstandsvermogen om geen lastenverhoging of grote bezuinigingen op te leggen; in 2022 gaat het debat over de inzet van het geld uit de erfpachtconversie en het budgetrecht van de raad."}, {"periode": "2023–2024", "wat": "De OZB-verlaging uit het coalitieakkoord en de cruisebelasting zijn onderwerp van debat, en in 2024 komen een groot financieel tekort, een lening van € 100 miljoen uit de Investeringsmonitor en bezuinigingen op cultuur en wijkbudgetten aan de orde."}, {"periode": "2025–2026", "wat": "De raad bespreekt de gebruikte rekenmethode bij het vergelijken van tarieven in de begroting 2026, een onderzoek van de Rekenkamer naar onderschrijding van de lasten en een verzoek om een referendum over parkeerbelastingen."}], "standpunten": [{"wie": "D66 (wethouders Financiën in 2018–2021)", "punt": "Het college zet in op een sluitende begroting en een weerstandsvermogen van ongeveer 1,0, en verdedigt de begroting als uitwerking van het coalitieakkoord."}, {"wie": "Leefbaar Rotterdam", "punt": "Als oppositie stemde de fractie in 2020 tegen de begroting; in het college (2022–2025) verdedigden wethouders het coalitieakkoord, onder meer de OZB-korting, en wilden ze het weerstandsvermogen zo snel mogelijk op minstens 1 brengen."}, {"wie": "GroenLinks en PvdA", "punt": "Deze fracties vroegen om terugdraaien van de structurele OZB-korting (2023) en stelden in 2024 in een tegenbegroting voor de OZB voor eigenaren van bedrijfspanden te verhogen."}, {"wie": "50PLUS", "punt": "Een raadslid van deze fractie pleitte in 2020 voor een weerstandsvermogen boven de 1 en diende hierover een motie in; in 2018 diende de fractie moties in over externe inhuur."}, {"wie": "SP", "punt": "De fractie stemde in het verleden vaak tegen de begroting omdat met hetzelfde geld meer mogelijk zou zijn (2022), en vroeg in 2024 om een kaderbrief op hoofdlijnen voor de zomer."}, {"wie": "Wethouder Financiën Van Rij (2025)", "punt": "Hij ontraadt in 2025 om aan de lokale belastingen te draaien, wijst erop dat de begroting volgens de landelijke regels is opgesteld en zegt dat de raad via een amendement kan afwijken van de gekozen rekenmethode."}], "recent": "In 2025 en 2026 gaat het in de fragmenten over de Voorjaarsnota en de begroting 2026, met kritiek op de gebruikte rekenmethode voor tarieven en de keuze om de OZB niet te wijzigen. In 2026 komen ook het Rekenkamerrapport over onderschrijding van de lasten, het coalitieakkoord 2026–2030, de financiële risico's van het IT-project GREAT en bezuinigingskeuzes (onder andere rond ‘OV voor Ouderen’) langs."}, "13": {"id": 13, "kern": "In de raad gaat dit thema over de opvang van asielzoekers (AZC Beverwaard, later de Silja en opvanglocaties), het huisvesten en laten inburgeren van statushouders en de rol van het COA en het Rijk. Terugkerend is het onderscheid tussen asielzoekers, die door het COA worden opgevangen, en statushouders, die de gemeente moet huisvesten, en de vraag wat Rotterdam daarbij wel en niet moet doen. Daarnaast komen voorrang van statushouders op sociale woningen, hun werk en inburgering, de Spreidingswet en de opvang van uitgeprocedeerde asielzoekers en EU-arbeidsmigranten aan de orde. Veel debatten gaan ook over incidenten, draagvlak in de wijk en de omstandigheden op opvanglocaties.", "ontwikkeling": [{"periode": "2018–2019", "wat": "De Rotterdamse aanpak voor statushouders (taal, vrijwilligerswerk, werk) wordt gemonitord en bekritiseerd, en er zijn debatten over incidenten rond het AZC in de Beverwaard en over de opvang van uitgeprocedeerde asielzoekers (Bed, Bad, Brood)."}, {"periode": "2020–2021", "wat": "Het AZC in de Beverwaard sluit en de burgemeester zegt dat Rotterdam geen grootschalig AZC ‘klassieke stijl’ wil, terwijl het Rijk blijft zoeken naar opvang en in 2021 een aanwijzing voor opvangplaatsen geeft; ook de Rotterdamse opgave inburgering en voorrang voor statushouders op sociale woningen worden besproken."}, {"periode": "2022", "wat": "Het coalitieakkoord ‘Eén stad’ en de opvangcrisis leiden tot debat over het aantal asielzoekers dat Rotterdam opvangt (tot maximaal 500), over opvang op rivierschepen en over Oekraïense vluchtelingen."}, {"periode": "2023–2024", "wat": "De raad bespreekt een opvangschip, flexwoningen voor statushouders en andere groepen, de aanpak van EU-arbeidsmigranten en daklozen, en in 2024 de Spreidingswet met de vraag hoeveel plekken Rotterdam beschikbaar stelt."}, {"periode": "2025–2026", "wat": "De afbouw van de landelijke voorziening voor uitgeprocedeerden (LVV), het dubbel tellen van plekken en de omstandigheden op de Silja domineren de debatten, met in 2026 aandacht voor opvang op land."}], "standpunten": [{"wie": "Leefbaar Rotterdam", "punt": "In de fragmenten is de fractie kritisch over incidenten bij het AZC in de Beverwaard en over nieuwe opvanglocaties, noemt de Spreidingswet in 2025 een verplichting die weg moet en wil het aantal asielopvangplekken bij 500 houden."}, {"wie": "D66", "punt": "De fractie benadrukt dat asielzoekers en statushouders verschillende groepen zijn, dat Rotterdam aan zijn wettelijke taken voldoet en dat Rotterdam ook zonder dwang bijdraagt aan de Spreidingswet."}, {"wie": "DENK (wethouder Achbar)", "punt": "De wethouder zegt dat Rotterdam jaarlijks voldoet aan de taakstelling voor het huisvesten van statushouders en wil via plekken op het schip en elders de asielketen ontlasten."}, {"wie": "CDA", "punt": "Een raadslid van deze fractie stelt meermaals dat Rotterdam de Spreidingswet niet voldoende uitvoert en dat het coalitieakkoord een maximum van 500 asielzoekers noemt."}, {"wie": "VVD", "punt": "In 2018 en 2020–2021 verdedigden wethouders de huisvesting van statushouders en ontraadden ze moties om de voorrang te stoppen; in 2022 zei een raadslid dat Rotterdam het niet alleen kan oplossen en ook andere regio's een deel moeten nemen."}, {"wie": "PvdA", "punt": "De fractie vroeg in 2022 waarom het college minder statushouders wil opvangen en zei in 2024 zich zorgen te maken dat Rotterdam probeert onder de Spreidingswet uit te komen."}], "recent": "In 2025 en 2026 gaat het vooral om de Silja: debatten over de omstandigheden aan boord, met aandacht voor kinderen, en de overgang naar opvanglocaties op land. Bij het coalitieakkoord 2026–2030 noemden fracties de verhouding tussen asielzoekers en gekoppelde statushouders in de uitvoering van de Spreidingswet, waarop Leefbaar Rotterdam kritiek had."}, "14": {"id": 14, "kern": "Dit thema gaat in de raad over de dienstverlening aan inwoners (14010, de Stadswinkels, digitale en persoonlijke hulp, taal en toegankelijkheid) en over de gemeentelijke organisatie. Terugkerende kwesties zijn de omvang en kosten van externe inhuur, de vraag wat het college wel en niet mag sturen bij organisaties op afstand zoals Trevvel, de RET, Blijdorp en Ahoy, en de rol en bescherming van ambtenaren in debatten. Ook de dienstverlening van Werk en Inkomen, de ambtelijke integriteit en grote IT-projecten komen terug. In de fragmenten bedanken collegeleden regelmatig de ambtenaren en benadrukken ze dat bestuurders, en niet ambtenaren, aangesproken moeten worden.", "ontwikkeling": [{"periode": "2018", "wat": "De raad debatteert over de hoogte van externe inhuur (een verhoogd bedrag van 71 miljoen), over moties om dat te beperken en over de dienstverlening van Trevvel."}, {"periode": "2019", "wat": "Het Programma Dienstverlening 2019–2022 wordt besproken, met zorgen over de servicenormen bij de Stadswinkels en het terugbellen bij 14010, naast debatten over de dienstverlening van Werk en Inkomen aan jongeren."}, {"periode": "2020–2021", "wat": "De dienstverlening van Trevvel blijft onderwerp van debat, 14010 wordt in de coronatijd ingezet voor extra vragen en er komen moties over toegankelijkheid van het stadhuis en over ambtelijke integriteit."}, {"periode": "2022–2024", "wat": "Het gaat onder meer over toegankelijke taal (Nederlands en Engels, bij crises tijdelijk meer talen), het blijven aanbieden van persoonlijke hulp naast digitale dienstverlening en proactieve dienstverlening."}, {"periode": "2025–2026", "wat": "Het programma Kiezen voor Rotterdam met een formatieplafond, ambtsreizen en het IT-project GREAT (Oracle) komen aan de orde, naast moties over menselijk contact in de dienstverlening."}], "standpunten": [{"wie": "D66 (wethouders in 2018–2022)", "punt": "Het college zegt externe inhuur soms nodig te vinden voor dure of kortdurende dossiers, wil geen overzicht per dossier toezeggen dat te veel werk is en wil zich niet bemoeien met de bedrijfsvoering van organisaties als de RET en Ahoy."}, {"wie": "50PLUS", "punt": "De fractie diende in 2018 moties in om overschrijding van het budget voor externe inhuur te voorkomen en om minder externe inhuur te gebruiken."}, {"wie": "GroenLinks", "punt": "In 2019 vroeg een raadslid dat de servicenormen voor de Stadswinkels gehaald worden en dat het terugbelgedrag bij 14010 verbetert."}, {"wie": "DENK", "punt": "De fractie verdedigde in 2018 ambtenaren tegen publieke kritiek en diende in 2021 een motie in voor een toegankelijker stadhuis voor slechthorende Rotterdammers."}, {"wie": "Leefbaar Rotterdam", "punt": "Wethouders van deze partij wilden in 2022 dat Trevvel eerst zelf maatregelen nam, en in 2024 en 2026 benadrukten ze dat persoonlijke en telefonische dienstverlening naast digitale blijft bestaan."}, {"wie": "Burgemeester (Aboutaleb in 2019, Schouten in 2026)", "punt": "De burgemeester stelt dat de raad een relatie heeft met het college en niet met de ambtenaren, en in 2026 dat ambtenaren onder verantwoordelijkheid van het bestuur werken en dat het bestuur aangesproken moet worden."}], "recent": "In 2025 en 2026 gaat het in de fragmenten over Kiezen voor Rotterdam (natuurlijk verloop en een formatieplafond, inclusief inhuur), over ambtsreizen en over inhuur voor inzameling en reiniging. In 2026 komen verder het IT-project GREAT, het beleidsplan ambtelijke integriteit 2026–2030, de moties over menselijk contact en een vaste contactpersoon bij ingewikkelde hulpvragen, en een streefcijfer voor tevredenheid over de dienstverlening aan de orde."}, "15": {"id": 15, "kern": "In de fragmenten gaat het bij dit thema vooral over het gebruik van algoritmen door de gemeente bij fraudebestrijding en risicoprofilering, met als kernvragen of dat eerlijk, uitlegbaar en vrij van discriminatie gebeurt. Terugkerend zijn SyRI, het Rekenkamerrapport Gekleurde technologie, het algoritmeregister en het afwegingskader, en later de politiek-bestuurlijke kaders voor algoritmen. Vanaf 2024 komt er meer aandacht voor AI in brede zin: het Civic AI-Lab, het gebruik van AI-tools door ambtenaren en het initiatief voor een Rotterdam AI-zone. Fracties benadrukken dat algoritmen kansen bieden, maar dat transparantie, toezicht en bescherming tegen ongelijke behandeling nodig zijn.", "ontwikkeling": [{"periode": "2019", "wat": "De raad debatteert over het risicoprofileringssysteem SyRI en een instrument voor huisbezoeken in Bloemhof en Hillesluis, en het college zegt open te staan voor werkbare en proportionele toepassingen maar stopt met de plannen."}, {"periode": "2021", "wat": "Na het Rekenkamerrapport Gekleurde technologie dienen fracties moties in over algoritmen bij Werk en Inkomen, en het college kondigt een transparanter algoritme en een openbaar algoritmeregister aan."}, {"periode": "2022", "wat": "De raad bespreekt het afwegingskader voor sensoren, datatoepassingen en AI, waarbij een algoritmeregister en een adviesorgaan worden genoemd."}, {"periode": "2023–2024", "wat": "Het college staakt de poging om een nieuw algoritme voor fraudeaanpak te maken, en na het vervolgonderzoek van de Rekenkamer (Kleur bekennen) vragen fracties om een politiek-bestuurlijke afweging over algoritmen."}, {"periode": "2025", "wat": "De raad behandelt het politiek-bestuurlijk waardenkader voor algoritmen en later de geactualiseerde algoritme-governance, mede met vragen over het gebruik van AI-tools door ambtenaren."}], "standpunten": [{"wie": "SP", "punt": "De SP is in de fragmenten niet tegen algoritmen als zodanig, maar stelt dat de gemeente niet klaar is om ze op burgers toe te passen en wil dat discriminerende algoritmen worden stopgezet."}, {"wie": "GroenLinks", "punt": "GroenLinks had twijfels bij SyRI, vond in 2021 dat eerlijkheid en uitlegbaarheid niet gegarandeerd waren en miste in 2024 een politiek-bestuurlijke afweging over het gebruik van algoritmen."}, {"wie": "D66", "punt": "D66 is niet tegen algoritmen maar wil toezicht en geen discriminatie, en steunt tegelijk een bredere inzet van AI in de stad, met terughoudendheid bij toepassingen waarvan de risico's nog onbekend zijn."}, {"wie": "VVD", "punt": "De VVD ziet in de fragmenten vooral kansen en efficiëntie in algoritmen en AI, met aandacht voor de schaduwzijde en voor evaluatie."}, {"wie": "Leefbaar Rotterdam", "punt": "Leefbaar Rotterdam stelt dat algoritmen effectief kunnen werken als ze goed worden toegepast, en maakte zich zorgen dat fraudebestrijding en risicoprofilering moeilijk worden."}, {"wie": "Volt", "punt": "Volt ziet grote kansen voor dienstverlening, vraagt om verantwoord gebruik en wees in 2025 op risico's voor privacy en dataeigenaarschap bij het werken met apps als ChatGPT door ambtenaren."}], "recent": "In 2026 bespreekt de raad het initiatiefvoorstel van D66 voor een Rotterdam AI-zone, waarbij het college het voorstel kan omarmen maar benadrukt dat er geen budget is en dat eerst een inventarisatie volgt. In oktober 2026 vraagt de SP bij de Discriminatiemonitor of algoritmen Rotterdammers discrimineren, en de wethouders zeggen schriftelijk terug te komen op de vraag."}, "16": {"id": 16, "kern": "In de fragmenten gaat het bij dit thema vooral over de balans tussen privacy en het delen of gebruiken van gegevens, waarbij de AVG afwisselend wordt genoemd als noodzakelijke bescherming en als belemmering. Terugkerende kwesties zijn gegevensuitwisseling in zorg, veiligheid en fraudebestrijding, cameratoezicht en bodycams, het gebruik van eigen gegevens voor datagedreven werken, en privacy in de opvang. Wethouders verwijzen ook regelmatig naar privacy als reden om bepaalde gegevens niet te kunnen delen of verzamelen. De burgemeester pleit meermaals voor aanpassing van de privacywetgeving.", "ontwikkeling": [{"periode": "2018", "wat": "Privacy speelt bij het leerlingenvervoer van Trevvel, bij de nieuwe AVG en bij de uitbreiding van bodycams."}, {"periode": "2019", "wat": "Bij SyRI en datagedreven fraudebestrijding gaat het om de AVG, om informatiedeling tussen partijen en om het gebruik van eigen gegevens; ook bodycams voor handhavers komen terug."}, {"periode": "2020–2021", "wat": "Bij de toeslagenaffaire kan de gemeente door privacyregels gedupeerde ouders niet proactief benaderen of gegevens koppelen, en de Partij voor de Dieren vraagt om een plan om aan de AVG te voldoen."}, {"periode": "2023", "wat": "Een boete van de Autoriteit Persoonsgegevens voor camera-auto's in de coronatijd leidt tot debat over cameratoezicht, en de burgemeester vraagt om herschrijving van de privacywetgeving."}, {"periode": "2024–2025", "wat": "Er is discussie over de AVG bij Wijk aan zet, over preventief fouilleren als aantasting van de privacy en over de AVG als reden om geen gegevens over bewindvoerders te publiceren."}], "standpunten": [{"wie": "Partij voor de Dieren", "punt": "De fractie benadrukt meermaals dat de privacy van burgers beschermd moet worden, onder meer bij de AVG-naleving van de gemeente, camera-auto's, preventief fouilleren en cameratoezicht."}, {"wie": "BIJ1", "punt": "BIJ1 wijst op privacyrisico's van biometrische technologie en van camera-auto's die zonder voorafgaande risico-inventarisatie zijn ingezet, en diende een motie in om cameratoezicht aan banden te leggen."}, {"wie": "Forum voor Democratie", "punt": "Forum voor Democratie vindt dat privacy te allen tijde beschermd moet worden, wil verregaande AI-toepassingen mijden als privacy in het geding komt en wijst op privacyrisico's bij de NIS2-eisen."}, {"wie": "VVD", "punt": "De VVD zoekt bij bodycams naar een balans met privacy en steunt de lijn van de burgemeester dat de AVG zo moet worden aangepast dat privacy het delen van informatie niet in de weg staat."}, {"wie": "Leefbaar Rotterdam", "punt": "Leefbaar Rotterdam vindt dat privacy beschermd moet worden maar geen belemmering mag zijn, onder meer bij de overdracht van klantgegevens in het leerlingenvervoer."}, {"wie": "Ahmed Aboutaleb (burgemeester)", "punt": "De burgemeester vindt dat de privacywetgeving in de uitwerking criminelen beschermt en hulpverlening hindert, en pleit meermaals voor aanpassing ervan, terwijl hij ook oog heeft voor proportionaliteit en voor de privacy van medewerkers."}], "recent": "In 2025 gaat het onder meer over de AVG als argument in de discussie over actieve controle op bewindvoerders, waarbij de wethouder zegt hiervoor geen wettelijke grondslag te hebben en de PvdA het AVG-argument te groot vindt. In 2026 komt privacy terug bij een onderzoek over het Fotomuseum, bij vragen over een flyer op basisscholen met gegevensverzameling en in moties over digitale soevereiniteit en privacy-by-design."}, "17": {"id": 17, "kern": "In de fragmenten gaat het bij dit thema om uiteenlopende digitaliseringsonderwerpen: ICT-systemen en grote ICT-projecten, de digitaliseringsagenda van de gemeente, digitale meningspeilingen, digitale vaardigheden en digitale inclusie, en cyberveiligheid. Tijdens corona komen digitale vergaderingen en bijeenkomsten veelvuldig terug. Terugkerende kwesties zijn wie politiek verantwoordelijk is voor digitalisering, het bereik van mensen die niet makkelijk meekomen, en het behoud van fysieke en telefonische dienstverlening. Later komen ook digitale onafhankelijkheid en het mislukte ICT-project GREAT aan bod.", "ontwikkeling": [{"periode": "2018–2019", "wat": "De raad bespreekt ICT-risico's bij software voor de RET, digitale meningspeilingen en de digitaliseringsagenda samen met concernhuisvesting, waarvan de invulling in de begroting nog uitgewerkt moest worden."}, {"periode": "2020–2021", "wat": "Door corona gaat de gemeente digitaal vergaderen en bijeenkomsten organiseren, met kritiek van bewoners bij een digitale bijeenkomst over windturbines in Pernis, en digitale vaardigheden en digitale armoede komen in beeld."}, {"periode": "2022–2023", "wat": "Volt vraagt om digitalisering bij één wethouder onder te brengen en om een integrale digitaliseringsagenda, en er is aandacht voor cyberveiligheid, digitale meningspeilingen over vuurwerk en de informatiehuishouding."}, {"periode": "2024", "wat": "Het Programmaplan Digitale Inclusie wordt besproken, met een Civic AI-Lab, digitale toegankelijkheid van websites en het blijven aanbieden van offline dienstverlening."}, {"periode": "2025–2026", "wat": "Amendementen voor meer geld voor cyberweerbaarheid, het initiatiefvoorstel Rotterdam digitaal onafhankelijk en het debat over het ICT-project GREAT (Oracle) staan op de agenda."}], "standpunten": [{"wie": "Volt", "punt": "Volt wil dat digitalisering zoveel mogelijk bij één wethouder wordt belegd en vraagt in moties om een overzicht van programma's rond digitalisering en om verbinding met de digitale stad."}, {"wie": "GroenLinks", "punt": "Marvin Biljoen (GroenLinks, in 2026 als PRO genoemd) wijst op de afhankelijkheid van een handjevol grote technologiebedrijven, diende het initiatiefvoorstel Rotterdam digitaal onafhankelijk in en vroeg bij het ICT-project GREAT om actieve informatie aan de raad."}, {"wie": "DENK", "punt": "DENK ondersteunt het dichten van de digitale kloof en het digitaal vaardig maken van Rotterdammers, onder meer via het plan Digitale Inclusie."}, {"wie": "Forum voor Democratie", "punt": "Forum voor Democratie vraagt om alternatieven voor mensen die digitaal achterblijven, om offline dienstverlening en om meer aandacht voor cyberveiligheid en de gevaren van de digitale wereld."}, {"wie": "CDA", "punt": "Het CDA vraagt meermaals aandacht voor cyberveiligheid en diende in 2025 amendementen in voor meer geld voor digitale veiligheid."}, {"wie": "Leefbaar Rotterdam", "punt": "Leefbaar Rotterdam vindt dat offline en telefonische dienstverlening naast digitale kanalen beschikbaar moet blijven, onder meer in een motie met de ChristenUnie in 2026."}], "recent": "In 2025 bespreekt de raad amendementen over meer geld voor cyberweerbaarheid, die het college ontraadt omdat er volgens het college al middelen voor zijn. In 2026 staan het initiatiefvoorstel Rotterdam digitaal onafhankelijk en het debat over het ICT-project GREAT (Oracle) centraal, waarbij moties vragen om transparantie over kosten en om aandacht voor digitale soevereiniteit, privacy en open standaarden."}, "18": {"id": 18, "kern": "Bij dit thema gaat het in de raad vooral over de wijkraden en het stelsel 'Wijk aan Zet', en over de manier waarop bewoners worden betrokken bij bouw-, verkeers- en energieprojecten. Ook komen instrumenten als het referendum, de digitale meningspeiling en het burgerberaad terug. Terugkerende kwesties zijn of participatie echt invloed heeft, wie de regie heeft (college, raad of wijkraad), hoe duidelijk vooraf is wat bewoners kunnen verwachten, en of aanvullende moties nodig zijn of al worden uitgevoerd. Het college noemt moties over participatie in de fragmenten vaker overbodig omdat het beleid al bestaat.", "ontwikkeling": [{"periode": "2018", "wat": "De raad bespreekt het referendum (onder meer de opkomstdrempel en de voorzitter van de referendumcommissie), de installatie van nieuwe wijkraden en comités, en participatie bij bestemmingsplannen en de herinrichting van De Evenaar."}, {"periode": "2019–2020", "wat": "Bewonersparticipatie geldt volgens het college als norm bij de inrichting van de buitenruimte; er is discussie over de rol van wijkraden en gebiedscommissies, de participatie in het Nationaal Programma Rotterdam Zuid, de verdeling van budgetten van bestuurscommissies en het vergaderen in coronatijd."}, {"periode": "2021–2022", "wat": "Wijk aan Zet krijgt vorm met gekozen wijkraden, een verordening en veel moties; daarnaast gaat het over participatie bij windturbines in Pernis en over het participatietraject rond de luchthaven en de MIRT-verkenning."}, {"periode": "2023–2024", "wat": "De raad bespreekt het participatiebeleid voor de Omgevingswet, de startnotitie voor het Rotterdams Burgerberaad Klimaat, de voortgang van Wijk aan Zet en de rol van wijkraden bij onder meer horecabeleid, het verkeerscirculatieplan en Heijplaat."}, {"periode": "2025–2026", "wat": "Er volgen een evaluatie van het burgerberaad, verbeterlijnen voor Wijk aan Zet na evaluatie, een wijziging van de verordening voor wijkraden en een gewijzigde verordening over inspraak en digitale meningspeiling."}], "standpunten": [{"wie": "Leefbaar Rotterdam", "punt": "In de fragmenten gaat het om een grote rol voor wijkraden en om het referendum als aanvulling op de representatieve democratie; wethouder Simons wil niets 'van bovenaf' aan wijkraden opleggen en wil de participatieregels juist simpeler houden."}, {"wie": "VVD", "punt": "Zegt in 2021 geen groot voorstander van wijkraden te zijn maar de verordening te willen verbeteren, en benadrukt in 2024 dat het 'Wijk aan Zet' is en niet 'wijkraad aan zet', vanuit wat de bewoner het meest helpt."}, {"wie": "GroenLinks", "punt": "Wil het referendum in 2018 niet afschaffen en de opkomstdrempel schrappen; wil in 2022 op de hoogte worden gehouden van de participatie rond MIRT."}, {"wie": "CDA", "punt": "Ziet in 2018 het referendum vooral tot teleurstelling leiden bij lage opkomst en geeft de voorkeur aan een digitale meningspeiling die meer nuance mogelijk maakt."}, {"wie": "PvdA", "punt": "Wil dat inspraak en participatie er voor alle Rotterdammers zijn (2018) en vraagt in 2026 om een nulmeting voordat de verordening wordt geëvalueerd."}, {"wie": "D66 (wethouder Zeegers)", "punt": "Zet in op het burgerberaad met loting en betrokkenheid van wijkraden, en benadrukt dat participatie met duidelijke verwachtingen aan de voorkant moet beginnen."}], "recent": "In 2025 en 2026 gaat het over de evaluatie van Wijk aan Zet en de nieuwe verordeningen voor wijkraden en inspraak; wethouder Simons wil de nieuwe inspraakverordening pas over twee jaar evalueren. Ook wordt in 2026 gesproken over participatie bij concrete projecten, zoals de bewoners van Zuid, een AZC bij Lombardijen en de Rosestraat."}, "19": {"id": 19, "kern": "In de raad gaat dit thema vooral over het tegengaan van discriminatie en racisme, onder meer op de arbeidsmarkt, de woningmarkt, bij stages, in het nachtleven en bij de politie. Daarnaast komen inclusie en diversiteit terug, zoals de aandacht voor LHBTQIA+, culturele en religieuze diversiteit, digitale inclusie en fysieke toegankelijkheid. Terugkerende kwesties zijn de monitor en het aantal meldingen, de vraag of er meer geld of vooral betere plannen nodig zijn, het uitsluiten van bedrijven die discriminatie plegen en of een algemene of een gerichte aanpak per groep beter is. Veel moties worden door het college als overbodig ontraden omdat het al bezig zou zijn.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Moties over het uitsluiten van discriminerende bedrijven, discriminatie op de woningmarkt en stagediscriminatie staan op de agenda, evenals het actieprogramma Integratie en Samenleven 'Relax. Dit is Rotterdam' met aandacht voor LHBTI en religieuze diversiteit."}, {"periode": "2020–2021", "wat": "Na de Black Lives Matter-demonstraties volgen een antiracisme-initiatiefvoorstel, een gezamenlijk plan van meerdere fracties en extra middelen; ook wordt in 2021 gesproken over een onderzoek naar racistische appconversaties bij de politie."}, {"periode": "2022–2023", "wat": "Het debat gaat onder meer over Zwarte Piet, haat tegen LHBTQIA+ in de voetbalwereld, discriminatie op de woningmarkt met een meldpunt en het actieplan Samenleven in één stad 2024–2027, dat is opgesteld met stadsgesprekken."}, {"periode": "2024", "wat": "Er is aandacht voor het LHBTQIA+-beleid, het programmaplan Digitale Inclusie en de toegankelijkheid van gemeentelijke websites."}, {"periode": "2025", "wat": "De discriminatiemonitor, het Panel Deurbeleid in het nachtleven, stagediscriminatie en het budget voor Samenleven na 2026 zijn onderwerp van debat."}], "standpunten": [{"wie": "DENK", "punt": "Pleit al vanaf 2018 voor een stevige aanpak met onder meer een racismeregister, en wijst in 2025 en 2026 erop dat meldingen toenemen en vraagt wat er met die stijging gebeurt."}, {"wie": "NIDA", "punt": "Vindt in 2018 en 2019 dat er te weinig specifieke aanpak is voor racisme en moslimdiscriminatie en dat beleid te weinig in daden wordt omgezet."}, {"wie": "VVD (wethouder Wijbenga)", "punt": "Kiest in de fragmenten voor gelijkwaardigheid en een aanpak zonder doelgroepenbeleid per groep, en noemt het werken aan 'relaxt omgaan met diversiteit' hard werk."}, {"wie": "D66", "punt": "Stelt in 2018 dat goede plannen belangrijker zijn dan meer geld, en ontraadt in 2018 automatische uitsluiting voor vijf jaar vanwege juridische bezwaren."}, {"wie": "GroenLinks", "punt": "Wil vooroplopen in de strijd tegen racisme en discriminatie en dient later moties in, bijvoorbeeld over discriminatie op sportvelden."}, {"wie": "BIJ1", "punt": "Vraagt in 2024 om structurele, veilige ontmoetingsplekken voor LHBTQIA+ en pleit in 2026 voor specifieke aanpakken per vorm van discriminatie."}], "recent": "In 2025 en 2026 worden de discriminatiemonitoren besproken, met moties over onder meer deurbeleid in de horeca, een racismeregister en moslimdiscriminatie. Verder speelt het einde van het actieplan Samenleven in 2027 en de acceptatie van homoseksualiteit onder jongeren; fragmenten uit 2026 zijn deels automatische ondertiteling."}, "20": {"id": 20, "kern": "In de raad gaat dit thema over de integriteit van ambtenaren en bestuurders, over meldingen en bescherming van melders, en over de vraag hoeveel openheid er richting de raad en de stad moet zijn. Terugkerende kwesties zijn geheimhouding van collegestukken of onderhandelingen, het risico op lekken, integriteitskwesties die in de media komen en het informeren van de raad over kosten en risico's bij projecten. Ook komen Woo-verzoeken, subsidies en het gebruik van algoritmen terug. De bestuurlijke integriteit hoort volgens de fragmenten bij de burgemeester en de ambtelijke integriteit bij een wethouder.", "ontwikkeling": [{"periode": "2018–2019", "wat": "Er is aandacht voor integriteit bij ambtenaren (ambtseed, protocol), transparantie over risico's en kosten van grote projecten, en in 2019 voor geheimhouding, lekken en het ontslag van een wethouder, onder meer rond het Schiekadeblok."}, {"periode": "2020–2021", "wat": "De raad bespreekt de integriteitskwestie bij Stadsbeheer, een onveilig werkklimaat, de klokkenluidersregeling, het beleidsplan Ambtelijke integriteit en geheimhouding van stukken zoals taxatierapporten."}, {"periode": "2022", "wat": "Er is discussie over geheimhouding bij het participatietraject rond de luchthaven en bij het Warmtebedrijf, waarbij het college 'openbaar waar het kan' noemt."}, {"periode": "2023–2024", "wat": "Na het debat over de bestuurscultuur komen moties over het zesogenprincipe, het beschermen van klokkenluiders en het informeren van de raad; in 2024 volgt een Rekenkamerrapport over ambtelijke integriteit en een integriteitsmeldpunt voor raadsleden."}, {"periode": "2025–2026", "wat": "Het gaat onder meer over een initiatiefvoorstel over lobbyen, het onderzoek 'EBBEN' naar mogelijke subsidiefraude, de transparantie van ICT-projecten en een nieuw beleidsplan ambtelijke integriteit 2026–2030."}], "standpunten": [{"wie": "Burgemeester Aboutaleb", "punt": "Is verantwoordelijk voor de bestuurlijke integriteit en wijst op geheimhouding van gesprekken als voorwaarde voor het stelsel; informeert de raad pas bij een geconstateerde schending."}, {"wie": "D66 (wethouder Van Gils)", "punt": "Wil 'in het licht doen wat in het licht kan', wijst op bestaande meldmogelijkheden en de klokkenluidersregeling, en onderzoekt in 2020 de hele integriteitsketen."}, {"wie": "VVD (wethouders)", "punt": "Noemt geheimhouding van collegeberaadslagingen en soms van onderhandelingen functioneel, en wil transparantie wanneer het stuk klaar is voor de raad."}, {"wie": "Leefbaar Rotterdam (wethouders)", "punt": "Handelt integriteitsonderzoeken in vertrouwen af en vindt zorgvuldigheid dan belangrijker dan openbaarheid; reageert terughoudend op nieuwe voorstellen zoals het lobbyinitiatief."}, {"wie": "GroenLinks", "punt": "Dient in 2023 moties in over het zesogenprincipe, klokkenluiders en informatie over integriteitszaken en vraagt in 2026 aandacht voor een veilige meldcultuur en de ombudsman."}, {"wie": "Partij voor de Dieren", "punt": "Wil zoveel mogelijk openbaar en pas daarna geheimhouding, en dient voorstellen in over onder meer een afkoelingsperiode, een integriteitsmeldpunt voor raadsleden en lobbyen."}], "recent": "In 2026 wordt het beleidsplan ambtelijke integriteit 2026–2030 besproken, met vragen over werkdruk, trainingen en lekken naar de media. Daarnaast gaat het over het onderzoek naar mogelijke subsidiefraude (EBBEN) en de moties over transparantie in gemeentelijke geldstromen, over meldingen van integriteit in Carnisse en over de kosten van een ICT-project."}, "21": {"id": 21, "kern": "In de fragmenten gaat dit thema over aanbestedingen en inkoop van de gemeente (onder meer vervoer, welzijn, zorg, windparken en ICT) en over subsidies aan organisaties in de stad. Meermaals komt de vraag terug of en hoe organisaties die discrimineren van inkoop of subsidie kunnen worden uitgesloten, waarbij het college wijst op wettelijke eisen zoals proportionaliteit. Ook terugkerend zijn de controle en verantwoording van subsidies en opdrachten, en de vraag hoe sturing op kwaliteit, bewonersinbreng en maatschappelijke doelen in contracten en subsidieregels kan worden vormgegeven. Aanbestedingen in het sociaal domein, zoals het doelgroepenvervoer, leiden in de fragmenten herhaaldelijk tot discussie over vertraging, contractafspraken en wat achteraf nog kan worden aangepast.", "ontwikkeling": [{"periode": "2018–2019", "wat": "De raad bespreekt subsidiestromen rond het Sinterklaasfeest, de uitsluiting van bedrijven die door de rechter zijn veroordeeld voor discriminatie, de aanbesteding van het vervoer (Trevvel) en het falen van de aanbesteding van het mantelzorgsteunpunt."}, {"periode": "2019", "wat": "Bij de vijfde wijziging van de Subsidieverordening gaat het over controle op topinkomens (WNT) en over een motie om geen discriminerende organisaties te subsidiëren."}, {"periode": "2020–2021", "wat": "Het college legt de kadernotitie Inkoopstrategieën voor het sociaal domein voor, met discussie over open house, sancties bij disfunctioneren en de rol van bewoners, en over mkb-vriendelijk aanbesteden en de integriteit van opdrachtnemers."}, {"periode": "2022–2023", "wat": "Aan de orde komen het eisen van een minimumuurloon bij aanbestedingen, duurzaamheid als criterium bij subsidies, de aanbesteding van windparken en het nieuwe subsidiekader voor welzijn en samenleven met een plafond per instelling."}, {"periode": "2024–2025", "wat": "De raad bespreekt de duur en monitoring van subsidieregelingen, het stopzetten van subsidie aan vrijwilligersorganisaties, de vertraagde aanbesteding van het doelgroepenvervoer en de verantwoording bij het faillissement van Dona Daria."}], "standpunten": [{"wie": "College van B en W (wethouders in verschillende jaren)", "punt": "Het college wijst meermaals motie-voorstellen af om uitsluiting van discriminerende partijen vast te leggen, omdat het inkoop- en subsidiebeleid dit volgens hen al mogelijk maakt en generieke eisen aan de wettelijke proportionaliteit moeten voldoen."}, {"wie": "DENK", "punt": "DENK wil dat de gemeente geen organisaties subsidieert die zich schuldig maken aan discriminatie en diende daarover in 2019 een motie in."}, {"wie": "Volt", "punt": "Volt vraagt in 2022 herhaaldelijk of het college via subsidieverordening en inkoopbeleid doelen als duurzaamheid en innovatie extra kan stimuleren."}, {"wie": "S. de Langen (CDA, wethouder)", "punt": "De Langen kiest in 2021 voor aanbesteden met de SAS-procedure, gecombineerd met een rol voor bewoners, en ontraadt de motie om open house te gebruiken."}, {"wie": "Faouzi Achbar (DENK, wethouder)", "punt": "Achbar verdedigt in 2023–2025 het subsidiekader met een plafond en meerjarige regelingen, wil effecten monitoren en benadrukt dat opdrachten en subsidies per stuk worden verantwoord."}, {"wie": "Carola Schouten (burgemeester)", "punt": "In 2026 omarmt de burgemeester de motie om subsidiestromen transparant te maken, met de kanttekening dat niet alle geldstromen, zoals budgetten voor lokale initiatieven, technisch subsidies zijn."}], "recent": "In 2025 gaat het onder meer over de verantwoording van opdrachten en subsidies na het faillissement van Dona Daria, het doelgroepenvervoer met een overbruggingsaanbesteding en een motie over innovatief aanbesteden. In 2026 komen het onderzoek naar mogelijke subsidiefraude (EBBEN) en de vraag naar transparantie van geldstromen aan bod, en zegt een wethouder toe het inkoopbeleid met maatschappelijke criteria opnieuw te bekijken."}, "22": {"id": 22, "kern": "In de fragmenten draait dit thema vooral om rapporten van de Rekenkamer Rotterdam en de reactie van het college daarop, om evaluaties en monitors van beleid en om de rol van de ombudsman en de accountant. Terugkerende kwesties zijn welke aanbevelingen het college overneemt, wanneer en hoe beleid wordt geëvalueerd en of de raad de uitkomsten kan zien. Ook gaat het meermaals over monitoring van concrete onderwerpen, zoals vervoer (Trevvel), parkeren, verkeersexperimenten, grote projecten en armoede. Daarnaast komen integriteit, meldmogelijkheden voor medewerkers en de controle op jaarstukken en kengetallen terug.", "ontwikkeling": [{"periode": "2018", "wat": "Rekenkamerrapporten over onder meer wijkteams, opvang van daklozen en 'Werken onder druk' worden besproken, en bij de beg
