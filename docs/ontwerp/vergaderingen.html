<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vergaderingen · raadzoeker</title>
<link rel="stylesheet" href="stijl.css?v=19">
<style>
.kolom{max-width:1120px;margin:0 auto}
.sub2{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:4px;background:var(--groen);color:#fff}
.apl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.apl span{font-size:12px;background:var(--grijs);border-radius:4px;padding:2px 7px}
h2.sec{font-size:21px;margin:28px 0 10px}
/* bovenkant: laatste raad + komt eraan */
.top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:14px}
.hero{background:var(--wit);border-radius:var(--r);padding:20px 24px;border-top:5px solid var(--groen)}
.hero h2{margin:6px 0 8px;font-size:24px}.hero p{font-size:17px;line-height:1.6;margin:0 0 10px;max-width:70ch}
.komt{background:var(--wit);border-radius:var(--r);padding:16px 18px;border-top:5px solid var(--blauw)}
.komt h2{margin:0 0 6px;font-size:19px}
.komt details{border-top:1px solid var(--grijs2);padding:7px 0;font-size:14px}.komt summary{cursor:pointer;list-style:none}.komt summary::-webkit-details-marker{display:none}
.komt summary b{font-size:15px}.komt summary .pt{display:block;color:var(--sub);margin-top:2px}
.komt summary::after{content:'▾';float:right;color:var(--sub)}.komt details[open] summary::after{content:'▴'}
.vp{padding:6px 0 4px 10px;border-left:3px solid var(--grijs2);margin:6px 0}.vp .e{font-size:12px;color:var(--sub)}
.vp .ch a{font-size:12px;background:var(--groen-zacht);border-radius:999px;padding:1px 8px;margin-right:4px;text-decoration:none;color:var(--zwart)}
/* per commissie */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.col{background:var(--wit);border-radius:var(--r);padding:14px 16px;border-top:4px solid var(--blauw)}.col h3{margin:0 0 4px;font-size:16px}
.col a{display:block;font-size:14px;padding:6px 0;border-top:1px solid var(--grijs2);text-decoration:none;color:inherit;line-height:1.4}.col a:hover{color:var(--groen)}
.col a span{color:var(--sub);font-size:12px;display:block}
/* archief per maand */
.mstrip{display:flex;gap:4px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--grijs);z-index:2}
.mstrip button{flex:none;border:1px solid var(--lijn);background:var(--wit);border-radius:999px;padding:5px 12px;font:14px var(--font);cursor:pointer;color:var(--zwart)}
.mstrip button[aria-pressed=true]{background:var(--groen);color:#fff;border-color:var(--groen);font-weight:700}
.mstrip button i{font-style:normal;font-size:11px;opacity:.75;margin-left:4px}
.arch h3{font-size:16px;margin:18px 0 8px;color:var(--sub)}
.raadk{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.raadk a{display:block;background:var(--wit);border-radius:var(--r);padding:14px 16px;border-top:4px solid var(--groen);text-decoration:none;color:inherit}
.raadk a b{display:block;font-size:17px}.raadk a p{font-size:14px;margin:6px 0 0;line-height:1.45;color:var(--sub)}.raadk a:hover b{color:var(--groen)}
.crij{display:grid;grid-template-columns:110px 220px minmax(0,1fr) 16px;gap:2px 12px;align-items:baseline;background:var(--wit);padding:10px 14px;border-bottom:1px solid var(--grijs2);text-decoration:none;color:inherit;font-size:14px}
.crijen .crij:first-child{border-radius:var(--r) var(--r) 0 0}.crijen .crij:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:0}.crij:hover{background:var(--groen-zacht)}
.crij b{font-size:15px}
.wg{background:var(--wit);border-radius:var(--r);padding:4px 14px}.wg details{border-bottom:1px solid var(--grijs2);padding:8px 0}.wg details:last-child{border:0}
.wg summary{cursor:pointer;font-weight:700;font-size:15px}.wg summary span{font-weight:400;color:var(--sub);font-size:13px}
.wr{margin:10px 0 4px 4px;font-size:14px}.wr b{font-size:14px}.wr ul{margin:4px 0;padding-left:18px}.wr li{margin:3px 0;line-height:1.45}.wr li i{color:var(--sub);font-style:normal}
.leeg2{background:var(--wit);border-radius:var(--r);padding:14px 16px;color:var(--sub)}
@media (max-width:820px){.top{grid-template-columns:minmax(0,1fr)}.hero{padding:16px 18px}.hero h2{font-size:21px}.hero p{font-size:16px}}
@media (max-width:700px){.cols{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.col{flex:0 0 82%;scroll-snap-align:start}.crij{grid-template-columns:minmax(0,1fr) 14px}.crij .d,.crij .o{grid-column:1}}
</style></head><body>
<header class="balk"></header>
<main class="pagina"><div class="kolom">
  <h1 style="margin-bottom:4px">Vergaderingen</h1>
  <p class="intro" style="max-width:72ch;margin:0">Wat er in de gemeenteraad en de raadscommissies is besproken, kort samengevat met per fractie wat ze zei en een link naar dat moment in de video. Van de wijkraden de besluiten.</p>
  <div class="top"><section class="hero" id="hero" aria-label="Laatste raadsvergadering"><p class="leeg">Laden…</p></section>
    <section class="komt" id="komt" aria-labelledby="hk" hidden><h2 id="hk">Komt eraan</h2><p class="sub2" style="margin:0 0 4px">Op de agenda, met wanneer het eerder besproken is.</p><div id="klijst"></div></section></div>
  <h2 class="sec" id="hc">Per commissie</h2><div class="cols" id="cols"></div>
  <h2 class="sec" id="ha">Archief</h2>
  <div class="mstrip" id="mstrip" role="group" aria-label="Maand"></div>
  <div class="arch" id="arch"></div>
</div></main>
<script src="ontwerp.js?v=37"></script>
<script>
kop('vergaderingen');
const MAAND=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'],DAGL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const PROC=/^(commissieplanning|ingekomen stukken|rondvraag|opening|sluiting|mededelingen|vaststelling|procedure|agenda en spreektijd)/i;
const kortNaam=n=>n.replace(/^Commissie tot Onderzoek van de Rekening$/,'Rekeningcommissie').replace(/^Commissie /,'').replace(/ \(20\d\d ?- ?20\d\d\)/,'').replace(/,.*$/,'');
const dl=d=>{const t=new Date(d+'T12:00');return `${DAGL[t.getDay()]} ${t.getDate()} ${MAAND[t.getMonth()]}${d.slice(0,4)!==String(new Date().getFullYear())?' '+d.slice(0,4):''}`;};
const dk=d=>`${+d.slice(8)} ${MAAND[+d.slice(5,7)-1].slice(0,3)}`;
const onderwerpen=(x,n)=>(x.ap||[]).filter(t=>!PROC.test(t)).slice(0,n);
const DLINK=x=>(x.soort==='gebied'?'wijk.html?g=':'dossier.html?d=')+x.slug;
let R=[],W=[],VO=[],MAA=null;
function hero(){const raad=R.filter(x=>x.naam==='Gemeenteraad').sort((a,b)=>b.datum.localeCompare(a.datum))[0];if(!raad){$('hero').innerHTML='';return;}
  $('hero').innerHTML=`<span class="tag">Laatste raadsvergadering</span> <span class="sub2">${dl(raad.datum)}</span><h2>Wat besprak de raad?</h2><div id="hkort"><p>${esc(raad.kort)}</p></div>
    <div class="apl">${onderwerpen(raad,12).map(t=>`<span>${esc(t)}</span>`).join('')}</div><p style="margin:14px 0 0"><a class="knop" href="vergadering.html?id=${raad.id}">Lees in 1 minuut</a> <a href="vergadering.html?id=${raad.id}#uitgebreid" style="margin-left:10px;font-size:15px">of uitgebreid</a></p>`;
  // de hele korte samenvatting (in alinea's) uit het vergaderbestand
  fetch('verg/'+raad.id+'.json').then(r=>r.json()).then(v=>{const al=[];v.kort.forEach(z=>(al[z.alinea||0]=al[z.alinea||0]||[]).push(esc(z.zin)));$('hkort').innerHTML=al.filter(Boolean).map(a=>`<p>${a.join(' ')}</p>`).join('');}).catch(()=>{});}
function komt(){const vandaag=new Date().toISOString().slice(0,10),L=VO.filter(x=>x.datum>=vandaag);if(!L.length)return;
  $('klijst').innerHTML=L.map((v,i)=>`<details><summary><b>${esc(v.naam.startsWith('Gemeenteraad')?'Gemeenteraad':kortNaam(v.naam))}</b> <span class="sub2">${dl(v.datum)}</span><span class="pt">${v.punten.length?v.punten.slice(0,3).map(p=>esc(p.titel)).join(' · ')+(v.punten.length>3?' …':''):'agenda volgt'}</span></summary>
    ${v.punten.map(p=>`<div class="vp">${esc(p.titel)}${p.dossiers.length?`<div class="ch">${p.dossiers.map(x=>`<a href="${DLINK(x)}">${esc(x.naam)}</a>`).join('')}</div>`:''}${p.eerder.length?`<div class="e">Eerder: ${p.eerder.map(e=>{const t=`${dk(e[0])} ${esc(e[1].startsWith('Gemeenteraad')?'raad':kortNaam(e[1]))}`;return e[4]?`<a href="vergadering.html?id=${e[4]}#ap-${encodeURIComponent(e[2])}">${t}</a>`:e[5]?`<a href="https://gemeenteraad.rotterdam.nl/Agenda/Index/${e[5]}" target="_blank" rel="noopener">${t}</a>`:t;}).join(' · ')}</div>`:''}</div>`).join('')}
    <div class="vp" style="border:0"><a href="https://gemeenteraad.rotterdam.nl/Agenda/Index/${v.agendaId}" target="_blank" rel="noopener">Agenda en stukken in iBabs</a></div></details>`).join('');
  $('komt').hidden=false;}
function commissies(){const per={};R.filter(x=>!x.raad).sort((a,b)=>b.datum.localeCompare(a.datum)).forEach(x=>{const k=kortNaam(x.naam);(per[k]=per[k]||[]).push(x);});
  const ks=Object.keys(per).sort((a,b)=>per[b][0].datum.localeCompare(per[a][0].datum)).slice(0,8).sort();
  $('cols').innerHTML=ks.map(k=>`<div class="col"><h3>${esc(k)}</h3>${per[k].slice(0,3).map(x=>`<a href="vergadering.html?id=${x.id}"><span>${dl(x.datum)}</span>${onderwerpen(x,2).map(esc).join(' · ')||esc(x.kort.slice(0,90))}</a>`).join('')}</div>`).join('');}
function maanden(){const M=new Set([...R,...W].map(x=>x.datum.slice(0,7)));return [...M].sort().reverse();}
function archief(){const ms=maanden(),m=MAA||ms[0],[y,mm]=m.split('-').map(Number);
  const r=R.filter(x=>x.datum.startsWith(m)),raad=r.filter(x=>x.raad).sort((a,b)=>b.datum.localeCompare(a.datum)),com=r.filter(x=>!x.raad).sort((a,b)=>b.datum.localeCompare(a.datum)),w=W.filter(x=>x.datum.startsWith(m));
  const perG={};w.forEach(x=>(x.gebied.length?x.gebied:['Overig']).forEach(g=>(perG[g]=perG[g]||[]).push(x)));
  $('mstrip').innerHTML=ms.map(k=>{const [a,b]=k.split('-');const n=R.filter(x=>x.datum.startsWith(k)).length;return `<button type="button" data-m="${k}" aria-pressed="${k===m}">${MAAND[+b-1].slice(0,3)} ${a.slice(2)}${n?`<i>${n}</i>`:''}</button>`;}).join('');
  $('arch').innerHTML=`<h2 style="margin:8px 0 0;font-size:20px">${MAAND[mm-1]} ${y}</h2><p class="sub2" style="margin:2px 0 0">${[raad.length&&`${raad.length} ${raad.length===1?'raadsvergadering':'raadsvergaderingen'}`,com.length&&`${com.length} commissievergaderingen`,w.length&&`${w.length} wijkraadvergaderingen`].filter(Boolean).join(' · ')}</p>
    ${raad.length?`<h3>Gemeenteraad</h3><div class="raadk">${raad.map(x=>`<a href="vergadering.html?id=${x.id}"><span class="sub2">${dl(x.datum)}</span><b>${esc(x.naam)}</b><div class="apl">${onderwerpen(x,8).map(t=>`<span>${esc(t)}</span>`).join('')}</div><p>${esc(x.kort)}</p></a>`).join('')}</div>`:''}
    ${com.length?`<h3>Commissies</h3><div class="crijen">${com.map(x=>`<a class="crij" href="vergadering.html?id=${x.id}"><span class="d sub2">${dl(x.datum)}</span><b>${esc(kortNaam(x.naam))}</b><span class="o">${onderwerpen(x,4).map(esc).join(' · ')||esc(x.kort.slice(0,100))}</span><span aria-hidden="true">→</span></a>`).join('')}</div>`:''}
    ${!raad.length&&!com.length?`<h3>Raad en commissies</h3><p class="leeg2">Van deze maand zijn de vergaderingen van raad en commissies nog niet samengevat; dat gebeurt de komende weken. Zoek intussen in <a href="zoek.html">Zoeken</a>.</p>`:''}
    ${w.length?`<h3>Wijkraden <span class="sub2">besluiten, per gebied</span></h3><div class="wg">${Object.keys(perG).sort().map(g=>`<details><summary>${esc(g)} <span>· ${perG[g].length} ${perG[g].length===1?'vergadering':'vergaderingen'} · ${perG[g].reduce((a,x)=>a+x.p.length,0)} besluiten</span></summary>
      ${perG[g].sort((a,b)=>a.datum.localeCompare(b.datum)).map(x=>`<div class="wr"><b>${esc(x.raad)}</b> <span class="sub2">${dl(x.datum)}${x.agendaId?` · <a href="https://wijkraad.rotterdam.nl/Agenda/Index/${x.agendaId}" target="_blank" rel="noopener">stukken</a>`:''}</span>
        <ul>${x.p.map(([t,b])=>`<li>${esc(t)}<br><i>${esc(b)}</i></li>`).join('')}${x.init.length?`<li>Bewonersinitiatieven<br><i>${esc(x.init.join(' · '))}</i></li>`:''}</ul></div>`).join('')}</details>`).join('')}</div>
      <p class="sub2" style="margin-top:6px">Uit de besluitenlijsten van de wijkraden; namen van bewoners weggelaten.</p>`:''}`;
  $('mstrip').querySelectorAll('button').forEach(b=>b.onclick=()=>{MAA=b.dataset.m;try{history.replaceState(null,'','#'+MAA);}catch(e){}archief();});
  const sb=$('mstrip').querySelector('[aria-pressed=true]');if(sb)$('mstrip').scrollLeft=sb.offsetLeft-$('mstrip').clientWidth/2+sb.offsetWidth/2;}   // alleen de strook zelf, niet de pagina
if(/^#\d{4}-\d{2}$/.test(location.hash))MAA=location.hash.slice(1);
Promise.all([fetch('verg/index.json',{cache:'no-cache'}).then(r=>r.json()),fetch('verg/wijkraden.json').then(r=>r.ok?r.json():[]).catch(()=>[]),fetch('verg/vooruit.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>d.v).catch(()=>[])])
  .then(([a,b,c])=>{R=a;W=b;VO=c;hero();komt();commissies();archief();if(MAA)setTimeout(()=>$('ha').scrollIntoView(),50);});
</script></body></html>
