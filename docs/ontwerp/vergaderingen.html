<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Vergaderingen · raadzoeker</title>
<link rel="stylesheet" href="stijl.css?v=9">
<style>
.kolom{max-width:900px;margin:0 auto}
.week{margin-top:28px}.week h2{font-size:18px;color:var(--sub);margin:0 0 10px}
.vk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 18px;background:var(--wit);border-radius:var(--r);padding:16px 20px;margin-bottom:10px;text-decoration:none;color:inherit;border-left:5px solid var(--groen-mid)}
.vk.raad{border-left-color:var(--groen)}
.vk:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.vk .dag{font-weight:700;line-height:1.2}.vk .dag span{display:block;font-weight:400;color:var(--sub);font-size:14px}
.vk h3{margin:0 0 4px;font-size:18px}.vk p{margin:0;color:var(--sub);font-size:15px;line-height:1.5}
.vk .verder{font-size:14px;margin-top:6px;color:var(--groen);font-weight:700}
.vooruit{background:var(--wit);border-radius:var(--r);padding:18px 22px;margin-top:18px;border-top:5px solid var(--blauw,#0b5394)}
.vooruit h2{margin:0 0 4px;font-size:20px}.vooruit details{border-top:1px solid var(--grijs2);padding:8px 0}.vooruit summary{cursor:pointer;font-weight:700}
.vooruit summary .sub{font-weight:400}.vp{padding:6px 0 6px 14px;font-size:15px}.vp .e{font-size:13px;color:var(--sub)}.vp .ch a{font-size:12px;background:var(--groen-zacht);border-radius:999px;padding:1px 8px;margin-right:4px;text-decoration:none;color:var(--zwart)}
@media (max-width:600px){.vk{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<header class="balk"></header>
<main class="pagina"><div class="kolom">
  <h1>Vergaderingen</h1>
  <p class="intro" style="max-width:68ch">Wat er besproken is in de gemeenteraad en de raadscommissies, kort samengevat: in één minuut of uitgebreid, met per fractie wat ze zei en een link naar dat moment in de video.</p>
  <section class="vooruit" id="vooruit" hidden><h2>Komende vergaderingen</h2><p class="sub" style="margin:0 0 8px;font-size:14px">Wat er op de agenda staat, met wanneer het eerder besproken is.</p><div id="vlijst"></div></section>
  <div id="lijst"><p class="leeg">Laden…</p></div>
</div></main>
<script src="ontwerp.js?v=23"></script>
<script>
kop('vergaderingen');
const MAAND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'],DAG=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const week=d=>{const t=new Date(d+'T12:00');const j=new Date(t);j.setDate(t.getDate()-((t.getDay()+6)%7));return j.toISOString().slice(0,10);};
const MK=d=>{const t=new Date(d+'T12:00');return `${DAG[t.getDay()]} ${t.getDate()} ${MAAND[t.getMonth()]}`;};
fetch('verg/vooruit.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;const vandaag=new Date().toISOString().slice(0,10),L=d.v.filter(v=>v.datum>=vandaag);if(!L.length)return;
  $('vlijst').innerHTML=L.map((v,i)=>`<details${i<2?' open':''}><summary>${esc(v.naam)} <span class="sub">· ${MK(v.datum)} · ${v.punten.length?v.punten.length+' onderwerpen':'agenda volgt'}</span></summary>
    ${v.punten.map(p=>`<div class="vp">${esc(p.titel)}${p.dossiers.length?`<div class="ch">${p.dossiers.map(x=>`<a href="${x.soort==='gebied'?'wijk.html?g=':'dossier.html?d='}${x.slug}">${esc(x.naam)}</a>`).join('')}</div>`:''}
      ${p.eerder.length?`<div class="e">Eerder: ${p.eerder.map(e=>{const t=`${+e[0].slice(8)} ${MAAND[+e[0].slice(5,7)-1]}${e[0].slice(0,4)!==v.datum.slice(0,4)?' '+e[0].slice(0,4):''} ${esc(e[1])}`;return e[4]?`<a href="vergadering.html?id=${e[4]}#ap-${encodeURIComponent(e[2])}">${t}</a> (samenvatting)`:e[5]?`<a href="https://gemeenteraad.rotterdam.nl/Agenda/Index/${e[5]}" target="_blank" rel="noopener">${t}</a>`:t;}).join(' · ')}</div>`:''}</div>`).join('')}
    <div class="vp"><a href="https://gemeenteraad.rotterdam.nl/Agenda/Index/${v.agendaId}" target="_blank" rel="noopener">Agenda en stukken in iBabs</a></div></details>`).join('');
  $('vooruit').hidden=false;});
fetch('verg/index.json',{cache:'no-cache'}).then(r=>r.json()).then(L=>{
  const W={};L.forEach(x=>(W[week(x.datum)]=W[week(x.datum)]||[]).push(x));
  $('lijst').innerHTML=Object.keys(W).sort().reverse().map(w=>{const d=new Date(w+'T12:00'),e=new Date(d);e.setDate(d.getDate()+6);
    return `<section class="week"><h2>Week van ${d.getDate()} ${MAAND[d.getMonth()]} t/m ${e.getDate()} ${MAAND[e.getMonth()]} ${e.getFullYear()}</h2>${W[w].sort((a,b)=>a.datum.localeCompare(b.datum)).map(x=>{const t=new Date(x.datum+'T12:00');
      return `<a class="vk${x.raad?' raad':''}" href="vergadering.html?id=${x.id}"><div class="dag">${DAG[t.getDay()]}<span>${t.getDate()} ${MAAND[t.getMonth()]}</span></div><div><h3>${esc(x.naam)}</h3><p>${esc(x.kort)}</p><div class="verder">Lees in 1 minuut →</div></div></a>`;}).join('')}</section>`;}).join('')||'<p>Nog geen vergaderingen samengevat.</p>';
});
</script></body></html>
