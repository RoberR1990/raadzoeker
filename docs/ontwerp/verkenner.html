<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--doek:#0E171B;--paneel:rgba(19,30,35,.92);--tekst:#E8EEF0;--zacht:#9FB0B6}
html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;background:var(--doek);height:100dvh}
#graaf{flex:1;position:relative;min-height:0;background:radial-gradient(ellipse at 50% 45%,#16252B 0%,#0E171B 70%)}
#sg{position:absolute;inset:0}
.pnl{position:absolute;background:var(--paneel);color:var(--tekst);border-radius:12px;padding:14px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(6px);z-index:5}
.pnl a{color:#8FE0A0}.pnl .sub{color:var(--zacht)}
#filters{left:14px;top:14px;width:270px;max-height:calc(100% - 28px);overflow:auto}
#filters h1{font-size:20px;margin:0;color:#fff}
#filters label{display:block;font-size:12px;color:var(--zacht);margin:10px 0 3px}
#filters select,#filters input{width:100%;box-sizing:border-box;background:#0E171B;color:var(--tekst);border:1px solid #33454C;border-radius:8px;padding:7px 9px;font:14px var(--font)}
.rij2{display:flex;gap:6px}.rij2 select{flex:1}
.leg{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.leg button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2px 4px;border-radius:5px}
.leg button:hover,.leg button[aria-pressed="true"]{background:#22343B}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
#info{right:14px;top:14px;width:330px;max-height:calc(100% - 28px);overflow:auto;display:none}
#info h2{margin:2px 0 4px;font-size:22px;color:#fff}
#info .frag{background:#0E171B;border-radius:8px;padding:9px 11px;margin:8px 0;line-height:1.45;font-size:13.5px}
#info .frag mark{background:#2E5E3A;color:#fff}
.buren{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.buren button{all:unset;cursor:pointer;border:1px solid #33454C;border-radius:999px;padding:3px 9px;font-size:12.5px}
.buren button:hover{border-color:#8FE0A0}
.buren button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.kopje{margin-top:12px}.kopje span{font-size:12px}
.spoor{font-size:12.5px;color:var(--zacht);margin:0 22px 8px 0;line-height:1.6}.spoor button{all:unset;cursor:pointer;color:#8FE0A0;text-decoration:underline}.spoor b{color:#fff}
.wist{background:#16302A;border-left:3px solid #8FE0A0;border-radius:8px;padding:9px 11px;margin:10px 0 4px;font-size:14px;line-height:1.45}
.wist .lk{all:unset;cursor:pointer;color:#fff;font-weight:700;text-decoration:underline}
.kn2{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;background:#22343B;border-radius:8px;padding:9px;font-size:13.5px;color:#fff}.kn2:hover{background:#2E4750}
.meer{margin-top:8px;font-size:13.5px}.meer summary{cursor:pointer;color:var(--zacht)}
#verras{display:block;width:100%;margin:10px 0 2px;background:#00811F;color:#fff;border:0;border-radius:999px;padding:9px 14px;font:700 14px var(--font);cursor:pointer}#verras:hover{background:#00A028}
#hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:4;background:var(--paneel);color:var(--tekst);border-radius:12px;padding:10px 14px;font-size:13.5px;max-width:calc(100% - 28px);text-align:center}
#hint button{all:unset;cursor:pointer;border:1px solid #33454C;border-radius:999px;padding:4px 10px;margin:4px 2px 0}
.sluit{all:unset;cursor:pointer;float:right;font-size:20px;color:var(--zacht);line-height:1}
.bel{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;z-index:3;transition:opacity .25s;padding:8px;box-sizing:border-box}
.bel:hover{filter:brightness(1.25)}
.bel b{font:700 15px var(--font);color:#fff;text-shadow:0 0 6px #0E171B;line-height:1.15}
.bel span{font-size:11.5px;color:#DCE6E9;margin-top:4px;line-height:1.35;text-shadow:0 0 6px #0E171B}
#overhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;font-size:13px;color:var(--zacht);background:rgba(14,23,27,.7);border-radius:999px;padding:5px 12px;pointer-events:none}
.clab{position:absolute;transform:translate(-50%,-50%);font:700 15px var(--font);color:#fff;opacity:.55;pointer-events:none;white-space:nowrap;text-shadow:0 0 8px #0E171B;z-index:2;transition:opacity .2s}
#zoom{position:absolute;left:300px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:40px;height:40px;border-radius:10px;border:0;background:var(--paneel);color:#fff;font:700 20px var(--font);cursor:pointer}
#filters .kn{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;background:#22343B;border-radius:8px;padding:7px 9px;font-size:13px;color:#fff}#filters .kn:hover{background:#2E4750}
.sectie{margin-top:10px;font-size:13px}.sectie summary{cursor:pointer;color:#fff}
#jaarbord{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font:700 64px var(--font);color:#fff;opacity:.85;z-index:4;pointer-events:none;text-shadow:0 0 20px #0E171B}
.vv{border-top:1px solid #22343B;padding:2px 0}.vv summary{list-style:none;cursor:pointer;padding:9px 2px;display:flex;flex-direction:column;gap:3px}.vv summary::-webkit-details-marker{display:none}
.vv summary:hover .vv-paar{text-decoration:underline}.vv[open] summary{padding-bottom:4px}
.vv-paar{font-size:15px}.vv-plus{color:var(--zacht);margin:0 2px}.vv-dom{font-size:11.5px;color:var(--zacht)}.vv-uitleg{font-size:13.5px;line-height:1.45;color:var(--tekst)}
.vv-body{padding:0 2px 10px;font-size:13.5px;line-height:1.5}.vv-body p{margin:6px 0}
.vv-cit{margin:10px 0 6px;border-left:3px solid #8FE0A0}.vv-cit footer{margin-top:6px;font-size:12px;color:var(--zacht);line-height:1.45}
.vv-kop{font-size:12px;margin-top:8px}.vv-ook{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--zacht);line-height:1.45}.vv-ook li{margin-bottom:5px}
.vv-intro{font-size:13.5px;line-height:1.45;margin:4px 0 8px}.vv-noot{font-size:12px;line-height:1.45;margin-top:12px}
a.kn2{text-decoration:none}.vv-terug{all:unset;cursor:pointer;color:#8FE0A0;font-size:13px;display:block;margin-bottom:4px}
.hop{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid #22343B}.hop b{color:#fff}
#tel{font-size:12.5px;color:var(--zacht);margin-top:8px;line-height:1.4}
#klap{display:none}
@media (max-width:760px){#zoom{left:auto;right:14px;bottom:14px}.clab{font-size:11px}#filters h1{font-size:17px}#filters{width:auto;right:14px;max-height:45%}#filters.dicht .inh{display:none}#klap{display:inline;all:unset;cursor:pointer;float:right;color:#8FE0A0}
  #info{left:0;right:0;width:auto;top:auto;bottom:0;max-height:none;height:56%;border-radius:16px 16px 0 0}
  #graaf.open #sg,#graaf.open #clabs{bottom:56%}#graaf.open #filters,#graaf.open #zoom,#graaf.open #verras,#graaf.open #hint{display:none}
  .buren button{padding:7px 12px;font-size:14px}}
@media (max-width:760px){body.vk-open .rzt-hulp{display:none}}
</style></head><body>
<header class="balk"></header>
<div id="graaf">
  <div id="sg"></div><div id="vklaad" data-laad="Effe alle verbanden leggen…" style="position:absolute;inset:0;display:grid;place-items:center;z-index:3;color:#9FB0B6"></div><div id="bellen"></div><div id="clabs"></div><div id="hint"></div><div id="overhint">Tik op een domein om in te zoomen · scroll of knijp om te zoomen</div><div id="jaarbord"></div>
  <div class="pnl" id="filters"><button id="klap">filters</button>
    <h1>Verkenner <span class="tag" style="font-size:11px;background:#33454C;border-radius:4px;padding:1px 6px;font-weight:400">proef</span></h1>
    <button id="verras" type="button">🎲 Verras me</button>
    <div class="inh">
      <p class="sub" style="margin:4px 0 0;font-size:13px">Alles wat de raad zei en schreef als één web. Begrippen die vaak samen vallen, staan dicht bij elkaar. Zoom in, wijs aan, klik.</p>
      <label for="zk">Zoek een begrip</label><input id="zk" list="zkl" placeholder="bijv. scanauto, Tweebosbuurt, tramlijn" autocomplete="off"><datalist id="zkl"></datalist>
      <label for="fg">Gebied</label><select id="fg"><option value="">hele stad</option></select>
      <label for="fd">Domein</label><select id="fd"><option value="">alle domeinen</option></select>
      <label for="ff">Fractie (alleen debatten)</label><select id="ff"><option value="">alle fracties</option></select>
      <label>Periode</label><div class="rij2"><select id="fv"></select><select id="ft"></select></div>
      <label><input type="checkbox" id="fo" style="width:auto;margin-right:6px">alleen onderwerpen met een dossier</label>
      <label>Tijdmachine</label><div class="rij2"><button class="kn" id="speel">▶ Speel 2018 → 2026</button></div>
      <details class="sectie"><summary>Route van … naar …</summary>
        <input id="rv" list="zkl" placeholder="van, bijv. parkeren" style="margin-top:6px"><input id="rn" list="zkl" placeholder="naar, bijv. armoede" style="margin-top:6px">
        <button class="kn" id="route" style="margin-top:6px;display:block">Zoek de route</button></details>
      <details class="sectie"><summary>Vergelijk twee gebieden</summary>
        <div class="rij2" style="margin-top:6px"><select id="ca"></select><select id="cb"></select></div><button class="kn" id="verg" style="margin-top:6px;display:block">Vergelijk</button></details>
      <div class="rij2" style="margin-top:10px"><button class="kn" id="verr">Verrassende verbanden</button><button class="kn" id="foto" title="Kopieer als afbeelding">⧉ Afbeelding</button></div>
      <label>Kleur = domein waar een begrip het meest bij hoort</label><div class="leg" id="leg"></div>
      <div id="tel"></div>
    </div>
  </div>
  <aside class="pnl" id="info" aria-live="polite"></aside>
  <div id="zoom"><button id="zin" aria-label="Inzoomen">+</button><button id="zuit" aria-label="Uitzoomen">−</button><button id="zhel" aria-label="Alles tonen" style="font-size:14px">⤢</button></div>
</div>
<script src="ontwerp.js?v=39"></script>
<script src="lib/graphology.umd.min.js"></script>
<script src="lib/sigma.min.js"></script>
<script>
kop('verkenner');
const KL=['#7FD18B','#79B8F2','#F2A65A','#C39BF2','#5FD3C9','#F27BA8','#C9D46A','#F2D45A','#A9B8C0','#F27B6E','#9BE07A','#D9A27A','#8E9CF2'];
let G=null,R=null,DATA=null,VB=null,HOV=null,SEL=null,W={},BUREN={},F={g:'',d:'',f:'',v:0,t:8,o:false,dom:-1};
const nl=n=>Math.round(n).toLocaleString('nl-NL');
const el=id=>document.getElementById(id);
/* gewicht van een knoop onder de filters: aantal beurten/stukken in periode (en gebied/domein/fractie) */
function gewicht(i,k){
  const v=F.v,t=F.t;
  if(F.g!==''||F.d!==''||F.f!==''){
    let best=Infinity;
    const som=(lijst,want)=>lijst.reduce((a,[y,b,c])=>a+(y>=v&&y<=t&&b===want?c:0),0);
    if(F.g!=='')best=Math.min(best,som(DATA.jg[i],+F.g));
    if(F.d!=='')best=Math.min(best,som(DATA.jd[i],+F.d));
    if(F.f!=='')best=Math.min(best,som(DATA.jf[i],+F.f));
    return best;
  }
  let s=0;for(let y=v;y<=t;y++)s+=k.j[y];return s;
}
function herweeg(){
  let max=1,zicht=0;W={};
  DATA.knopen.forEach((k,i)=>{let w=gewicht(i,k);if(F.o&&k.s!=='o')w=0;if(F.dom>=0&&k.dom!==F.dom&&k.s!=='o')w=0;W[i]=w;if(w>max)max=w;});
  // met een filter: de ca. 600 knopen die daar het meest spelen, zodat elk gebied, domein, jaar of fractie een eigen web laat zien
  const gefilterd=F.g!==''||F.d!==''||F.f!==''||F.v>0||F.t<8;
  const ws=Object.values(W).filter(w=>w>0).sort((a,b)=>b-a);
  const drempel=gefilterd?Math.max(3,ws[Math.min(600,ws.length-1)]||3):3;
  G.forEachNode((n,a)=>{const w=W[n];const aan=w>=drempel;if(aan)zicht++;
    G.mergeNodeAttributes(n,{hidden:!aan,size:aan?(a.s==='o'?6:2)+(a.s==='o'?14:11)*Math.sqrt(w/max):1});});
  const ne=G.filterEdges((e,a,s,t)=>!G.getNodeAttribute(s,'hidden')&&!G.getNodeAttribute(t,'hidden')).length;
  el('tel').innerHTML=`<b style="color:#fff">${nl(zicht)}</b> begrippen en onderwerpen · <b style="color:#fff">${nl(ne)}</b> verbanden<br>uit ${nl(DATA.n)} debatbeurten en stukken, ${DATA.jaren[F.v]}–${DATA.jaren[F.t]}${F.g!==''?', '+DATA.geb[F.g]:''}${F.d!==''?', '+DATA.dom[F.d][1]:''}${F.f!==''?', '+DATA.par[F.f]:''}<br>Stand ${fd(DATA.stand)}`;
  clusterLabels();R&&R.refresh();bewaar();
}
function clusterLabels(){
  const acc={};G.forEachNode((n,a)=>{if(a.hidden)return;const d=a.dom;(acc[d]=acc[d]||{x:0,y:0,w:0});const w=a.size*a.size;acc[d].x+=a.x*w;acc[d].y+=a.y*w;acc[d].w+=w;});
  CL=Object.entries(acc).filter(([,v])=>v.w>200).map(([d,v])=>({d:+d,x:v.x/v.w,y:v.y/v.w}));
  plaatsLabels();
}
let CL=[],BEL=[],RANK={},NIV='over';
const gefilterd=()=>F.g!==''||F.d!==''||F.f!==''||F.v>0||F.t<8||F.o||F.dom>=0;
function niveau(){if(!R)return 'over';const r=R.getCamera().ratio;if(SEL!=null||PAD||VERG||gefilterd())return r>0.25?'mid':'dicht';return r>0.5?'over':r>0.22?'mid':'dicht';}
/* domeinbellen: middelpunt en straal van de begrippen per domein, met de vijf meest besproken */
function maakBellen(){const per={};DATA.knopen.forEach((k,i)=>{(per[k.dom]=per[k.dom]||[]).push([k,i]);});
  BEL=Object.entries(per).filter(([,l])=>l.length>=25).map(([d,l])=>{let sx=0,sy=0,sw=0;l.forEach(([k])=>{const w=Math.sqrt(k.n);sx+=k.x*w;sy+=-k.y*w;sw+=w;});const x=sx/sw,y=sy/sw;
    const af=l.map(([k])=>Math.hypot(k.x-x,-k.y-y)).sort((a,b)=>a-b);const top=l.filter(([k])=>k.s!=='p').sort((a,b)=>b[0].n-a[0].n).slice(0,5).map(([k])=>k.l);
    return {d:+d,x,y,r:af[Math.floor(af.length*.5)],n:l.length,top};});}
function tekenBellen(){const L=el('bellen');if(!R||NIV!=='over'){L.innerHTML='';el('overhint').style.display='none';return;}el('overhint').style.display='';
  const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
  // middelpunten op het scherm, grootte naar aantal begrippen; daarna uit elkaar duwen zodat ze niet overlappen
  const W=el('sg').clientWidth,H=el('sg').clientHeight,sch=Math.min(1,Math.min(W,H)/700);
  const P=BEL.map(b=>{const p=R.graphToViewport({x:b.x,y:b.y});return {b,x:p.x,y:p.y,r:(40+4.2*Math.sqrt(b.n))*sch};});
  for(let it=0;it<120;it++){for(let a=0;a<P.length;a++)for(let c=a+1;c<P.length;c++){const A=P[a],C=P[c];let dx=C.x-A.x,dy=C.y-A.y,d=Math.hypot(dx,dy)||1;const min=A.r+C.r+6;
      if(d<min){const m=(min-d)/2;dx/=d;dy/=d;A.x-=dx*m;A.y-=dy*m;C.x+=dx*m;C.y+=dy*m;}}
    P.forEach(q=>{q.x=Math.max(q.r+300*(W>760),Math.min(W-q.r-10,q.x));q.y=Math.max(q.r+40,Math.min(H-q.r-10,q.y));});}
  L.innerHTML=P.map(({b,x,y,r})=>`<div class="bel" data-d="${b.d}" style="left:${x}px;top:${y}px;width:${2*r}px;height:${2*r}px;border-color:rgba(${hx(KL[b.d])},.85);background:radial-gradient(circle,rgba(${hx(KL[b.d])},.34),rgba(${hx(KL[b.d])},.12))"><b>${esc(DATA.dom[b.d][1])}</b>${r>78?`<span>${b.top.slice(0,r>100?5:3).map(esc).join('<br>')}</span>`:''}</div>`).join('');}
el('bellen').addEventListener('click',e=>{const b=e.target.closest('.bel');if(!b)return;const B=BEL.find(x=>x.d===+b.dataset.d);const d=R.getNodeDisplayData(String(DATA.knopen.findIndex(k=>k.dom===B.d)));
  // naar het middelpunt van het domein (in 'framed' coordinaten van de camera)
  const p=R.graphToViewport({x:B.x,y:B.y}),c=R.viewportToFramedGraph(p);R.getCamera().animate({x:c.x,y:c.y,ratio:0.32},{duration:700});});
function plaatsLabels(){if(!R)return;const r=R.getCamera().ratio,nv=niveau();if(nv!==NIV){NIV=nv;R.refresh();}tekenBellen();
  el('clabs').innerHTML=CL.map(c=>{const p=R.graphToViewport({x:c.x,y:c.y});return `<div class="clab" style="left:${p.x}px;top:${p.y}px;color:${KL[c.d]};opacity:${NIV==='mid'?0.8:0}">${esc(DATA.dom[c.d][1])}</div>`;}).join('');}
/* paneel met details */
/* paneel met details: ingericht om door te klikken (spoor, 'wist je dat', dichtbij en over de grens, verras me) */
let SPOOR=[];
function paneel(n){
  SEL=n;const P=el('info');if(n==null){P.style.display='none';el('graaf').classList.remove('open');document.body.classList.remove('vk-open');pasAan();R.refresh();bewaar();return;}
  const i=+n,k=DATA.knopen[i];
  if(SPOOR[SPOOR.length-1]!==i){const w=SPOOR.indexOf(i);SPOOR=w>=0?SPOOR.slice(0,w+1):SPOOR.concat(i).slice(-8);}
  const zicht=([j])=>!G.getNodeAttribute(String(j),'hidden');
  const alle=(BUREN[i]||[]).filter(zicht);
  const nP=([j])=>DATA.knopen[j].s!=='p';
  const dicht=alle.filter(x=>nP(x)&&DATA.knopen[x[0]].dom===k.dom).slice(0,10),grens=alle.filter(x=>nP(x)&&DATA.knopen[x[0]].dom!==k.dom).slice(0,10),waar=alle.filter(x=>!nP(x)).slice(0,8);
  const wist=grens.filter(([j])=>DATA.knopen[j].s!=='p')[0];
  const dossiers=(BUREN[i]||[]).map(([j])=>DATA.knopen[j]).filter(x=>x.s==='o').slice(0,4);
  const jm=Math.max(...k.j,1),kort=l=>l.split(/,| en /)[0];
  const top=(arr,naam)=>arr.map((c,j)=>[c,j]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,4).map(([c,j])=>`${esc(naam(j))} <span class="sub">${nl(c)}</span>`).join(' · ');
  const chip=([j,w,c])=>{const x=DATA.knopen[j];return `<button data-n="${j}" title="${nl(c)} keer samen"><i style="background:${KL[x.dom]}"></i>${esc(x.l)}</button>`;};
  P.innerHTML=`<button class="sluit" aria-label="Sluiten" onclick="paneel(null)">×</button>
    ${SPOOR.length>1?`<div class="spoor" aria-label="Je route">${SPOOR.map((s,x)=>x===SPOOR.length-1?`<b>${esc(DATA.knopen[s].l)}</b>`:`<button data-n="${s}">${esc(DATA.knopen[s].l)}</button>`).join(' › ')}</div>`:''}
    <div class="sub">${k.s==='o'?'Onderwerp':k.s==='p'?'Plek':'Begrip'} · <span style="color:${KL[k.dom]}">${esc(DATA.dom[k.dom][1])}</span> · ${nl(k.j.reduce((x,y)=>x+y,0))} beurten en stukken</div><h2>${esc(k.l)}</h2>
    ${wist?`<div class="wist"><span class="sub">Wist je dat…</span><br>‘${esc(k.l)}’ opvallend vaak samen valt met <button data-n="${wist[0]}" class="lk">‘${esc(DATA.knopen[wist[0]].l)}’</button> uit ${esc(DATA.dom[DATA.knopen[wist[0]].dom][1])}? ${nl(wist[2])} keer. <a href="zoek.html?q=${encodeURIComponent(kort(k.l)+' '+kort(DATA.knopen[wist[0]].l))}">Lees waar →</a></div>`:''}
    ${dicht.length?`<div class="sub kopje">Dichtbij <span>· zelfde domein</span></div><div class="buren">${dicht.map(chip).join('')}</div>`:''}
