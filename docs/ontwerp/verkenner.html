<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Verkenner · raadzoeker</title>
<link rel="stylesheet" href="stijl.css?v=8">
<style>
:root{--doek:#0E171B;--paneel:rgba(19,30,35,.92);--tekst:#E8EEF0;--zacht:#9FB0B6}
html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;background:var(--doek);height:100dvh}
#graaf{flex:1;position:relative;min-height:0;background:radial-gradient(ellipse at 50% 45%,#16252B 0%,#0E171B 70%)}
#sg{position:absolute;inset:0}
.pnl{position:absolute;background:var(--paneel);color:var(--tekst);border-radius:12px;padding:14px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(6px);z-index:5}
.pnl a{color:#8FE0A0}.pnl .sub{color:var(--zacht)}
#filters{left:14px;top:14px;width:270px;max-height:calc(100% - 28px);overflow:auto}
#filters h1{font-size:20px;margin:0;color:#fff}
#filters label{display:block;font-size:12px;color:var(--zacht);margin:10px 0 3px}
#filters select,#filters input{width:100%;box-sizing:border-box;background:#0E171B;color:var(--tekst);border:1px solid #33454C;border-radius:8px;padding:7px 9px;font:14px var(--font)}
.rij2{display:flex;gap:6px}.rij2 select{flex:1}
.leg{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.leg button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2px 4px;border-radius:5px}
.leg button:hover,.leg button[aria-pressed="true"]{background:#22343B}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
#info{right:14px;top:14px;width:330px;max-height:calc(100% - 28px);overflow:auto;display:none}
#info h2{margin:2px 0 4px;font-size:22px;color:#fff}
#info .frag{background:#0E171B;border-radius:8px;padding:9px 11px;margin:8px 0;line-height:1.45;font-size:13.5px}
#info .frag mark{background:#2E5E3A;color:#fff}
.buren{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.buren button{all:unset;cursor:pointer;border:1px solid #33454C;border-radius:999px;padding:3px 9px;font-size:12.5px}
.buren button:hover{border-color:#8FE0A0}
.sluit{all:unset;cursor:pointer;float:right;font-size:20px;color:var(--zacht);line-height:1}
.clab{position:absolute;transform:translate(-50%,-50%);font:700 15px var(--font);color:#fff;opacity:.55;pointer-events:none;white-space:nowrap;text-shadow:0 0 8px #0E171B;z-index:2;transition:opacity .2s}
#zoom{position:absolute;left:300px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:40px;height:40px;border-radius:10px;border:0;background:var(--paneel);color:#fff;font:700 20px var(--font);cursor:pointer}
#filters .kn{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;background:#22343B;border-radius:8px;padding:7px 9px;font-size:13px;color:#fff}#filters .kn:hover{background:#2E4750}
.sectie{margin-top:10px;font-size:13px}.sectie summary{cursor:pointer;color:#fff}
#jaarbord{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font:700 64px var(--font);color:#fff;opacity:.85;z-index:4;pointer-events:none;text-shadow:0 0 20px #0E171B}
.hop{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid #22343B}.hop b{color:#fff}
#tel{font-size:12.5px;color:var(--zacht);margin-top:8px;line-height:1.4}
#klap{display:none}
@media (max-width:760px){#zoom{left:auto;right:14px;bottom:14px}.clab{font-size:11px}#filters h1{font-size:17px}#filters{width:auto;right:14px;max-height:45%}#filters.dicht .inh{display:none}#klap{display:inline;all:unset;cursor:pointer;float:right;color:#8FE0A0}
  #info{left:14px;right:14px;width:auto;top:auto;bottom:14px;max-height:55%}}
</style></head><body>
<header class="balk"></header>
<div id="graaf">
  <div id="sg"></div><div id="clabs"></div><div id="jaarbord"></div>
  <div class="pnl" id="filters"><button id="klap">filters</button>
    <h1>Verkenner <span class="tag" style="font-size:11px;background:#33454C;border-radius:4px;padding:1px 6px;font-weight:400">proef</span></h1>
    <div class="inh">
      <p class="sub" style="margin:4px 0 0;font-size:13px">Alles wat de raad zei en schreef als één web. Begrippen die vaak samen vallen, staan dicht bij elkaar. Zoom in, wijs aan, klik.</p>
      <label for="zk">Zoek een begrip</label><input id="zk" list="zkl" placeholder="bijv. wielklem, Tweebos, tramlijn" autocomplete="off"><datalist id="zkl"></datalist>
      <label for="fg">Gebied</label><select id="fg"><option value="">hele stad</option></select>
      <label for="fd">Domein</label><select id="fd"><option value="">alle domeinen</option></select>
      <label for="ff">Fractie (alleen debatten)</label><select id="ff"><option value="">alle fracties</option></select>
      <label>Periode</label><div class="rij2"><select id="fv"></select><select id="ft"></select></div>
      <label><input type="checkbox" id="fo" style="width:auto;margin-right:6px">alleen onderwerpen met een dossier</label>
      <label>Tijdmachine</label><div class="rij2"><button class="kn" id="speel">▶ Speel 2018 → 2026</button></div>
      <details class="sectie"><summary>Route van … naar …</summary>
        <input id="rv" list="zkl" placeholder="van, bijv. parkeren" style="margin-top:6px"><input id="rn" list="zkl" placeholder="naar, bijv. armoede" style="margin-top:6px">
        <button class="kn" id="route" style="margin-top:6px;display:block">Zoek de route</button></details>
      <details class="sectie"><summary>Vergelijk twee gebieden</summary>
        <div class="rij2" style="margin-top:6px"><select id="ca"></select><select id="cb"></select></div><button class="kn" id="verg" style="margin-top:6px;display:block">Vergelijk</button></details>
      <div class="rij2" style="margin-top:10px"><button class="kn" id="verr">Verrassende verbanden</button><button class="kn" id="foto" title="Kopieer als afbeelding">⧉ Afbeelding</button></div>
      <label>Kleur = domein waar een begrip het meest bij hoort</label><div class="leg" id="leg"></div>
      <div id="tel"></div>
    </div>
  </div>
  <aside class="pnl" id="info" aria-live="polite"></aside>
  <div id="zoom"><button id="zin" aria-label="Inzoomen">+</button><button id="zuit" aria-label="Uitzoomen">−</button><button id="zhel" aria-label="Alles tonen" style="font-size:14px">⤢</button></div>
</div>
<script src="ontwerp.js?v=11"></script>
<script src="lib/graphology.umd.min.js"></script>
<script src="lib/sigma.min.js"></script>
<script>
kop('verkenner');
const KL=['#7FD18B','#79B8F2','#F2A65A','#C39BF2','#5FD3C9','#F27BA8','#C9D46A','#F2D45A','#A9B8C0','#F27B6E','#9BE07A','#D9A27A','#8E9CF2'];
let G=null,R=null,DATA=null,VB=null,HOV=null,SEL=null,W={},BUREN={},F={g:'',d:'',f:'',v:0,t:8,o:false,dom:-1};
const nl=n=>Math.round(n).toLocaleString('nl-NL');
const el=id=>document.getElementById(id);
/* gewicht van een knoop onder de filters: aantal beurten/stukken in periode (en gebied/domein/fractie) */
function gewicht(i,k){
  const v=F.v,t=F.t;
  if(F.g!==''||F.d!==''||F.f!==''){
    let best=Infinity;
    const som=(lijst,want)=>lijst.reduce((a,[y,b,c])=>a+(y>=v&&y<=t&&b===want?c:0),0);
    if(F.g!=='')best=Math.min(best,som(DATA.jg[i],+F.g));
    if(F.d!=='')best=Math.min(best,som(DATA.jd[i],+F.d));
    if(F.f!=='')best=Math.min(best,som(DATA.jf[i],+F.f));
    return best;
  }
  let s=0;for(let y=v;y<=t;y++)s+=k.j[y];return s;
}
function herweeg(){
  let max=1,zicht=0;W={};
  DATA.knopen.forEach((k,i)=>{let w=gewicht(i,k);if(F.o&&k.s!=='o')w=0;if(F.dom>=0&&k.dom!==F.dom&&k.s!=='o')w=0;W[i]=w;if(w>max)max=w;});
  // met een filter: de ca. 600 knopen die daar het meest spelen, zodat elk gebied, domein, jaar of fractie een eigen web laat zien
  const gefilterd=F.g!==''||F.d!==''||F.f!==''||F.v>0||F.t<8;
  const ws=Object.values(W).filter(w=>w>0).sort((a,b)=>b-a);
  const drempel=gefilterd?Math.max(3,ws[Math.min(600,ws.length-1)]||3):3;
  G.forEachNode((n,a)=>{const w=W[n];const aan=w>=drempel;if(aan)zicht++;
    G.mergeNodeAttributes(n,{hidden:!aan,size:aan?(a.s==='o'?6:2)+(a.s==='o'?14:11)*Math.sqrt(w/max):1});});
  const ne=G.filterEdges((e,a,s,t)=>!G.getNodeAttribute(s,'hidden')&&!G.getNodeAttribute(t,'hidden')).length;
  el('tel').innerHTML=`<b style="color:#fff">${nl(zicht)}</b> begrippen en onderwerpen · <b style="color:#fff">${nl(ne)}</b> verbanden<br>uit ${nl(DATA.n)} debatbeurten en stukken, ${DATA.jaren[F.v]}–${DATA.jaren[F.t]}${F.g!==''?', '+DATA.geb[F.g]:''}${F.d!==''?', '+DATA.dom[F.d][1]:''}${F.f!==''?', '+DATA.par[F.f]:''}<br>Stand ${fd(DATA.stand)}`;
  clusterLabels();R&&R.refresh();bewaar();
}
function clusterLabels(){
  const acc={};G.forEachNode((n,a)=>{if(a.hidden)return;const d=a.dom;(acc[d]=acc[d]||{x:0,y:0,w:0});const w=a.size*a.size;acc[d].x+=a.x*w;acc[d].y+=a.y*w;acc[d].w+=w;});
  CL=Object.entries(acc).filter(([,v])=>v.w>200).map(([d,v])=>({d:+d,x:v.x/v.w,y:v.y/v.w}));
  plaatsLabels();
}
let CL=[];
function plaatsLabels(){if(!R)return;const r=R.getCamera().ratio;
  el('clabs').innerHTML=CL.map(c=>{const p=R.graphToViewport({x:c.x,y:c.y});return `<div class="clab" style="left:${p.x}px;top:${p.y}px;color:${KL[c.d]};opacity:${r>0.45?0.75:0}">${esc(DATA.dom[c.d][1])}</div>`;}).join('');}
/* paneel met details */
function paneel(n){
  SEL=n;const P=el('info');if(n==null){P.style.display='none';R.refresh();bewaar();return;}
  const i=+n,k=DATA.knopen[i],a=G.getNodeAttributes(n);
  const bur=(BUREN[i]||[]).filter(([j])=>!G.getNodeAttribute(String(j),'hidden')).slice(0,14);
  const dossiers=(BUREN[i]||[]).map(([j])=>DATA.knopen[j]).filter(x=>x.s==='o').slice(0,4);
  const jm=Math.max(...k.j,1);
  const top=(arr,naam)=>arr.map((c,j)=>[c,j]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,4).map(([c,j])=>`${esc(naam(j))} <span class="sub">${nl(c)}</span>`).join(' · ');
  P.innerHTML=`<button class="sluit" aria-label="Sluiten" onclick="paneel(null)">×</button>
    <div class="sub">${k.s==='o'?'Onderwerp':k.s==='p'?'Plek':'Begrip'} · <span style="color:${KL[k.dom]}">${esc(DATA.dom[k.dom][1])}</span></div><h2>${esc(k.l)}</h2>
    <div>In <b>${nl(k.n)}</b> tekstvensters, ${nl(k.j.reduce((x,y)=>x+y,0))} beurten en stukken</div>
    <svg viewBox="0 0 270 48" style="width:100%;margin:8px 0 0">${k.j.map((v,y)=>`<rect x="${y*30}" y="${36-34*v/jm}" width="24" height="${34*v/jm}" rx="2" fill="${y>=F.v&&y<=F.t?KL[k.dom]:'#33454C'}"/><text x="${y*30+12}" y="47" font-size="9" text-anchor="middle" fill="#9FB0B6">'${DATA.jaren[y].slice(2)}</text>`).join('')}</svg>
    <div id="vb"></div>
    <div class="sub" style="margin-top:8px">Domeinen</div><div>${top(k.dm,j=>DATA.dom[j][1])||'–'}</div>
    <div class="sub" style="margin-top:6px">Gebieden</div><div>${top(k.g,j=>DATA.geb[j])||'stadsbreed'}</div>
    <div class="sub" style="margin-top:10px">Hangt samen met</div><div class="buren">${bur.map(([j,w,c])=>`<button data-n="${j}" title="${nl(c)} keer samen">${esc(DATA.knopen[j].l)}</button>`).join('')}</div>
    <div style="margin-top:12px;display:grid;gap:5px">
      ${k.slug?`<a href="dossier.html#${k.slug}">Naar het dossier ${esc(k.l)} →</a>`:''}
      ${dossiers.filter(x=>x.slug!==k.slug).map(x=>`<a href="dossier.html#${x.slug}">Dossier in de buurt: ${esc(x.l)} →</a>`).join('')}
      <a href="zoek.html?q=${encodeURIComponent(k.s==='o'?k.l.split(/,| en /)[0]:k.l)}">Zoek alles over '${esc(k.l)}' →</a>
      ${F.g!==''?`<a href="wijk.html?g=${slug(DATA.geb[F.g])}">Gebiedspagina ${esc(DATA.geb[F.g])} →</a>`:''}
    </div>`;
  P.style.display='block';
  P.querySelectorAll('.buren button').forEach(b=>b.onclick=()=>{kies(b.dataset.n,true);});
  laadVb().then(()=>{const v=VB[k.id];if(!v||SEL!==n)return;const rx=new RegExp('('+k.l.replace(/[^\p{L}\p{N} ]/gu,'').split(/ /)[0].slice(0,Math.max(4,k.l.length-2))+'\\p{L}*)','giu');
    el('vb').innerHTML=`<div class="frag">${esc(v.f).replace(rx,'<mark>$1</mark>')}</div><div class="sub" style="font-size:12.5px">${esc(v.w)}${v.p?' ('+esc(v.p)+')':''} · ${esc(v.v)} · ${fd(v.d)}</div>`;});
  R.refresh();bewaar();
}
const laadVb=()=>VB?Promise.resolve():fetch('verkenner-vb.json').then(r=>r.json()).then(j=>{VB=j;});
function kies(n,camera){paneel(n);if(camera){const d=R.getNodeDisplayData(n);if(d)R.getCamera().animate({x:d.x,y:d.y,ratio:Math.min(R.getCamera().ratio,0.35)},{duration:600});}}
/* tekenen: buren van aangewezen of gekozen knoop lichten op */
let PAD=null,PADE=null,VERG=null;
function nodeReducer(n,a){const r={...a};const f=HOV??SEL;
  if(VERG&&VERG[n]!=null)r.color=VERG[n];
  if(PAD&&HOV==null){if(PAD.has(n)){r.forceLabel=true;r.zIndex=3;r.size=Math.max(a.size,7);}else{r.color='#26353B';r.label='';}return r;}
  if(f!=null){const i=+n;if(n===f){r.highlighted=true;r.forceLabel=true;r.zIndex=3;}else if(BUREN[+f]&&BUREN[+f].some(([j])=>j===i)){r.forceLabel=true;r.zIndex=2;}else{r.color='#2A3A40';r.label='';r.zIndex=0;}}
  return r;}
function edgeReducer(e,a){const r={...a};const f=HOV??SEL;
  if(PAD&&HOV==null){if(PADE.has(e)){r.color='#FFFFFF';r.size=3;r.zIndex=3;}else r.hidden=true;return r;}
  if(f==null&&(a.hub||!a.kern)){r.hidden=true;return r;}
  if(f!=null){const [s,t]=G.extremities(e);if(s===f||t===f){r.color='rgba(255,255,255,.55)';r.size=Math.max(1,a.size*1.6);r.zIndex=2;}else r.hidden=true;}
  return r;}
function tekenHover(ctx,data,st){const fs=st.labelSize+2,lab=data.label||'';ctx.font=`700 ${fs}px Arial`;const w=ctx.measureText(lab).width;
  ctx.fillStyle='rgba(14,23,27,.92)';ctx.beginPath();ctx.roundRect(data.x+data.size+3,data.y-fs/2-5,w+14,fs+10,6);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(lab,data.x+data.size+10,data.y+fs/3);ctx.beginPath();ctx.arc(data.x,data.y,data.size+2,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
/* link: #n=<id>&g=..&d=..&f=..&v=..&t=.. */
function bewaar(){const p=[];if(SEL!=null)p.push('n='+encodeURIComponent(DATA.knopen[+SEL].id));['g','d','f'].forEach(k=>F[k]!==''&&p.push(k+'='+F[k]));if(F.v)p.push('v='+F.v);if(F.t!==8)p.push('t='+F.t);if(F.o)p.push('o=1');if(F.dom>=0)p.push('k='+F.dom);history.replaceState(null,'','#'+p.join('&'));}
function lees(){const h=new URLSearchParams(location.hash.slice(1));['g','d','f'].forEach(k=>{if(h.has(k))F[k]=h.get(k);});if(h.has('v'))F.v=+h.get('v');if(h.has('t'))F.t=+h.get('t');F.o=h.get('o')==='1';if(h.has('k'))F.dom=+h.get('k');return h.get('n');}
fetch(new URLSearchParams(location.search).get('bron')||'verkenner.json').then(r=>r.json()).then(D=>{
  DATA=D;G=new graphology.Graph({type:'undirected'});
  D.knopen.forEach((k,i)=>G.addNode(String(i),{x:k.x,y:-k.y,label:k.l,size:3,color:KL[k.dom],dom:k.dom,s:k.s,forceLabel:false}));
  const em=Math.max(...D.e.map(e=>e[2]));
  const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
  D.e.forEach(([a,b,w,c])=>{const k=D.knopen[a].s==='o'?D.knopen[b]:D.knopen[a];G.addEdge(String(a),String(b),{hub:D.knopen[a].s==='o'||D.knopen[b].s==='o',size:0.3+1.2*w/em,color:`rgba(${hx(KL[k.dom])},${0.07+0.18*w/em})`});(BUREN[a]=BUREN[a]||[]).push([b,w,c]);(BUREN[b]=BUREN[b]||[]).push([a,w,c]);});
  Object.values(BUREN).forEach(l=>l.sort((x,y)=>y[1]*Math.log(1+y[2])-x[1]*Math.log(1+x[2])));
  // rustig beeld: standaard alleen de 3 sterkste verbanden per knoop, de rest bij aanwijzen
  Object.entries(BUREN).forEach(([a,l])=>l.slice(0,3).forEach(([b])=>{const e=G.edge(String(a),String(b));if(e)G.setEdgeAttribute(e,'kern',true);}));
  D.geb.forEach((g,i)=>{['fg','ca','cb'].forEach(s=>el(s).insertAdjacentHTML('beforeend',`<option value="${i}">${esc(g)}</option>`));});el('ca').value=D.geb.indexOf('Delfshaven');el('cb').value=D.geb.indexOf('Prins Alexander');
  D.dom.forEach(([s,n],i)=>el('fd').insertAdjacentHTML('beforeend',`<option value="${i}">${esc(n)}</option>`));
  D.par.map((p,i)=>[p,i]).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([p,i])=>el('ff').insertAdjacentHTML('beforeend',`<option value="${i}">${esc(p)}</option>`));
  D.jaren.forEach((j,i)=>{el('fv').insertAdjacentHTML('beforeend',`<option value="${i}">van ${j}</option>`);el('ft').insertAdjacentHTML('beforeend',`<option value="${i}">t/m ${j}</option>`);});
  el('zkl').innerHTML=D.knopen.map(k=>`<option value="${esc(k.l)}">`).join('');
  el('leg').innerHTML=D.dom.map(([s,n],i)=>`<button data-d="${i}" aria-pressed="false"><i style="background:${KL[i]}"></i>${esc(n)}</button>`).join('');
  const n0=lees();
  ['g','d','f'].forEach(k=>el('f'+k).value=F[k]);el('fv').value=F.v;el('ft').value=F.t;el('fo').checked=F.o;
  R=new Sigma(G,el('sg'),{nodeReducer,edgeReducer,defaultDrawNodeHover:tekenHover,labelColor:{color:'#E8EEF0'},labelFont:'Arial',labelSize:12,labelWeight:'400',
    labelRenderedSizeThreshold:7,labelDensity:0.6,labelGridCellSize:90,zIndex:true,minCameraRatio:0.03,maxCameraRatio:3,stagePadding:40});
  herweeg();
  R.getCamera().on('updated',plaatsLabels);
  R.on('enterNode',({node})=>{HOV=node;R.refresh();el('sg').style.cursor='pointer';});
  R.on('leaveNode',()=>{HOV=null;R.refresh();el('sg').style.cursor='';});
  R.on('clickNode',({node})=>kies(node,false));
  R.on('clickStage',()=>{PAD=null;paneel(null);});
  if(n0){const i=D.knopen.findIndex(k=>k.id===n0);if(i>=0)setTimeout(()=>kies(String(i),true),300);}
});
['g','d','f'].forEach(k=>el('f'+k).onchange=e=>{F[k]=e.target.value;herweeg();if(SEL!=null)paneel(SEL);});
el('fv').onchange=e=>{F.v=+e.target.value;if(F.t<F.v){F.t=F.v;el('ft').value=F.t;}herweeg();};
el('ft').onchange=e=>{F.t=+e.target.value;if(F.v>F.t){F.v=F.t;el('fv').value=F.v;}herweeg();};
el('fo').onchange=e=>{F.o=e.target.checked;herweeg();};
el('leg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=+b.dataset.d;F.dom=F.dom===d?-1:d;el('leg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.d===F.dom));herweeg();};
el('zk').onchange=e=>{const i=zoekKnoop(e.target.value);if(i<0){el('zk').setCustomValidity('Niet gevonden');el('zk').reportValidity();setTimeout(()=>el('zk').setCustomValidity(''),1500);return;}{if(G.getNodeAttribute(String(i),'hidden')){F.g=F.d=F.f='';F.o=false;F.dom=-1;['g','d','f'].forEach(k=>el('f'+k).value='');el('fo').checked=false;herweeg();}kies(String(i),true);}};
el('zin').onclick=()=>R.getCamera().animatedZoom({duration:300});el('zuit').onclick=()=>R.getCamera().animatedUnzoom({duration:300});el('zhel').onclick=()=>R.getCamera().animatedReset({duration:400});
/* ---- C: tijdmachine ---- */
let SPEEL=null;
el('speel').onclick=()=>{if(SPEEL){stopSpeel();return;}const o={v:F.v,t:F.t};let y=0;el('speel').textContent='■ Stop';
  const stap=()=>{if(y>8){stopSpeel(o);return;}F.v=y;F.t=y;el('fv').value=y;el('ft').value=y;el('jaarbord').textContent=DATA.jaren[y];herweeg();y++;};stap();SPEEL=setInterval(stap,1600);};
function stopSpeel(o){clearInterval(SPEEL);SPEEL=null;el('speel').textContent='▶ Speel 2018 → 2026';el('jaarbord').textContent='';if(o){F.v=o.v;F.t=o.t;}else{F.v=0;F.t=8;}el('fv').value=F.v;el('ft').value=F.t;herweeg();}
/* ---- C: route van X naar Y (kortste weg over sterke verbanden) ---- */
const zoekKnoop=q=>{q=(q||'').trim().toLowerCase();if(!q)return -1;let i=DATA.knopen.findIndex(k=>k.l.toLowerCase()===q);if(i<0)i=DATA.knopen.findIndex(k=>k.l.toLowerCase().startsWith(q));if(i<0)i=DATA.knopen.findIndex(k=>k.l.toLowerCase().includes(q));return i;};
el('route').onclick=()=>{const a=zoekKnoop(el('rv').value),b=zoekKnoop(el('rn').value);if(a<0||b<0){alert('Kies twee begrippen uit de lijst.');return;}
  const dist=new Map([[a,0]]),van=new Map(),open=new Set([a]),klaar=new Set();
  while(open.size){let u=-1,du=Infinity;open.forEach(x=>{if(dist.get(x)<du){du=dist.get(x);u=x;}});open.delete(u);if(u===b)break;klaar.add(u);
    (BUREN[u]||[]).forEach(([v,w])=>{if(klaar.has(v))return;const nd=du+(1/(w+0.05))*(DATA.knopen[v].s==='p'&&v!==b?4:1);if(nd<(dist.get(v)??Infinity)){dist.set(v,nd);van.set(v,u);open.add(v);}});}
  if(!dist.has(b)){alert('Geen route gevonden.');return;}
  const pad=[b];while(pad[0]!==a)pad.unshift(van.get(pad[0]));
  PAD=new Set(pad.map(String));PADE=new Set();for(let i=1;i<pad.length;i++){const e=G.edge(String(pad[i-1]),String(pad[i]));if(e)PADE.add(e);}
  pad.forEach(i=>G.setNodeAttribute(String(i),'hidden',false));
  SEL=null;const P=el('info');P.style.display='block';
  const kort=l=>l.split(/,| en /)[0];
  P.innerHTML=`<button class="sluit" aria-label="Sluiten" onclick="PAD=null;paneel(null)">×</button><div class="sub">Route in ${pad.length-1} stappen</div><h2>${esc(DATA.knopen[a].l)} → ${esc(DATA.knopen[b].l)}</h2>
    ${pad.slice(1).map((j,i)=>{const p=pad[i],c=(BUREN[p].find(x=>x[0]===j)||[0,0,0])[2];return `<div class="hop"><span>${i+1}.</span><div><b>${esc(DATA.knopen[p].l)}</b> + <b>${esc(DATA.knopen[j].l)}</b><br><span class="sub">${nl(c)} keer samen genoemd</span> · <a href="zoek.html?q=${encodeURIComponent(kort(DATA.knopen[p].l)+' '+kort(DATA.knopen[j].l))}">lees waar →</a></div></div>`;}).join('')}
    <p class="sub" style="font-size:12.5px">De route volgt de sterkste verbanden. Hij laat zien hoe onderwerpen in de praktijk samen besproken worden, niet dat het een het ander veroorzaakt.</p>`;
  const xs=pad.map(i=>R.getNodeDisplayData(String(i))).filter(Boolean);const cx=xs.reduce((s,d)=>s+d.x,0)/xs.length,cy=xs.reduce((s,d)=>s+d.y,0)/xs.length;
  R.getCamera().animate({x:cx,y:cy,ratio:0.8},{duration:600});R.refresh();};
/* ---- C: verrassende verbanden: sterk samen, maar uit verschillende domeinen ---- */
el('verr').onclick=()=>{PAD=null;const K=DATA.knopen;
  // uit verschillende domeinen, allebei geen plek, vaak genoeg, geen vaste woordcombinatie (niet bijna altijd samen) en geen variant van hetzelfde woord
  const L=DATA.e.filter(([a,b,w,c])=>c>=30&&K[a].dom!==K[b].dom&&K[a].s!=='p'&&K[b].s!=='p'&&K[a].n>=150&&K[b].n>=150&&c/Math.min(K[a].n,K[b].n)<0.25
      &&K[a].l.slice(0,6).toLowerCase()!==K[b].l.slice(0,6).toLowerCase()&&!G.getNodeAttribute(String(a),'hidden')&&!G.getNodeAttribute(String(b),'hidden'))
    .sort((x,y)=>y[2]*Math.log(y[3])-x[2]*Math.log(x[3])).slice(0,20);
  const P=el('info');P.style.display='block';SEL=null;R.refresh();
  P.innerHTML=`<button class="sluit" aria-label="Sluiten" onclick="paneel(null)">×</button><div class="sub">Begrippen uit verschillende domeinen die opvallend vaak samen vallen</div><h2>Verrassende verbanden</h2>
    ${L.map(([a,b,w,c])=>{const A=DATA.knopen[a],B=DATA.knopen[b];return `<div class="hop"><div><button class="lk" data-a="${a}" data-b="${b}" style="all:unset;cursor:pointer"><b style="color:${KL[A.dom]}">${esc(A.l)}</b> + <b style="color:${KL[B.dom]}">${esc(B.l)}</b></button><br><span class="sub">${esc(DATA.dom[A.dom][1])} × ${esc(DATA.dom[B.dom][1])} · ${nl(c)} keer</span> · <a href="zoek.html?q=${encodeURIComponent(A.l+' '+B.l)}">lees waar →</a></div></div>`;}).join('')}`;
  P.querySelectorAll('.lk').forEach(x=>x.onclick=()=>{el('rv').value=DATA.knopen[x.dataset.a].l;el('rn').value=DATA.knopen[x.dataset.b].l;el('route').click();});};
/* ---- C: vergelijk twee gebieden: kleur van groen (meer in A) naar oranje (meer in B) ---- */
el('verg').onclick=()=>{const a=+el('ca').value,b=+el('cb').value;if(a===b){VERG=null;herweeg();return;}
  const sa=[],sb=[];let ta=0,tb=0;DATA.knopen.forEach((k,i)=>{const x=DATA.jg[i].reduce((s,[y,g,c])=>s+(y>=F.v&&y<=F.t&&g===a?c:0),0),z=DATA.jg[i].reduce((s,[y,g,c])=>s+(y>=F.v&&y<=F.t&&g===b?c:0),0);sa[i]=x;sb[i]=z;ta+=x;tb+=z;});
  const mx=Math.max(1,...sa.map((x,j)=>x+sb[j]));
  VERG={};G.forEachNode((n)=>{const i=+n,pa=(sa[i]+.5)/ta,pb=(sb[i]+.5)/tb,t=Math.max(-1,Math.min(1,Math.log(pa/pb)/2));
    VERG[n]=t>=0?`rgb(${Math.round(150-110*t)},${Math.round(160+50*t)},${Math.round(165-95*t)})`:`rgb(${Math.round(150+92*-t)},${Math.round(160-5*-t)},${Math.round(165-110*-t)})`;
    const w=sa[i]+sb[i];G.mergeNodeAttributes(n,{hidden:w<3,size:2+11*Math.sqrt(w/mx)});});
  const P=el('info');P.style.display='block';SEL=null;
  const top=(f)=>DATA.knopen.map((k,i)=>[k,i]).filter(([k,i])=>sa[i]+sb[i]>=25&&k.s!=='p').sort((x,y)=>f(y[1])*Math.sqrt(sa[y[1]]+sb[y[1]])-f(x[1])*Math.sqrt(sa[x[1]]+sb[x[1]])).slice(0,12).map(([k,i])=>`<button class="lk2" data-n="${i}" style="all:unset;cursor:pointer">${esc(k.l)}</button>`).join(' · ');
  P.innerHTML=`<button class="sluit" aria-label="Sluiten" onclick="VERG=null;herweeg();paneel(null)">×</button><div class="sub">Vergelijk</div><h2><span style="color:#28D244">${esc(DATA.geb[a])}</span> en <span style="color:#F29B37">${esc(DATA.geb[b])}</span></h2>
    <p class="sub">Groen = speelt naar verhouding meer in ${esc(DATA.geb[a])}, oranje = meer in ${esc(DATA.geb[b])}, grijs = in beide even vaak.</p>
    <div class="sub">Kenmerkend voor ${esc(DATA.geb[a])}</div><div>${top(i=>Math.log((sa[i]+.5)/ta/((sb[i]+.5)/tb)))}</div>
    <div class="sub" style="margin-top:8px">Kenmerkend voor ${esc(DATA.geb[b])}</div><div>${top(i=>Math.log((sb[i]+.5)/tb/((sa[i]+.5)/ta)))}</div>`;
  P.querySelectorAll('.lk2').forEach(x=>x.onclick=()=>kies(x.dataset.n,true));R.refresh();};
/* ---- C: kopieer als afbeelding (met titel, filter, bron en datum) ---- */
el('foto').onclick=async()=>{const cs=R.getCanvases?R.getCanvases():{};const c0=cs.nodes||Object.values(cs)[0];if(!c0)return;
  const W=c0.width,H=c0.height,s=W/c0.clientWidth,c=document.createElement('canvas');c.width=W;c.height=H+90*s;const x=c.getContext('2d');
  x.fillStyle='#0E171B';x.fillRect(0,0,c.width,c.height);['edges','nodes','labels','hovers','hoverNodes'].forEach(k=>cs[k]&&x.drawImage(cs[k],0,0));
  x.fillStyle='#fff';x.font=`700 ${22*s}px Arial`;x.fillText('Verkenner · raadzoeker',16*s,H+32*s);
  x.fillStyle='#9FB0B6';x.font=`${14*s}px Arial`;x.fillText(el('tel').innerText.replace(/\n/g,' · ').slice(0,180),16*s,H+56*s);x.fillText(location.href,16*s,H+78*s);
  c.toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);el('foto').textContent='✓ Gekopieerd';}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='verkenner.png';a.click();el('foto').textContent='✓ Opgeslagen';}setTimeout(()=>el('foto').textContent='⧉ Afbeelding',2000);});};
el('klap').onclick=()=>el('filters').classList.toggle('dicht');
if(innerWidth<760)el('filters').classList.add('dicht');
</script></body></html>
